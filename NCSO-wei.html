tting\nThe observer must be competent in the job or task to be observed and the \nability to do effective observations\nAccurate records must be kept of who was assessed, when it happened, what \nmethod was used, what were the results, and who performed the assessment.\nLearning Check (Objective 25)\nDescribe methods used for \ninternal assessments.","82":"7. Other Parties at or in the Vicinity of the Work Site\nIntroduction\nAll employers are responsible for health and safety on a work site. This \nincludes contractors and contracted employers. They are also responsible for \nworkers and other parties at or near the work site.\nOHS Definitions of Work Site Parties\nNote: Employers, supervisors, and workers are also work site parties.\nSummary of OHS Definitions\nContracting \nEmployer\nA person, partnership, or group of persons who, through a contract, an agreement or \nownership, direct the activities of one or more employers or self-employed persons at \na work site.\nOwner\nThe person who is registered under the Land Titles Act as the owner of the land on \nwhich work is being carried out or may be carried out, or the person who enters into \nan agreement with the owner to be responsible for meeting the owner’s obligations \nunder this Act, the regulations and the OHS Code, but does not include a person who \noccupies land or premises used as a private residence unless a business, trade or \nprofession is carried on in that premises.\nService Provider A person who provides training, consulting, testing, program development, or other \nservices in respect of any occupation or work site.\nSupplier\nA person who sells, rents, leases, erects, installs, or provides any tools, appliances, \npersonal protective equipment or equipment or who sells or otherwise provides any \nharmful substance or explosive to be used by a worker in respect of any occupation or \nwork site.\nTemporary \nStaffing Agency\nA person who retains workers and deploys or facilitates the placement of workers with \nother employers.\nPIR definition of Contracting Employer\nAn employer hiring a contracted employer \nPIR definition of Contracted Employer\nAn employer hired by a contractor\nPIR definition of Visitor\nAny person at a work site who is not under the direct control of the employer\n(This is not a legal definition under OHS)\nLearning Check (Objective 26)\nDescribe the work site parties \nidentified in the OHS Act.","83":"OHS Obligations of Work Site Parties\nSummary of OHS Obligations (Responsibilities)\nTitle/Section Comments\nContracting \nEmployer\ns.8\n• Ensure employers comply with OHS legislation\n• Ensure other work site parties are informed of existing or potential hazards that \nmay affect them at the work site \n• Cooperate with others who are exercising their duties under the OHS legislation\nOwner\ns.9\n• Ensure the land, infrastructure, and buildings are maintained\n• Ensure other work site parties are informed of existing or potential hazards in \nrelation to the land, infrastructure, and buildings\n• Cooperate with others exercising their duties under OHS legislation\nService \nProviders\ns.7\n• Ensure services provided comply with the OHS legislation\n• Ensure services provided are completed by competent workers\n• Ensure no one at or near a work site is in danger from activities at the work site\n• Cooperate with others exercising their duties under OHS legislation\nSuppliers\ns.6\n• Ensure PPE or equipment they supply is in safe operating condition\n• Ensure any harmful or explosive substance they supply is safe to use\n• Ensure equipment is maintained in a safe condition\n• Provide notice to employers if PPE or equipment does not comply with standards\n• Provide notice to employers if harmful or explosive substances does not comply \nwith standards\n• Ensure PPE or equipment complies with OHS legislation\n• Ensure manufacturer’s specifications are supplied with PPE, equipment, and \nharmful or explosive substances (if they exist)\n• Cooperate with others exercising their duties under OHS legislation\nTemporary \nStaffing \nAgencies\ns.11\n• Ensure the worker assigned to another employer is suitable to the task\n• Ensure the worker is equipped with necessary PPE before starting work\n• Ensure the other employer can ensure the health and safety of the worker\n• Cooperate with others exercising their duties under OHS legislation\nIf a person has two or more functions or set of obligations at a work site, the person must meet all of \nthem (OHS Act s.12)","84":"Contracting Employer Responsibilities\nIn addition to their legislated responsibilities in s.8 of the OHS Act, \ncontracting employers have the same responsibilities as all employers. They \nmay have other responsibilities if they have other roles. They must meet the \nresponsibilities of each role. Shown below are two common situations.\nExample 1\nExample 2\nEmployer\n+\nPrime Contractor\n+\nContracting Employer\nSupervisor\nWorker\nWorker\nWorker\nEmployer\n+\nContracted Employer\n+\nContracting Employer\nWorker\nWorker\nWorker\nEmployer\n+\nContracted Employer\nWorker\nWorker\nThe employer may \nalso be the owner.\nThe employer may \nalso be an owner.\nEmployer\nWorker Worker Worker\nLearning Check (Objective 27)\nDescribe contracting employer \nresponsibilities.","85":"Contracted Employer Management Process\nEmployers must have a system in place to manage health and safety at the \nwork site. An HSMS helps protect all contracting employers, contracted \nemployers, visitors, other employers not under the direct control of the \nemployer and the public. An important part of an HSMS is a process for \nmanaging contracted employers. A written process helps employers select \nand manage parties at the work site.\nA contractor and contracted employer management process helps make sure \nall parties know their roles and responsibilities. There are three basic steps \nin the process. Employers should repeat the steps each time they contract \nanother employer.\n3. Monitoring, Evaluation,\nand Feedback\n• Monitor contracted employers\n• Evaluate contracted employers\n• Provide feedback\n1. Pre-Qualification and \nSelection\n• Establish a process\n• Determine requirements\n• Assess contracted employers\n• Select a contracted employer\n2. The Pre-Project Meeting\n• Review scope of work\n• Review project safety plan\n• Collect documentation\nLearning Check (Objective 28)\nDescribe the contracted employer \nmanagement process.","86":"Project Safety Plans (PSPs)\nPSPs are one way to identify key topics and considerations for a work site. \nPSPs also assign responsibilities to work site parties. This includes a way to \ncommunicate information to affected parties. PSPs will vary depending on \nthe project’s scope of work.\nSome of the common elements in a PSP are in the list below.\n• Project safety policy\n• Roles and responsibilities\n• HSC/HSR\n• Emergency response procedures\n• Incident reporting and investigation\n• Hazard assessments\n• Orientations\n• Training\n• Personal protective equipment\n• Inspections\n• Meetings \n• Communications\n• Hazardous products\n• Confined spaces\n• Environmental considerations\n• Excavation and trenching\n• Fall protection\n• Hoisting and rigging\n• Safeguarding\n• Scaffolds and work platforms\n• Traffic control\n• Temporary utilities\n• Work site requirements\nThere are two key elements of a PSP that must be readily available to all \naffected work site parties. These are hazard assessments and inspection \nreports.\nHazard Assessments\nIf employers cannot eliminate hazards, they must control them. Step seven of \nthe 9-step formal hazard assessment model is communicating hazards and \ncontrols. This means employers must have copies of hazard assessments \nreadily available for all affected work site parties. This is important because \nother employers and affected work site parties need to know what hazards \nthey will face to create safe work sites.\nInspection Reports\nInspections are one way to provide feedback on how an HSMS is operating. \nWork site conditions and work in progress may influence different work site \nparties. It is important that employers have a plan to communicate this \ninformation to everyone affected.\nLearning Check (Objective 29)\nIdentify the two key elements of a PSP that must \nbe readily available to all work site parties.","93":"8. Inspections\nIntroduction\nInspections are an important part of the HSMS because they are one way to \ngenerate feedback on how it is performing. This feedback focuses on several \nkey inspection-related issues the HSMS must address.\n• Have all hazards and potential hazards been identified?\n• Are supervisors and workers complying with legislation? \n• Are supervisors and workers following rules and procedures?\n• Have potential direct causes of hazards been identified?\n• Is there monitoring of hazard controls?\n• Are proper corrective actions being developed? \n• Does the company understand the jobs and tasks being done?\nThere are four basic areas \ninspections should look at.\n• People\n• Equipment\n• Materials\n• Environment\nLearning Check (Objective 30)\nList at least five key inspection-related issues of \nthe HSMS that inspections should focus on.\nThis work site has all four elements of P.E.M.E. \nthat should be looked at during an inspection.","95":"Formal Inspection Model\nThere are several models used to conduct formal inspections. Companies \nshould use the inspection model that best fits their needs based on the size \nand complexity of their organization. Most models share the following steps.\nFormal Inspections vs. Site-Specific Hazard Assessments\nHazard assessments and inspections may seem the same, but they have \ndifferent purposes. Hazard assessments should identify existing or potential \nhazards on a work site. Inspections should evaluate work site conditions. \nSeveral other key differences are in the table below.\nFormal Inspections Site-Specific Hazard Assessments\n• Purpose is to monitor work site \nconditions and evaluate work in \nprogress\n• Useful in assessing the effectiveness of \nhazard controls\n• May identify hazards missed by hazard \nassessments (not the primary reason)\n• Gets documented on a standard \ninspection form\n• Purpose is to identify hazards related to \nthe work that could not have been \nforeseen during the formal hazard \nassessment\n• Occurs before work is started\n• Gets documented on a site-specific \nhazard assessment form\nStep 1 \nPlan the \nInspection\nStep 2\nConduct the \nInspection\nStep 3\nComplete the \nReport\nStep 4\nMonitor the \nCorrective \nActions\nLearning Check (Objective 31)\nList the four basic steps of most \nformal inspection models.","96":"Inspection Policy and Procedure\nAn inspection policy should answer these questions.\n• Why are inspections done? \n• Who will do inspections?\n• When will inspections be done? \nAn inspection procedure should answer these questions.\n• What will be inspected?\n• How will information be recorded? \nMinimum Requirements for Inspection Policies and Procedures\nAreas and \nEquipment\nto Inspect\n• Are all areas that need to be inspected identified? (e.g., office, \nshop, yard, field, etc.)\n• What equipment needs to be inspected? (e.g., vehicles, powered \nmobile equipment, PPE, etc.) \nPersonnel\n• Who are the designated personnel responsible for completing the \ninspections?\n• Are all levels of the company represented? (e.g., workers, \nsupervisors, management)\n• Are designated personnel conducting inspections at the stated \nfrequency?\nFrequency\n• Is the frequency of inspections appropriate for the type of work the \ncompany does?\n• Does the frequency reflect OHS legislative requirements, industry \nstandards, and manufacturers’ specifications?\nFormat • Is the format for inspections appropriate for the work sites, work \nareas, equipment, materials, etc.?\nFactors that Determine Inspection Frequency\n• Type of work performed\n• Size of work site\n• Number of work operations\n• Number of workers\n• Manufacturers’ specifications\n• Number of shifts and level of \nactivity on each shift\n• Hazard identified on hazard \nassessments\n• Past history of incidents\nLearning Check (Objective 32)\nDescribe the four requirements of an \ninspection policy and procedure.","100":"Inspection Participation\nManagement Review and Sign Off\nManagement is responsible for ensuring the completion of inspections. They \nmust review and sign off on all formal inspection reports. It is important for \nthem to see how the HSMS is working, and to ensure the completion of \ncorrective actions.\nWorker Participation \nWorker participation is key to the success of both informal and formal \ninspections. They do informal inspections every day. They are also the people \non a work site who are most familiar with operations and who can be the \nmost impacted by hazards. Because of this, they can add critical input during \nformal inspections. Participating in inspections is also a worker right under \nOHS legislation.\nLearning Check (Objective 33)\nState reasons why management and workers \nshould participate in formal inspections.","102":"Work Refusals\nThe OHS Act gives workers the right to refuse work if they believe it is \ndangerous or potentially dangerous. If this happens, workers must promptly \nreport work refusals to their employer or supervisor. Once informed, the \nemployer must try to solve the problem.\nThere may be situations where the employer can not quickly solve the \nproblem. If this happens, the employer must inspect the dangerous condition \nand take action to make the situation safe for workers.\nWould you refuse to work at this work site?","106":"9. Emergency Response\nIntroduction\nPlanning for potential emergencies is an important task for all companies. \nThis planning may lead to the creation of one or more Emergency Response \nPlans (ERPs). Written ERPs are important because they provide specific \ndirection to employees and they can be used as the basis for training and \ndrills.\nThere are four main reasons why a company should plan for and create \nproper ERPs.\n• They help protect the health and safety of all workers and visitors at a work site (e.g., first aid, etc.)\n• They help minimize potential business losses (e.g., property loss, shutdowns, legal action, etc.)\n• They help reduce negative impacts on the environment (e.g., spills, toxic smoke, etc.)\n• They are a legislated requirement. (e.g., OHS Code, Alberta Fire Code, etc.)\nInformation Sources for Planning and Creating ERPs\nTo create ERPs, a company must identify the types of emergencies it may \nhave to deal with. There are six common information sources that can help \nidentify the types of emergencies that may require a plan.\n• Formal hazard assessment (company specific)\n• Site-specific hazard assessments (actual work site conditions)\n• Inspection reports (both formal and informal)\n• Incident/Investigation reports (company specific and industry specific)\n• Client requirements (may have unique needs or demands)\n• Past events in the area\nImportant\nA company’s formal hazard assessment should be \nthe primary source of information for identifying the \nERPs that need to be developed.\nLearning Check (Objective 35)\nRecognize common sources of information that can \nbe used to identify emergencies requiring an ERP.","108":"OHS Requirements for ERPs\nHighlights of OHS Code Part 7\n(Emergency Preparedness and Response)\n• Employer must establish an ERP for emergencies that may require rescue or evacuation\n• Employer must involve affected workers when developing an ERP\n• An ERP must…\no Identify potential emergencies\no Provide procedures for dealing with the identified emergencies\no Identify, locate, and provide operational procedures for emergency equipment\no Include emergency response training requirements\no Locate and explain the use of emergency facilities\no Provide fire protection requirements\no State alarm and emergency communication requirements\no Identify first aid services required\no Provide procedures for rescue and evacuation\no Identify designated rescue and evacuation workers\n• Employer must designate rescue and evacuation workers\n• Employer must ensure that rescue and evacuation workers… \no Receive appropriate emergency response training \no Are competent (trained, qualified, and able to work with minimal or no supervision)\no Have all the required PPE and equipment required to perform their duties\nCOR Requirements for ERPs\nRequirement Comments\nCommunication \nSystems\nCommunication systems include alarms, procedures for contacting both \ninternal and external emergency contacts, etc. \nEmergency \nContact \nNumbers\nEmergency phone numbers must include more than 9-1-1 (9-1-1 service \nmay not be available in the area or response times may be too long) \nEmergency \nPersonnel A list of persons designated to respond to specific types of emergencies \nEvacuation \nPlans\nAppropriate employee response procedures must be written for all \npotential emergencies that require them (e.g., evacuation, hold and \nsecure, shelter-in-place, lockdown, active threat, etc.)\nLearning Check (Objective 36)\nIdentify the OHS-required \ncomponents of an ERP.","110":"OHS Requirements for First Aid\nHighlights of OHS Code Part 11\n(First Aid)\n• Employer must provide first aid services, supplies, equipment, and first aid rooms as \nspecified in Schedule 2 of the OHS Code\n(For the purposes of schedule 2, offices are considered low hazard and all construction work sites \nare considered high hazard)\n• Employers must ensure that arrangements are in place before workers arrive on the \nwork site for the transport of injured workers to the nearest health care facility \n• The number of first aiders on a work site must meet the requirements in Schedule 2 of \nthe OHS Code\n• A first aid record must include at least all the following information…\n1. Name of the worker\n2. Name and qualification of the first aider\n3. Description of the illness or injury\n4. Description of the first aid provided\n5. Date and time the illness or injury \n6. Date and time the illness or injury was reported\n7. Location on the work site where the incident occurred\n8. Work-related cause of the incident, if applicable\n• Employer must record every acute illness or injury that occurs at the work site and keep \nthat record for at least three years\nLearning Check (Objective 37)\nIdentify the OHS-required components \nof a first aid report.","114":"ERP Drills\nA company should test each ERP using a drill at least once a year. The \ncompany can determine the level of involvement of workers in drills \ndepending on the work and the size and location of the work site. However, \nall designated workers and managers should participate in all drills.\nDrills are important because they are real-time tests of ERPs. As a result, an \nanalysis of all drills can help find the strengths and weaknesses of an ERP. \nOf special interest in the analysis are sections of the ERP needing updates \nrelated to training, procedures, or communications. Recommendations or \ncorrective actions should address any of these issues. Drill results, actual \nemergency response results, and their analysis all become part of a \ncompany’s heath and safety system’s records.\nLearning Check (Objective 38)\nState the minimum requirement for \nconducting ERP drills.\nDrills may cover multiple \nscenarios rather than individual \nemergency situations (e.g., a \nfirst aid scenario along with a \nshelter-in-place).\nDrills may also be done using \nsimulations. The most common \nexample is using a tabletop\nexercise where participants are \ngiven scripted roles to play \nwithin an emergency scenario.\nDrills can range from basic first aid to more complex \nevents like dealing with a hazardous product spill.","120":"Investigation of Near Misses\nNear misses in a work area or work site usually occur more than once. Over \ntime these near misses will eventually lead to an actual loss incident. For \nthis reason, a company’s investigation policy should include near misses as \npart of its prevention efforts.\nCompanies who want to investigate near misses must ensure workers know \nthe results are a prevention tool. They must also ensure that the focus of all \ninvestigations is fact-finding and not fault-finding. Workers will not report \nnear misses if they believe there will be negative outcomes for them.\nIncident Pyramids\nIncident pyramids show the connection \nbetween near misses and loss incidents \nfor a company. They emphasize the \nneed to investigate near misses as a \nway of trying to prevent loss incidents \nfrom occurring. \n1\nFatality\n30\nLost-time \nCases\n300\nReportable Injuries\n3000\nNear Misses\nAdapted from Conoco Phillips Marine, 2003.\nTo report or not?\nThe worker alone in a work area tripped \nover materials that were not stored \ncorrectly by other workers. He scraped \nhis shin and will have a bruise. Should \nhe report it? Would this get reported in \nyour company?\nLearning Check (Objective 39)\nIdentify reasons why near misses \nshould be investigated.\n?","121":"OHS Requirements for Investigations\nHighlights of OHS Act (s.33)\n• Reportable injuries or incidents requiring an investigation and report…\no An injury, illness, or incident that results in the death of a worker\no An injury, illness or incident in which there is reason to believe the \nworker has been or will be admitted to a hospital\no An unplanned or uncontrolled explosion, fire, or flood that causes a \nserious injury or illness, or that has the potential of causing a serious \ninjury or illness\no The collapse or upset of a crane, derrick, or hoist\no The collapse or failure of any component of a building or structure \nnecessary for the structural integrity of the building or structure \no Any injury, illness, or incident that had a likelihood of causing a \nserious injury or illness (that could have resulted in hospitalization or \nfatality), and there is reasonable cause to believe that corrective \naction may need to be taken to prevent recurrence\nNote: There are additional reportable incidents for mines or mine sites.\n• Employer must investigate and prepare a report for all reportable injuries \nand incidents (see list above)\n• Investigation Reports must…\no describe the circumstances of the injury or incident\no provide corrective actions\no be kept for at least two years\n• Employers must provide a copy of any report to…\no a Director of Inspections (OHS) and, \no the HSC or HSR, if applicable, or \no Workers if there is no HSC or HSR at the work site\n• Employer must make reports readily available to OHS on demand\n• OHS may decide to conduct an investigation at work site\n• First aid reports must be completed for every acute illness or injury and \nkept for at least three years (OHS Code Part 11)\nAdmitted to a Hospital\nmeans when a physician \nwrites admitting orders to \ncause a worker to be an \ninpatient of a hospital, but \nexcludes a worker being \nassessed in an emergency \nroom or urgent care centre \nwithout being admitted. \nLearning Check (Objective 40)\nIdentify the injuries or incidents that employers \nmust investigate and report on.\nReports can \nbe made using \nan online form \nat GoA’s OHS \ncomplaints \nand incidents \nwebsite.","126":"Corrective Actions\nCorrective actions are one of the most important results to come out of an \ninvestigation. This is because they change the focus of the report from just \nrecord keeping to prevention. Corrective actions are also an OHS \nrequirement for all reportable incidents.\nCommunicating causes and corrective actions to employees helps to hold \ncompanies accountable for their commitment to preventing incidents and \nmaintaining a safe workplace. Investigation results can also be as used an \neffective training tool in a company’s training program.\nProperly written corrective actions have three key features.\n• They must address the causes identified in the investigation\n• They must have a person assigned to them who will be accountable\n• They should be S.M.A.R.T.\nSpecific – They should be as specific as possible so there is no confusion about what is being \nrecommended\nMeasurable – They should be written in a way that allows the company to clearly know when the \ncorrective action has been completed and by whom\nAttainable – They should recommend actions that are actually possible for the company to complete in \na reasonable timeframe\nRelevant – They should address issues identified in an inspection or investigation\nTime-bound – They should have specific, realistic completion dates/times\nExamples of S.M.A.R.T. Corrective Actions\n1) Arrange for the installation of exhaust gas alarm systems in all shops by June 30, 2018.\n2) Install 1.3m high barriers along designated walkways in the laydown yard by August 1st.\n3) Review supervisor training requirements for critical task analysis within three weeks.\n4) Update SJP for excavator pre-use inspections before excavators are put back into service.\n5) Replace all earplugs with 30 NRR NIOSH-approved earmuffs at start of next shift rotation. \nInvestigation results and corrective actions should be shared \nwith all affected parties to increase transparency, hold \nmanagement accountable, and encourage worker feedback.\nLearning Check (Objective 41)\nRecognize the components of a \nS.M.A.R.T. corrective action.","131":"11. System Administration\nIntroduction\nAn HSMS is more than a binder full of safety documents. It is a system that \nrequires constant monitoring and maintenance. This takes the form of \nreviewing documents and records, communicating with work site parties, and \nacting on feedback. The goal of this monitoring and maintenance is always \nthe continuous improvement of the HSMS. \nRecord Management\nAn HSMS produces a large number of records. The employer must ensure \nthat there is a proper record management system within the HSMS. The \nrecords management system must have procedures to deal with several \nimportant issues. Many of these procedures deal with maintaining and \nretaining records.\n• Are records being completed properly? How are errors corrected?\n• Are records being submitted as scheduled? To the right people?\n• Are records being reviewed for accuracy and corrective actions?\n• Are records being stored according to company policies and legislated requirements? \n• Is there a process to analyze records to look for trends?\n• How is information gathered from records communicated back to work site parties?\n• How are updates to forms, expired certificates, and scheduled reviews tracked? \n• How are records protected? Who has access to them?\n• How are they backed up? How are they disposed of?\nAddressing these issues will ensure that companies have the accurate \ninformation they need to make good decisions. Those decisions will help \nmake the workplace safer for all work site parties.\nLearning Check (Objective 42)\nState why a record management system \nis an important part of the HSMS.","134":"HSMS Evaluation\nEvaluation of an HSMS helps to identify strengths and weaknesses in each \nsection. This allows employers to find opportunities for continual \nimprovement of the HSMS. There are three main ways to evaluate an HSMS. \nAudits\nAudits help to identify how well an HSMS is performing against a standard. \nThe table below outlines the four common audits.\nType Purpose\nCertification Used for companies undergoing the COR or SECOR process\nMaintenance Performed for the two years between certifying and renewing audits \nin the audit cycle\nPost-event Conducted after an incident results in significant loss\nQualification Used for participants enrolled in an auditor training program for the \npurpose of certifying\nThere are many other standards for auditing. Employers commonly \ndevelop their HSMS in accordance with the tool they will be assessed \nby (e.g., PIR, ISO, NSC, etc.).\nLearning Check (Objective 43)\nState the benefits of auditing.","135":"Statistical Analysis\nSummaries of health and safety related records provide an overview of the \nHSMS progress. They can also highlight trends that are developing. \nSummaries may occur daily, weekly, or monthly depending on a company’s \nscope of work. \nSummaries provide the data needed for statistical analysis. All results from \nan analysis will align with one of two types of indicators. These indicators are \nleading and lagging.\nIndicator Purpose Examples\nLeading\n• Considers future health and safety \nperformance\n• Shows ongoing activities for the \nprevention of incidents\n• Targets management system to see if \ncontractors are meeting their goals\n• Reflects management’s commitment to \nhealth and safety\n• Focuses on continual improvement of \nhealth and safety management systems\n• Hazard assessments\n• Inspections\n• Orientations\n• Audits\n• Communications\n• Safety Training\nLagging\n• Considers results of safety processes, \npolicies, and procedures\n• Reviews past incident statistics\n• Measures frequency and severity of \nincidents\n• Shows how many people were injured \nand how badly\n• Number of incidents\n• Safety statistics\n• OHS orders\nLearning Check (Objective 44)\nDescribe leading and lagging indicators.","138":"Part 2: Calculate the Total Recordable Incident Frequency (TRIF) using the information provided below.\nAction Plans\nWhen audits identify areas for improvement, employers should assign a \ncorrective action. These actions, when combined, make up an action plan. The \npurpose of an action plan is to provide a plan to improve the HSMS over the \nupcoming year.\nThe corrective actions in the action plan should address each area identified \nby the audit findings using the S.M.A.R.T. format. Each corrective action \nshould also have a person and target date assigned. This helps to drive \naccountability in the HSMS.\n2021 Statistics Total\nLost Time Cases 1\nLost Work Days 2\nMedical Aids 1\nModified Work Cases 5\nTotal Employee Exposure Hours 265 000\nCalculation\nTotal Recordable \nIncident \nFrequency\n(TRIF)\n(Lost Time Cases + Medical Aids + Modified Work Cases) × 200,000\nTotal Employee Hours of Exposure =\nLearning Check (Objective 45)\nDescribe the purpose of an action plan."},"lse":{"6":"The Supervisor – A Safety Leader\nSupervisors play a big role on their company’s safety team because of the work they do \nfor a company. Common jobs for a supervisor are in the list below.\n• Direct the work of a company and direct workers\n• Support workers in performing their day-to-day tasks\n• Model proper conduct as a safety leader \nEmployers must train supervisors to be safety leaders in the field.\nEssential Actions of an Effective Safety Leader\nThree essential actions of an effective safety leader are in the list below.\n• Mentoring workers to perform their tasks in the safest way possible \n• Motivating workers to be safe by being a role model \n• Monitoring workers to uphold the required standards \nLearning Check (Objective 1)\nRecognize three essential actions \nof an effective safety leader.\nSafety \nLeader\nMentoring\nMotivating\nMonitoring\nSupervisors must demonstrate \nthat they value health and safety \nin the workplace.","8":"Corporate Culture and Health and Safety\nEvery company is unique and has its own corporate culture. The table below lists six \ncommon components of corporate culture.\nComponent Description\nVision Mission statement\nValues Core beliefs\nPolicies Written commitments to company’s values\nPeople All managers, supervisors, and workers\nNarrative Company’s unique story (history)\nPlace Physical layout and surroundings\nLegislation, health and safety policies, and procedures tell us what to do at work. A strong \ncorporate culture makes sure work is done safely.\nGoals of Corporate Culture\n• Workers hold safety as a value (fundamental belief) and not just a priority (can change)\n• Workers take responsibility for their own safety as well as the safety of others\n• Workers are willing to act on their own sense of responsibility\n \nAdapted from Coleman, John. Six Components of a Great Corporate Culture.\nHarvard Business Review, May 6, 2013.\nLearning Check (Objective 2)\nRecognize three goals of corporate culture.\nOne key indicator of the \ntype of corporate culture \npresent is how well \nworkers and supervisors \nwork together to get \ntasks done.\nTeams that work \nsmoothly and without \nconflict indicate a \npositive culture.","9":"Module 1 – Supervisor Health and Safety Responsibilities\nMain Sources of Supervisor Health and Safety Responsibilities\nCompany Health and Safety Program\nInfluences on a Company’s Health and Safety Program\nSource Includes the Following\nCompany\nH&amp;S Program\n• Company policies and procedures\n• Applicable legislation\n• Industry best practices\nSafety Team\n• Management\n• Supervisors\n• Workers\nSafety Tasks\n• Pre-job\n• Periodic\n• Ongoing\nExternal Internal\n• Federal and Provincial legislation\n• Municipal bylaws\n• Industry standards/best practices\n• Client demands\n• Corporate culture\n• Corporate vision\n• Management commitment\n• Worker commitment\nCompetent supervisors should \nhave a clear understanding of \ntheir assigned duties and their \nresponsibilities.\nLearning Check (Objective 3)\nDescribe three main sources of supervisor \nhealth and safety responsibilities.\nCompany H&amp;S Program\nSafety Team\nSafety Tasks\nAn employer who employs \n20 or more workers (or on \nthe direction of OHS) must \nestablish and implement a \nhealth and safety program. \n(OHS Act s.16)","11":"Overview of Legislation\nLevel Responsible \nBody\nTypes of \nLegislation Examples\nFederal House of \nCommons\nActs\nRegulations\nCodes\n• TDG Act and Regulations\n• Canadian Criminal Code\n• Canadian Health and Safety Regulations\n• Hazardous Products Act and Regulations\nProvincial \nand \nTerritorial\nProvincial or \nTerritorial \nLegislative \nAssembly\nActs\nRegulations\nCodes\n• OHS Act, Regulations, and Code\n• Safety Codes Act\n• Alberta Building Code\n• Traffic Safety Act\n• Pipeline Rules\nMunicipal Local elected \ncouncil Bylaws\n• Noise Control/Abatement\n• Waste Management\n• Community Standards\n• Sewers and Drainage\n• Dangerous Goods Routes\nAlberta Occupational Health and Safety (OHS) Legislation\nSupervisors must be familiar with Alberta’s OHS Act, Regulations, and Code. Workers \nmust have access to Alberta’s OHS Legislation at the work site.\nComponent Common Purposes\nOHS Act\n• Permits government to legally regulate an area \n• Assigns obligations to people or organizations\n• Allows government to create regulations and codes\nOHS Regulations\nand\nOHS Code\n• Assigns specific responsibilities to individuals\n• Describes actions to be taken by individuals\n• Outlines specific procedures to be followed\n• Adopts standards from other organizations\nLearning Check (Objective 4)\nIdentify common purposes of the three main \ncomponents of Alberta’s OHS legislation.\nAll three levels of government \nmay have legislation that applies \nto a work site in Alberta.\nCompanies are responsible for visitors at their work \nsites. For more information on the Duty of Care to \nVisitors, see the Alberta Occupiers’ Liability Act, s.5.","12":"Supervisor Responsibilities Concerning Legislation\nSupervisors must ensure their work sites follow health and safety laws. The Government \nof Alberta provides specific supervisor obligations in the Alberta OHS Act.\nHighlights of the OHS Act\nSection Title Comments\ns.1(nn) Definitions • A supervisor is any person who has charge of a work site or authority \nover a worker (i.e., directs the work of others)\ns.4 Obligations of \nsupervisors\n• Take all precautions to protect the health and safety of workers they \nare supervising\n• Ensure that workers under their supervision are in compliance with \nthe OHS Act, Regulation, and Code\n• Ensure none of the workers under their supervision are subjected to, \nor participate in, violence or harassment at the work site\n• Advise workers they are supervising of all known or reasonably \nforeseeable hazards to health and safety in their working area\n• Report any unsafe or harmful work site act (that occurs or has \noccurred), or any unsafe or harmful condition (that exists or has existed) \nto the employer\n• Cooperate with any person exercising a duty imposed by the Act, \nRegulation, or OHS Code\ns.12 Multiple \nobligations\n• If a person has two or more functions under the Act in respect of one \nwork site, the person shall meet the obligations of each function\nWork Site\nThe Alberta OHS Act defines work site as a \nlocation where a worker is, or is likely to be, \nengaged in any occupation and includes any \nvehicle or mobile equipment used by a \nworker in an occupation. (OHS Act)\nLearning Check (Objective 5)\nDescribe the obligations of a supervisor \nunder the OHS Act.","19":"The Safety Team\nExamples of Safety Team Responsibilities\nManagement\nEnsure\n• A health and safety program is established\n• The safety team has support\n• Workers are trained\n• PPE is used as required\n• Hazard assessments, inspections, and \ninvestigations are completed as required\n• Applicable legislation is followed\nMaintain\n• Health and safety program and \nupdate/improve as necessary\nEnforce\n• Health and safety policies and procedures\nProvide\n• A safe workplace \nReport\n• Required incidents to appropriate \nauthorities (WCB, OHS, Alberta \nEnvironment, Police)\nSupervisors\nMentor by\n• Working with others to do their work in a \nsafe way\n• Helping to establish safe work plans\n• Complying with company rules and \nlegislation\nMotivate by\n• Promoting health and safety as a role model \nMonitor by\n• Reinforcing safe behaviour\n• Enforcing company rules\n• Ensuring workers are competent\n• Conducting hazard assessments\n• Conducting inspections\n• Investigating all incidents and work \nrefusals\n• Participating in safety audits\n• Ensuring proper equipment/tool use and \nmaintenance\nWorkers\nParticipate in\n• Training\n• Hazard assessments\n• Inspections\n• Investigations when necessary\n• Safety audits\n• Safety meetings/toolbox talks\nReport\n• Incidents \n• Substandard practices and conditions\nComply with \n• Company policies and procedures\n• Company rules\n• Applicable legislation (Refuse Unsafe \nWork)\nProvide\n• Safety suggestions\n• A good example\nLearning Check (Objective 6)\nIdentify the three groups that make up a \ncompany’s safety team.\nLearning Check (Objective 7)\nRecognize one responsibility for each \ngroup on a company’s safety team.\nCompany H&amp;S Program\nSafety Team\nSafety Tasks","20":"Supervisor Safety Tasks\nType of Task Description and Examples Comments\nPre-job\nplanning\nconsiderations\n(additional topics\nin Appendix B)\n• Scope of work\n• Hazards\n• Crew size\n• Equipment \n• Training\n• PPE\nPre-job planning includes evaluating \nthe work force, materials, and \nequipment required for a job.\nScheduled or \nperiodic tasks\n• Health and safety orientations\n• Toolbox talks/safety meetings\n• Hazard assessments \n• Inspections\n• Investigations\n• Training\n• Safety audits\nThe frequency of scheduled/periodic \ntasks will depend on your company’s \nhealth and safety policies.\nContinuous or\nongoing tasks\n• Safety meetings\n• Hazard assessments\n• Inspections\n• Training/competency evaluations\n• Logbook entries\n• Mentorship/coaching\n• Compliance with company standards\n• Compliance with legislation\nAs a supervisor gains more \nexperience, the ongoing process of \nmonitoring for substandard acts and \nconditions becomes routine.\nThree Basic Rights of Workers\n• Right to Know\n• Right to Participate\n• Right to Refuse Dangerous Work\nLearning Check (Objective 8)\nDescribe the three types of supervisor \nsafety tasks.\nCompany H&amp;S Program\nSafety Team\nSafety Tasks","21":"Daily Logbook\nA daily logbook is an important tool for supervisors. It keeps a personal and professional \nrecord of the daily events on a work site.\nA supervisor’s daily logbook should have the features below.\n• Bound (no rings, coils, or removable pages)\n• Consecutively numbered pages\nDaily Logbook Best Practices\n• Indicate location or project, important times, and date of entry\n• Include events that occurred on the date of entry\n• Contain facts of the events that occurred\n• Include people involved and their particular task or role in the event\n• Include decisions reached to resolve recorded issues\n• Include items that require follow up\n• Write entries in pen so they cannot be altered\n• Cross out errors with a single line and initial (do not erase or cover)\n• Draw a solid line from the last entered word to the end of the line\n• Draw solid lines from the last filled line to the end of the page\n• Leave all pages intact and in place\nSome companies may use the term journal. Supervisors may keep two \nlogbooks/journals: one for the company and one for themselves. \nActivity 2 – Logbook Entry 1\nUse the logbook pages in Appendix D to note key points from the Curtis Zanussi and \nGary Leblanc videos.\nLearning Check (Objective 9)\nIdentify at least three best practices \nfor a daily logbook entry.","23":"Module 2 – Hazard Assessments\nA hazard assessment (HA) is a process to identify hazards and then select ways to \neliminate or control them. There are two basic types of HA processes.\nSupervisor Obligations for Hazard Assessments (OHS Act s.4)\n(the focus of these obligations is site-specific hazard assessments)\n• Must advise workers of all hazards that may impact their health and safety\n• Must report all unsafe or harmful acts and conditions to the employer\nFormal Hazard Assessments\n(pre-job or project)\nSite-Specific Hazard Assessments \n(ongoing at the work site)\nFocus\n• Identification of hazards associated \nwith every position/job description \nidentified in a company’s \norganizational chart\n• Identification of hazards at a specific \nwork site or work area\nReview\n• Annually, when a process changes, \nafter an incident, when new work is \nintroduced, etc.\n• Up to multiple times a day including \nany time new hazards are introduced \nto the work site or work area\nCommon \nlayouts\n• Usually printed and stored in a binder \nand/or stored electronically\n• A single page of paper, an app for a \nsmart device, or an electronic \ntemplate on a laptop\nContributors\n• Employers, managers, supervisors, \nand workers familiar with the \npositions/job descriptions in the \norganizational chart\n• Supervisors and workers about to \nstart work for the day/shift and may \ninclude other work site parties in or \nnear the work area\nUses\n• Identify hazards associated with each \nposition/job description in the \ncompany, risk rank those hazards, \nand select ways to eliminate or \ncontrol those hazards (e.g., longer \nrange, pre-planning) \n• Also used as source information for \norientations, training, competency \nassessments, SWPs, SJP, JSAs, \nsafety meetings, etc.\n• To identify and assess hazards before \na worker or crew starts work for the \nday or shift and to determine ways to \neliminate or control those hazards \n• Risk ranking may not be required as \nall identified hazards have to be \neliminated or controlled before work \nstarts for the day or shift \n• Also used as source information for \ntoolbox talks and safety meetings\nLearning Check (Objective 10)\nState the two supervisor obligations \nrelated to hazard assessments.","25":"Example 1\nTask  Refuel a portable generator\nHazard  Chemical exposure to hands\nOR\nOutcome  Skin irritation\nSeverity  Makes you uncomfortable (1)\nLikelihood  Might happen (2)\nRisk Rank  1 x 2 = 2 (L)\nControl hazard or prevent outcome by using \nnon-spill fuel cans and chemical resistant \ngloves and rank again.\nChanges the likelihood but not severity.\nRisk Rank = 1 x 1 = 1 (L)\nExample 2\nTask  Shingle a 6-m high sloped roof\nHazard  Working at height\nOR\nOutcome  Falling off the roof\nSeverity  Kills you or causes disability (3)\nLikelihood  Might happen (2)\nRisk Rank  3 x 2 = 6 (H)\nControl hazard or prevent outcome by using a \nPersonal Fall Arrest System (PFAS) and rank\nagain.\nChanges the severity but not likelihood.\nRisk Rank = 2 x 2 = 4 (M).\nRisk and Risk Ranking\nThe GoA defines risk as the chance of injury or loss. Risk ranking is the process of \ndetermining the level of risk (e.g., low, medium, or high). The GoA uses a point system to \nrisk rank using severity and likelihood (probability). Focusing on hazards instead of \noutcomes allows a person to do a better job of reducing risk. However, focusing on \noutcomes should still lead to lower risks for workers. \nRisk Rank =\nSeverity x Likelihood \nSeverity\nMakes you \nuncomfortable\n1\nSends you to\nthe hospital\n2\nKills you or\ncauses disability\n3\nLikelihood\nUnlikely\n1 1 (L) 2 (L) 3 (M)\nMight happen\n2 2 (L) 4 (M) 6 (H)\nHighly likely\n3 3 (M) 6 (H) 9 (H)\nLearning Check (Objective 11)\nState the two factors most risk \nassessment models evaluate.\nAdapted from: Government of Alberta, 2015. Hazard Assessment \nand Control: a handbook for Alberta employers and workers.","27":"Site-Specific Hazard Assessment Model\nThere are several ways to conduct site-specific hazard assessments (SSHAs). The ACSA \nhas adopted the Government of Alberta’s five-step model. SSHAs are sometimes called \nField Level Hazard Assessments (FLHAs).\nContributing Factors Topics to Consider\nPeople Training, fit for work\nEquipment Appropriate for the task, maintained properly,\ntraining provided for proper use\nMaterials WHMIS (Labels, SDSs), handling, storage\nEnvironment Location, weather\nAdapted from Government of Alberta, 2015. Hazard Assessment and \nControl: a handbook for Alberta employers and workers.\nStep 1\nList tasks\nStep 2\nIdentify health and safety hazards\nStep 3\nEliminate or control hazards\nStep 4\nCommunicate the hazards and follow controls\nStep 5\nRepeat the process if there is a change in conditions\nSSHAs and Training\nSupervisors and workers must be \ntrained on how to do SSHAs and \nhow to fill out the company’s SSHA \nforms. \nSSHA Forms\nSSHA forms must be able to show \nwhat hazards have been identified, \nwhat steps have been taken to \neliminate or control those hazards, \nand the date the SSHA was \ncompleted or revised. \n(OHS Code s.7)\nOHS legislation requires employers \nto involve workers in the SSHA \nprocess. However, there is no OHS \nrequirement for workers to sign \nSSHAs. For COR, it is a best \npractice for workers to sign SSHAs \nas a way to verify that they have \nparticipated in the process. \nLearning Check (Objective 12)\nList the five steps in the site-specific hazard \nassessment process in the correct order.\nLearning Check (Objective 13)\nIdentify the four contributing factors of \nhazards at a work site.","30":"Hazards vs. Outcomes\n• A hazard is what needs to be eliminated or controlled (see previous page)\n• An outcome is what could happen if the hazard is not eliminated or controlled\nTask Outcome Control Hazard Better control\nOpening boxes\nwith utility knife Cut finger Wear cut\u0002resistant gloves\nSharp \nedge\nSubstitute knife with an \nenclosed blade cutter\nPainting high\nceilings from ladder Back strain Wear a back support\nPoor body \nposition\nReplace ladder with\na mobile scaffold\nApplying protective \ncoatings to equipment\nHeadaches \nfrom fumes\nWear \nappropriate \nrespirator\nExposure \nto fumes\nProper ventilation and\nappropriate respirator\nWorking outside in \nhigh temperatures Dehydration Increase fluid intake\nHeat \nstress\nIncrease number \nof breaks and fluid intake\nLooking at outcomes can lead \npeople to focus only on worker-level \ncontrols which are usually the least \neffective.\nLooking at hazards often leads people to \nfocus on controlling a hazard at its source. \nThis can result in selecting a more effective \ncontrol or combination of controls.\nSlips, Trips, and Falls\nSlips, trips, and falls are the best example of how people confuse hazards and \noutcomes. Slips, trips, and falls are all different types of outcomes. They are not\nhazards which is why there are no specific hazard controls for any of them. \n“Don’t slip, trip, or fall,” or “Hey, watch your footing out there,” are not hazard \ncontrols. Only a hazard assessment can determine the hazard controls. Hazards \ncould be wet or icy surfaces, snow, mud, unstable soil, uneven ground, potholes,\nruts, damaged walkways, or cables/cords on the ground. \nA hazard control for an icy surface may be a melting agent. Cable/cords could be \nput overhead or under low-level bridges. Foot traffic could be re-routed away from \nuneven ground or unstable soil. Any control chosen should prevent or reduce the \nchance of a slip, trip, or fall from happening.\nLearning Check (Objective 14)\nDistinguish between hazards and \noutcomes.","32":"1 2 3\n4\nThe first choice for employers should be to eliminate as many hazards as possible in the \nworkplace. This is often difficult to do in construction so employers must try to control \nhazards. There are three basic types of hazard controls that make up the Hierarchy of \nControls.\nStep 3\nEliminate or control hazards\nHierarchy of Controls (OHS Code s.9)\nEngineering Controls*\n(control hazards at the source)\nMechanical transport/lift\nAutomation\nEnclosures/safeguards\nVentilation (dilution)\nFans and Filters\nBarriers\nGuard rails/toe boards\nEquipment modification\nChemical substitution\nRemote control devices\nProcess control/change\nApplicators\nErgonomic design features\nTwo hand controls\nWet methods\nFatigue mats\nEnergy isolating devices\nLock-out system\n*includes substitution\nPersonal Protective Equipment\n(control at the worker level)\nHard hat\nBump cap\nHearing protection\nGloves\nGlasses/goggles\nFace shield\nReflective vest\nRespirator\nFall protection\nPersonal gas monitors\nCoveralls\nAprons\nKnee pads\nFootwear\nToe caps\nUV protection\nSCBA/SABA\nAdministrative Controls\n(control between hazard and worker)\nSafe job procedures\nSafe job practices\nSafe work permits\nCode of practice\nOrientation\nOn-the-job training\nSafety training\nTechnical training\nCompetency assessments\nMaintenance programs\nCalibration\nJob rotation\nBreaks\nHousekeeping\nSignage/mirrors\nWarning alarms/lights\nProduct labels\nRestricted areas\nCompany rules\nTag-out system\nIf the hazard cannot be eliminated or controlled by \na single control method, the employer may use a \ncombination of controls.\nAdapted from: Government of Alberta, 2015. \nHazard Assessment and Control: a handbook for \nAlberta employers and workers. \nLearning Check (Objective 15)\nIdentify examples of controls used for each \nlevel of the hierarchy of controls.","42":"Module 3 – Inspections\nComponents of an Inspection Program\nAn inspection program should have the following components.\n• Inspection policy (who, why, and when to conduct inspections)\n• Inspection procedures (what to look for)\n• Applicable forms (how to document what was observed)\nPurpose of Safety Inspections\nPurposes of Safety Inspections\n• Identify existing and potential hazards\n• Assess legislative compliance\n• Assess company health and safety program compliance\n• Determine causes of hazards\n(substandard practices and conditions)\n• Monitor hazard controls\n(engineering, administrative, and PPE)\n• Develop and recommend corrective actions\n• Gain further understanding of jobs and tasks\nA Workplace Inspection Should Examine All\nAspects/areas at the Work Site\n• People\n• Equipment\n• Materials\n• Environment\n• Actions taking place (work in progress)\nLearning Check (Objective 16)\nList three components of an \ninspection program.\nLearning Check (Objective 17)\nIdentify three purposes of safety \ninspections.","46":"Formal Inspection Process \nThere are several models used to conduct work site inspections. Companies should use \nthe inspection model that best fits their needs based on the size and complexity of their \norganization. Most models share the following steps.\nStep 1 – Plan the Inspection\n• Review company inspection policy, procedures, and forms\n• Determine who will be on the inspection team \n• Review appropriate/applicable legislation and industry standards\n• Ensure members of the inspection team have appropriate training\n• Review appropriate/applicable operator manuals\n• Collect required items to conduct the inspection\n• Review previous inspection and incident reports for possible follow-up\n• Review previous work site inspections\n• Plan inspection route with supervisors and workers to ensure the safety of the inspection team\nStep 1 \nPlan the \nInspection\nStep 2\nConduct the \nInspection\nStep 3\nComplete the \nReport\nStep 4\nMonitor the \nCorrective \nActions\nLearning Check (Objective 18)\nDescribe the four steps in the formal \ninspection process.\nInspections are an excellent \nopportunity to talk to workers\nand build positive relationships.\nDo not overlook the office when \nconducting work site inspections. \nThe hazards present in an office \nenvironment can have serious \nand long-lasting effects on those \nexposed to them.","47":"Step 2 – Conduct the Inspection\n• Wear appropriate personal protective equipment for the inspection area\n• Describe each substandard act or condition and its exact location\n• Be methodical, ask questions, and take notes\n• Take pictures if permitted by company policy\n• Look at things from every angle \n• Address the presence of dangerous work immediately \n• Try not to disrupt normal work activities \n• Do not operate equipment unless qualified\n• Consider static (stop position) and dynamic (in motion) conditions of equipment being inspected\n• Discuss potential hazards as a group and determine appropriate controls and corrective actions\nKey Things to Look for During an Inspection\nCritical Equipment Parts\n• Stress and wear\n• Impact\n• Guards\n• Corrosion\n• Misuse\n• Moving parts covered\n• Vibration\n• Lockout\nEvidence of Structural, Functional, and Ventilation Problems\n• Jagged edges\n• Worn areas\n• Improper pressure\n• Noxious fumes\n• Unusual noise\n• Leakage\nVehicles and Equipment\n• Safety devices (fire extinguisher, first aid kit, \nbackup alarm, beacon)\n• Maintenance records\n• Operator training/competency - records\nPersonal Protective Equipment (PPE)\n• Availability/ease of access\n• Appropriate for the task\n• In good repair\n• Proper wear and fit\nHousekeeping\n• Improper storage\n• Potential for slips, trips, or falls\n• Blocked access and egress\n• Accumulation of combustible materials\nSigns and Barricades\n• Caution tape\n• Warning and danger signs\n• Alarms\n• Barricades\nEmergency Response Supplies\n• Appropriate supplies for the number of workers\n• Required supplies as indicated in the emergency response plan \nCompliance – Personnel\n• Company policies, practices, and procedures\n• Client demands \n• Legislative requirements\n• Industry standards/practices\nStep 1 \nPlan the \nInspection\nStep 2\nConduct \nthe \nInspection\nStep 3\nComplete \nthe \nReport\nStep 4\nMonitor the \nCorrective \nActions\nLearning Check (Objective 19)\nIdentify items to look for while \nconducting an inspection.","48":"The Inspection Team\nAn inspection team should include the same three groups as a company’s safety team.\n• Managers\n• Supervisors\n• Workers\nWorkers on the Inspection Team\nRequired Training\nItems that Should be Available\nActivity 7 – The Inspection Team\nYou want to start inspecting a work site while workers are installing drywall in a new residential home. \n• What type of workers should be included on the inspection team?\n• What training should the members of the inspection team have prior to conducting the inspection?\n• What items should be available to the inspection team?\nLearning Check (Objective 20)\nIdentify who should be on an \ninspection team.\nAlberta OHS Act, s.13(6)(d)\nThe joint health and safety committee must review \nthe employer’s work site inspection documentation.","58":"Module 4 – Investigations \nThere are many reasons why a company should investigate incidents. However, the \nmain reason for investigating incidents is prevention.\nSupervisor Training\nElements of Investigation Training for Supervisors\nPolicies\n• Company specific policies – internal requirements\n• Project specific policies – client requirements\n• Municipal, provincial, and federal requirements\nProcedures\n• Response protocols\n• Reporting protocols\n• Communication protocols\nDocumentation\n• Reports\n• Witness statements\n• Timelines\n• Data collection\nQuestions for Supervisors\n• Who is the contact in the event of an incident?\n• Who will conduct the investigation?\n• Who will contact OHS?\n• Who will deal with the media?\nInformation collected during an investigation may be \nrequested by the Worker’s Compensation Board \n(WCB) and Occupational Health and Safety (OHS).\nLearning Check (Objective 21)\nIdentify the main reason why a company \nshould investigate incidents.","62":"SIP \nStep \n4\nAnalyze the Root \nCauses\nSIP Step 3\nDetermine the \nBasic Causes\nSIP Step 3\nIdentify the \nDirect Causes\nSIP Step 3 \nSIP \nStep \n2\nClassify the \nIncident\nSIP Step 1\nIdentify the \nLoss(es)\nSIP Step 1\nThe Simplified Investigation Process (SIP)\nStep 1\nSecure the \nScene\nStep 2\nCollect the \nEvidence\nStep 3\nAnalyze the \nCauses\nStep 4\nWrite the \nReport\nSource: Work Site Investigation Basics, ACSA 2017\nLoss Causation Model\nAdapted from Bird et al., Practical Loss Control Leadership 3rd Edition\nLearning Check (Objective 22)\nDescribe the four steps in the Simplified \nInvestigation Process.","64":"SIP \nStep \n4\nAnalyze the Root \nCauses\nSIP Step 3\nDetermine the \nBasic Causes\nSIP Step 3\nIdentify the \nDirect Causes\nSIP Step 3 \nSIP \nStep \n2\nClassify the \nIncident\nSIP Step 1\nIdentify the \nLoss(es)\nSIP Step 1\nSIP Step 2\nStep 2 – Collect the Evidence\n• Position, people, parts, paper (prioritize evidence collection)\n• Put witnesses at ease\n• Ask open-ended questions and let witnesses speak freely\nSIP Step 3\nStep 3 – Analyze the Causes\nDirect Causes Basic Causes Root Causes\nWorker Level\nSubstandard practices\nand conditions\nSupervisory Level\nPersonal factors or \nJob/system factors\nManagement Level\nManagement failure to \nestablish and/or maintain \nsystem or standards\nAn open-ended question is designed to encourage \na full answer, not just a yes or no response. \nLearning Check (Objective 23)\nDescribe the three types of causes from the \nLoss Causation Model.\nStep 1 Step 2 Step 3 Step 4\nStep 1 Step 2 Step 3 Step 4","73":"Module 5 – Training and Communication\nWorker training gives workers the tools they need to work safely. An effective training \nprogram does the three things listed below. \n• Informs workers of expectations\n• Gives workers the information to do their tasks safely\n• Allows workers to express their health and safety concerns\nElements of an Effective Training Program\nElement Comments\nTraining policy\n• Indicate company commitment\n• Develop objectives for the training program\n• Assign responsibilities to workplace parties\n• Refer to applicable legislation \nOrientations • Develop a general safety orientation\n• Develop site-specific orientations\nOn-the-Job training • Provide hands-on training/explanations\n• Develop step-by-step procedures\nOngoing training\n• Develop procedures for when ongoing training \nshould occur\n• Refer to legislation \n• Consult with clients\n• Track expiry dates\nAssessment and \ndocumentation\n• Assess workers\n• Document assessments\n• File documentation\nDo not rush training!\nMaintain a comfortable pace for the worker. Be \nclear, concise, and willing to repeat as necessary.\nFile all certificates and training \nrelated documentation in the \nrelated worker’s file.\nThe three types of \ntraining in an \neffective training \nprogram are below.\n• Orientations\n• On-the-job\n• Ongoing\nLearning Check (Objective 24)\nState three types of training that should be \nincluded in an effective training program.","74":"Competent Workers and Direct Supervision\nOHS Act s.3(3)\n(a)Employers must ensure that workers are competent or \n(b)under the direct supervision of someone who is competent.\nCompetent (OHS Act s.1) Direct Supervision (OHS Code s.1)\n• Adequately qualified (certificates, \ntickets, trades qualifications if a \nregulated trade, etc.) \n• Suitably trained (orientations, on-the\u0002job training, safety training, etc.)\n• Sufficient experience to work with \nminimal or no supervision (reviews,\nperformance observations, etc.)\n• Must be done by a competent worker\n• Must be done personally and visually \n(supervisor can see the worker and can \nintervene if there is a problem)\n• Must be able to communicate readily \nand clearly with the worker \nTwo Types of Orientations\nGeneral Safety Orientation Site-specific Orientation\n• Company vision, mission, values\n• Company rules and disciplinary \nprocedure\n• Worker rights\n• Health and safety duties \n• Safety tasks (hazard assessments,\nsafety meetings, inspections)\n• Existing and potential hazards \n(including those outside the worker’s \ntasks and area)\n• Hazard controls (engineering, \nadministrative, personal protective \nequipment)\n• Incident reporting procedures\n• Emergency and first aid procedures\n• Location of emergency equipment \n• Use of company vehicles and \nequipment\n• Additional company, job, or project \nspecific requirements\n• Site tour\n• Hazards and controls\n• Rules (company and client \nrequirements)\n• Training requirements (documentation, \ntraining, PPE, etc.)\n• Emergency response procedures\n• Incident reporting requirements\n• Other contractors on-site\nLearning Check (Objective 25)\nList three factors to consider when \ndetermining competency.\nEmployers are \nresponsible for \ndetermining \ncompetency.","75":"On-the-Job Training (OJT)\nOn-the-job training is a hands-on explanation of how to do the tasks assigned to a\nworker. The step-by-step instructions should include all aspects of what the worker is \nrequired to do. \nConduct OJT using the four key principles of instruction. \nKey Principle On-the-Job Training\nTell\n1. Explain the job and how it fits into the larger scope of the workplace/project\n2. Review the formal hazard assessment of the task\n3. Review the safe job procedure and/or safe work practice for the task\n4. Review the steps involved and the sequence of actions to be taken\n5. Conduct a field level hazard assessment (identify hazards and required \ncontrols)\n6. Ensure the worker has the required PPE for the task\nShow\n7. Demonstrate the task step-by-step, stress key points, and ask questions at \nevery step\n8. Explain the reasons behind the guidelines and procedures for the task, and \nthe risks of not performing the task properly\nDo\n9. Observe the worker perform each step of the task\n10. Compliment areas where the worker excels\n11. Show the worker how to correct areas that need improvement\n12. Observe the worker perform each step with corrections\nReview\n13. Check back frequently to answer any worker questions and confirm \nperformance as per safety and quality standards\n14. Continue to mentor, motivate, and monitor the worker\nRemember to keep a record of all OJT. \nTell Show Do Review\nWhen conducting OJT, \nencourage the worker to \nask questions during and \nafter training. \nLearning Check (Objective 26)\nDescribe the four key principles \nof instruction.","77":"Assessment and Documentation \nA large part of training is assessment. Assessments emphasize the importance of the \nworkers’ role concerning health and safety within your organization. \nType of \nAssessment Advantages\nWritten Tests\n• Identify areas that need more clarification\n• Focus on worker success\n• Provide quantitative feedback\n• Observe workers completing documentation \n(e.g., site-specific/field level hazard assessments)\nVerbal Tests • Used as a way to verify knowledge for workers who have \ndifficulty reading and writing\nFormal and \nInformal \nObservations \n• Used to verify workers can apply the knowledge acquired \nduring training\n• Include praise for things done well and specific instructions for \nimprovement\n• As per client, organizational, industry, legislative standards\n• Provides qualitative feedback\nDocumentation and Retention\n• Orientations\n• Competency assessments\n• Qualification certificates\n• Driver’s license\n• Observations\n• Written tests\n• Verbal test results\n• Other\nLearning Check (Objective 27)\nDescribe the advantages of each of the three types of \nassessments used in a training program.\nEnsure that documentation with sensitive \ninformation is kept confidential."},"leg":{"6":"Module 1 – Overview of Legislation and Regulatory Law\nLevels and Priority of Legislation in Canada\nExamples\nCanadian Criminal Code\nCanadian Labour Code\nHazardous Products Act &amp; Regulations\nTDG Act &amp; Regulations\nCanadian Environmental Protection Act\n\nFederal\n(acts + regulations, codes)\n\nExamples\nOHS Act, Regulations, &amp; Code\nFire Code Regulation/Alberta Fire Code\nGas Code Regulation\nCommercial Vehicle Safety Regulation\nPipeline Act &amp; Rules\n\nProvincial/Territorial\n(acts + regulations, codes, rules)\n\nMunicipal\n(bylaws)\n\nA lower level of government may\nenforce a higher level of legislation.\n\nAll three levels of government may have legislation\nthat impacts a work site in Alberta.\n\nExamples\n\nExample – transporting, storing, and using propane\n\n• Municipal building inspectors\nusing a provincial building code\n\n•\n•\n•\n•\n•\n\n• Provincial Sheriffs using the\nCriminal Code of Canada\n\n6\n\nExamples\nNoise Control &amp; Abatement\nWaste Management\nCommunity Standards\nSewers and Drainage\nDangerous Goods Routes\n\nTDG Regulations (Federal)\nDangerous Goods Routes (Municipal)\nAlberta Fire Code (Provincial)\nGas Code Regulation (Provincial)\nAlberta OHS Code (Provincial)\n\nLearning Check (Objective 1)\nRank the three levels of legislation in\nCanada in the correct order.","7":"Regulatory Law\nRegulatory law is a branch of law separate from criminal law. Its primary focus is on\nmaking sure people are safe (i.e., public welfare). Most of the laws that people interact\nwith are regulatory and not criminal.\nFour Common Characteristics of Regulatory Law\n• Focuses on public welfare (public good)\n• Uses some combination of regulations, codes, and/or rules\n• Applies strict liability for offences (may be some exceptions)\n• Allows for a due diligence defense (other defenses may be used)\n\nstrict liability – the burden of proof\nis on a person to prove innocence if\ncharged (the opposite of criminal law)\ndue diligence is a common defense\nin strict liability cases\n\ndue diligence – all the things a\nreasonable person would have done\nto try to avoid or prevent something\nfrom happening\n\nDue Diligence Defense in Regulatory Law (OHS example)\nFactors\n\nQuestions to Answer\n\nForeseeability\n\n•\n•\n•\n•\n\nWould a reasonable person have thought something could go wrong?\nHas anything like this ever happened before (here or elsewhere)?\nWhat industry standards and best practices relate to this incident?\nWas the incident so unlikely that no one could predict it would happen?\n\nPreventability\n\n•\n•\n•\n•\n•\n\nDid the company have and use a safety program?\nWere hazard assessments completed before the incident?\nWere SWPs and SJPs monitored and enforced?\nWere people properly trained? Was there proper supervision?\nDid the company have and use a progressive discipline policy?\n\nControl\n\n• Who had control over the events leading up to the incident?\n\nSources: Government of Alberta, 2017. Alberta OHS Bulletin Due Diligence: OHS information for employers\nCanadian Centre for Occupational Health and Safety - OH&amp;S Legislation in Canada - Due Diligence\n\nLearning Check (Objective 2)\nIdentify the four common\ncharacteristics of regulatory law.\n\nLearning Check (Objective 3)\nList the three factors to be\nconsidered in due diligence.\n\n7","8":"Common Characteristics of the Basic Types of Legislation\nActs\n\nRegulations, Codes, Rules\n\n• Permit a government to regulate an area\n(e.g., traffic safety, environmental protection,\nworker health and safety, etc.)\n• Assign general obligations, duties, and/or\nresponsibilities to individuals and/or\norganizations\n\n• Assign more specific duties or responsibilities\nto individuals\n• Describe more specific actions that must be\ntaken by individuals\n• Outline specific procedures that must be\nfollowed\n\n• Allow a government to create other legislation\nsuch as regulations, codes, and/or rules to\nsupport the Act (i.e., an Act becomes enabling\nlegislation)\n\n• Adopt standards from organizations that must be\nfollowed (e.g., CSA, ANSI, NFPA, etc.)\n\nAlberta’s OHS legislation has an\nAct, Regulations, and Code in that\norder of priority.\n\nIt is impossible for regulations, codes, or rules to\ncover every situation that may exist. That is why\nActs have general obligations that can be used when\ncertain situations occur.\n\nAll of Alberta’s legislation can be\nfound on the Alberta Queen’s\nPrinter website.\n\nExample\nThe OHS Code does not have any specific\nprocedures for working safely during extreme cold.\nThe OHS Act does state that employers have to do\neverything reasonably practicable to ensure the\nhealth and safety and welfare of workers.\nOHS Act s.3(1)(a)(i)\n\nAct\nIn Alberta, different bodies are responsible\nfor different parts of legislation.\n\nRegulations\n\nExample\nCode\n\nLegislative Assembly  Acts\nGovernment departments  Regulations\nBoards/Agencies/Councils Codes\n\n8\n\nLearning Check (Objective 4)\nIdentify common characteristics of\nthe basic types of legislation.","9":"Federal Occupational Health and Safety (OHS) Legislation\nEach province and territory must have its own OHS legislation. However, there are some\nareas where only Federal OHS legislation applies. Employers must know which\nlegislation applies to their work site at any given time.\nThere are two main pieces to Federal OHS legislation.\n• Canada Labour Code (Part II) (similar to Alberta’s OHS Act)\n\n• Canada OHS Regulations (similar to Alberta’s OHS Code)\n\nAreas where Federal OHS Legislation Must be Followed\nArea\nInterprovincial and\ninternational transport\n\nAviation\n\nInterprovincial and\ninternational business\n\nAgriculture\n\nExamples\n•\n•\n•\n•\n\nTrucking, railways, pipelines\nTelephone and cable systems\nCanals, tunnels, bridges\nFerries, shipping, and shipping services\n\n• Air transport, aircraft operations, aerodromes\n•\n•\n•\n•\n\nRadio and television broadcasting\nBanks and federal credit unions\nCanada Mortgage and Housing Corporation\nCanada Post\n\n• Grain elevators, flour and seed mills\n• Feed warehouses, seed cleaning plants\n\nMining/energy\n\n• Uranium mining and processing\n• Atomic energy\n\nGovernance\n\n• First Nations\n• Federal properties, facilities, and land\n\nExample\nA trucking company has a head office and\nmain shop in Alberta, a warehouse/yard in\nSaskatchewan, and hauls to Manitoba.\nThe company should call Alberta OHS to\nexplain the situation and get advice.\n\nAlberta OHS Contact Centre\n1-866-415-8690 (toll free)\n780-415-8690 (Edmonton area)\n\nLearning Check (Objective 5)\nIdentify the two main pieces of\nFederal OHS legislation.\n\n9","13":"Referencing System for Alberta’s OHS Legislation\n\nFour Most Common\nReferencing Components\nsection\n\nDecimal Numbering\n\n(for additions to legislation)\nExamples\n\ns.75.1\ns.16(3.1)\ns.215.4(3)\n\nclause\n\ns. 3 (1) (a) (i)\nsubclause\n\nAdditional Components\n\nsubsection\n\n(following subclauses)\n\nParagraphs (A), (B), (C), etc.\nAlberta Justice and Solicitor General\nsets the referencing system for OHS.\n\nand then…\nSubparagraphs (I), (II), etc.\n\nThe Federal OHS legislation referencing\nsystem is not exactly the same as\nAlberta’s system.\n\nExercise 2a\nComplete the following based on the OHS referencing system.\nReference\n\nQuestion\n\ns.35(7)\n\nWhat section is referenced?\n\ns.287(3)(b)(iii)\n\nWhat clause is referenced?\n\ns.2(1.4)(a)(iv)\n\nWhat subsection is referenced?\n\ns.4(a)(ii)\n\nWhat subclause is referenced?\n\ns.56.2\n\nWhat section is referenced?\n\ns.340(b)\n\nWhat subsection is referenced?\n\ns.472(3)(d)(i)(B)\n\nWhat paragraph is referenced?\n\nLearning Check (Objective 6)\nIdentify the four most common referencing\ncomponents used in Alberta’s OHS legislation.\n\nAnswer\n35\n\n13","14":"Structure of Alberta’s OHS Handbook\n\n12 Parts\nDefinitions s.1\n\nTable of Contents\n\nOHS\nAct\n\n4 Sections\n\nCode Index\nSchedules/Tables\n\nOHS\nRegulation\n\n41 Parts\nAdopted Standards s.3\nDefinitions s.1\n\nTable of Contents\n\nOHS\nCode\n\nExercise 2b\nFind the section title and page number for each of the following references.\n#\n\nReference\n\nSection title\n\nPage\n\n1\n\nAct s.4\n\nObligations of supervisors\n\n12\n\n2\n\nAct s.12\n\n3\n\nCode s.7\n\n4\n\nAct s.31\n\n5\n\nCode s.44\n\n6\n\nCode s.215.1\n\n7\n\nCode s.2.2\n\n14\n\nLearning Check (Objective 7)\nLocate sections in the OHS legislation given a reference.","15":"Module 3 – Alberta’s OHS Act\nOverview of Alberta’s OHS Act\nPart\n\nTitle\n\n1\n\nObligations of\nWork Site Parties\n\n2\n\nHealth and Safety\nCommittees,\nRepresentatives and\nPrograms\n\n• Requirements for HSCs and HSRs specified\n• Health and Safety Programs\n\n3\n\nDangerous Work and\nDisciplinary Action\n\n• Workers have the right to refuse dangerous work\n• Workers are protected from disciplinary action\n\n4\n\nAcceptances, Allowances,\nApprovals,\nInter-jurisdictional\nRecognitions and\nLicences\n\n5\n\nMinister and Staff (administrative issues)\n\n6\n\nMedical Assessments (administrative issues)\n\n7\n\n8\n9\n\nHighlights\n\nCompliance and\nEnforcement\n\n• Obligations for employers, supervisors, workers, suppliers,\nservice providers, owners, contracting employers, prime\ncontractors, and temporary staffing agencies specified\n\n• Allowances to vary from legislation\n• Interjurisdictional recognition\n\n•\n•\n•\n•\n\nOfficer powers for inspections and investigations outlined\nAcceptances and approvals described\nOrders and compliance described\nAdministrative penalties outlined\n\nReviews and Appeals (administrative issues)\nOffences and\nPenalties\n\n• Types of offences described\n• Penalties and directed penalties outlined\n\n10\n\nInformation Collection and Exchange (administrative issues)\n\n11\n\nRegulations and Administration (administrative issues)\n\n12\n\nRelated and Transitional Provisions, Consequential Amendments, Repeal and Coming\ninto Force (administrative issues)\n\nLearning Check (Objective 8)\nAnswer questions using Alberta’s OHS Act.\n\n15","16":"Three Worker Rights\n\nRight to Know\n(the hazards and\nways to eliminate\nor control them)\n\nWorkers must have the\nability to work without\nbeing subject to\ndisciplinary action for\nexercising a right.\n\nWorker\nRights\nAct s.2(d)\n\nRight to\nParticipate\n(in health and\nsafety activities)\n\nDisciplinary actions\nRight to Refuse\n\nany action or threat of action by a\nperson that does or would adversely\naffect a worker with respect to any\nterms or conditions of employment\n\n(dangerous work)\n\nDuty to Refuse vs. Right to Refuse\nOlder versions of the OHS Act made it a worker duty to refuse work if there was an\nimminent danger to the worker. The most recent OHS Act provides a worker with the\nright to refuse dangerous work. This change puts a larger responsibility on employers to\nensure the health and safety of workers. It also brings Alberta’s OHS legislation into line\nwith all other jurisdictions in Canada.\n\n16\n\nLearning Check (Objective 9)\nDescribe the three worker rights\noutlined in the OHS Act.\n\nLearning Check (Objective 10)\nDefine disciplinary action.","19":"Module 5 – Alberta’s OHS Code\nOverview of the OHS Code\n41 Parts\n244 Definitions and 172 adopted standards in Part 1\n12 Schedules and 35 tables\nOver 4000 code references in the Code Index\n\n•\n•\n•\n•\n\nCommon to Many Work Sites\n\nThe Code index is only for\nuse with the OHS Code.\n\nMay Apply to Certain Work Sites\n\nPart\n\nTitle\n\nPart\n\nTitle\n\n2\n\nHazard Assessments\n\n5\n\nConfined Spaces\n\n3\n\nSpecifications and Certifications\n\n6\n\nCranes, Hoists and Lifting Devices\n\n4\n\nChemical &amp; Biological Hazards,\nHarmful Substances\n\n13\n\nHSC &amp; HSR\n\n7\n\nEmergency Preparedness and Response\n\n15\n\nManaging the Control of\nHazardous Energy\n\n8\n\nEntrances, Walkways,\nStairways, and Ladders\n\n21\n\nRigging\n\n9\n\nFall Protection\n\n28\n\nWorking Alone\n\n10\n\nFire and Explosion Hazards\n\n11\n\nFirst Aid\n\n12\n\nGeneral Safety Precautions\n\n20\n\nRadiation Exposure\n\n14\n\nLifting and Handling Loads\n\n26\n\nVentilation\n\n16\n\nNoise Exposure\n\n30\n\nDemolition\n\n17\n\nOverhead Powerlines\n\n31\n\nDiving Operations\n\n18\n\nPersonal Protective Equipment\n\n33\n\nExplosives\n\n19\n\nPowered Mobile Equipment\n\n34\n\nForestry\n\n22\n\nSafeguards\n\n35\n\nHealth Care and Industries\nwith Biological Hazards\n\n23\n\nScaffolds and Temporary Work Platforms\n\n36\n\nMining\n\n24\n\nToilets and Washing Facilities\n\n37\n\nOil and Gas Wells\n\n25\n\nTools, Equipment, and Machinery\n\n38\n\nExpired (Residential Roofing)\n\n27\n\nViolence and Harassment\n\n39\n\nTree Care Operations\n\n29\n\nWHMIS\n\n40\n\nUtility Workers – Electrical\n\n32\n\nExcavating and Tunnelling\n\n41\n\nWork Requiring Rope Access\n\nLearning Check (Objective 11)\nIdentify titles of Parts in the OHS Code.\n\nSpecialized Situations/Other Industries\n\nLearning Check (Objective 12)\nAnswer questions using the OHS Code.\n\n19","23":"Module 6 – Compliance and Enforcement Tools\nCompliance Tools (Orders)\nOrder type\n\nDescription/Purpose\n• Order work taking place to stop forthwith\n• Order any worker or other person to leave the work site forthwith\n\nStop work\n(Act s.39)\n\n• Order specified work site parties to take measures to remove a source of\ndanger or protect persons from danger\n• Order to stop using equipment that is not in safe operating condition or\ndoes not comply with legislation\n• Order specified work site parties to take measures to remove a source of\ndanger or protect persons from danger\n\nStop use\n(Act s.40)\n\n• Order a supplier to stop supplying equipment, substance, or material that\nmay pose a danger to persons\n\nEnforcement Tools\nTool\nAdministrative penalties\n(Act s.44)\n\nRegulatory penalties\n(Act s.48(1))\n\nDescription/Examples\n• up to $10 000 per violation per day or part thereof\n1st offence\n• fine ≤ $500 000 or imprisonment ≤ 6 months, or both\n• up to $30 000 per day for continuing offences\n2nd offense\n• fine ≤ $1 000 000 or imprisonment ≤12 months, or both\n• up to $60 000 per day for continuing offences\n\nAlberta OHS Officers also have an additional enforcement\ntool referred to as Ticketing Provisions. This is found in the\nProvincial Offences &amp; Procedures Act. Workers or employers\nmay be issued tickets if found to be in violation of applicable\nrequirements related to OHS legislation.\n\nLearning Check (Objective 13)\nIdentify the correct type of order\ngiven a scenario.\n\nLearning Check (Objective 14)\nDescribe the two provincial\nenforcement tools used by OHS.\n\n23","25":"OHS and the Criminal Code of Canada\nDuty \n\ns.217.1 Duty of persons directing work\nEvery one who undertakes, or has the a
