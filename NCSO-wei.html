<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NCSO 备考 — 全课程</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0C0C0C;--s1:#181818;--s2:#222;--s3:#2C2C2C;
  --t1:#F2F2F2;--t2:#A8A8A8;--t3:#606060;
  --acc:#D4A843;--acc2:#A8842E;
  --bdr:#2A2A2A;--bdr2:#383838;
  --rad:14px;--rad-s:9px;
  --safe:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--t1);
  font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB',sans-serif;
  font-size:15px;}

#app{height:100%;display:flex;flex-direction:column;overflow:hidden}

/* ─── HEADER ─── */
#hdr{flex-shrink:0;padding:14px 18px 0}
#hdr-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
#hdr-title{font-size:17px;font-weight:700;letter-spacing:-0.3px}
#hdr-sub{font-size:12px;color:var(--t3)}
.mode-grp{display:flex;gap:4px;background:var(--s2);border-radius:20px;padding:3px}
.mode-btn{padding:4px 11px;font-size:12px;border-radius:16px;border:none;
  background:transparent;color:var(--t2);cursor:pointer;transition:all .15s}
.mode-btn.on{background:var(--s3);color:var(--t1);font-weight:600}
#prog{height:3px;background:var(--s3);border-radius:2px;overflow:hidden;margin-bottom:10px}
#prog-f{height:100%;background:var(--acc);border-radius:2px;transition:width .4s}

/* ─── SEARCH ─── */
#srch-wrap{padding:0 18px 8px;flex-shrink:0}
#srch{width:100%;padding:9px 14px 9px 36px;border-radius:var(--rad-s);border:.5px solid var(--bdr2);
  background:var(--s2);color:var(--t1);font-size:14px;outline:none}
#srch::placeholder{color:var(--t3)}
#srch:focus{border-color:var(--acc)}
.srch-icon{position:absolute;left:30px;top:50%;transform:translateY(-50%);color:var(--t3);font-size:14px;pointer-events:none}
#srch-wrap{position:relative}

/* ─── COURSE TABS ─── */
#ctabs{display:flex;gap:6px;padding:0 18px 8px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#ctabs::-webkit-scrollbar{display:none}
.ctab{flex-shrink:0;padding:5px 12px;font-size:12px;font-weight:600;border-radius:20px;
  border:.5px solid var(--bdr2);color:var(--t2);cursor:pointer;transition:all .15s;white-space:nowrap}
.ctab.on{color:#fff;border-color:transparent}

/* ─── CARD LIST ─── */
#list{flex:1;overflow-y:auto;padding:0 18px;padding-bottom:calc(72px + var(--safe));scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
#empty{display:none;padding:60px 0;text-align:center;color:var(--t3);font-size:14px}

/* ─── KO CARD ─── */
.card{background:var(--s1);border:.5px solid var(--bdr);border-radius:var(--rad);
  margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.card.done{opacity:.6}
.card.open{border-color:var(--bdr2)}
.card-hdr{padding:13px 14px;display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.card-num{flex-shrink:0;width:30px;height:30px;border-radius:8px;display:flex;
  align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.card-info{flex:1;min-width:0}
.card-title{font-size:13px;font-weight:500;line-height:1.45;margin-bottom:5px}
.card-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--t3)}
.card-course{font-weight:600}
.card-pg{background:var(--s3);padding:2px 6px;border-radius:4px}
.card-right{display:flex;flex-direction:column;align-items:center;gap:6px;flex-shrink:0}
.card-dot{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--bdr2)}
.card-dot.done{background:var(--acc);border-color:var(--acc)}
.card-chev{color:var(--t3);transition:transform .2s;font-size:12px}
.card.open .card-chev{transform:rotate(180deg)}

/* ─── CARD BODY ─── */
.card-body{display:none;padding:0 14px 14px;border-top:.5px solid var(--bdr)}
.card.open .card-body{display:block}
.sec{margin-top:12px}
.sec-h{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--t3);margin-bottom:7px}
.sec-b{font-size:13px;line-height:1.7;color:var(--t2)}
.sec-b p{margin-bottom:5px}
.sec-b ul{padding-left:17px;margin-bottom:5px}
.sec-b li{margin-bottom:3px}
.sec-b strong{font-weight:600;color:var(--t1)}
.sec-b table{width:100%;border-collapse:collapse;font-size:12px;margin:4px 0}
.sec-b th{text-align:left;padding:6px 8px;background:var(--s3);color:var(--t1);font-weight:600;
  border-bottom:.5px solid var(--bdr2)}
.sec-b td{padding:5px 8px;border-bottom:.5px solid var(--bdr);color:var(--t2);vertical-align:top}
.sec-b tr:last-child td{border-bottom:none}
.tip{margin-top:12px;background:rgba(212,168,67,.09);border:.5px solid rgba(212,168,67,.25);
  border-radius:var(--rad-s);padding:11px 13px}
.tip-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
  color:var(--acc2);margin-bottom:5px}
.tip-t{font-size:13px;line-height:1.6;color:var(--t1)}
.mark-btn{margin-top:12px;width:100%;padding:10px;border-radius:var(--rad-s);
  border:.5px solid var(--bdr2);background:var(--s2);color:var(--t2);
  font-size:12px;cursor:pointer;transition:all .15s}
.mark-btn.done{background:rgba(212,168,67,.12);border-color:rgba(212,168,67,.3);color:var(--acc)}

/* ─── BOTTOM BAR ─── */
#bot{position:fixed;bottom:0;left:0;right:0;
  padding:10px 18px;padding-bottom:calc(10px + var(--safe));
  background:var(--bg);border-top:.5px solid var(--bdr);
  display:flex;align-items:center;justify-content:space-between}
#bot-l{font-size:12px;color:var(--t2)}
#bot-l strong{font-size:16px;color:var(--t1)}
.nav-grp{display:flex;gap:6px}
.nav-b{padding:8px 15px;border-radius:var(--rad-s);border:.5px solid var(--bdr2);
  background:var(--s2);color:var(--t1);font-size:13px;cursor:pointer}
.nav-b:disabled{opacity:.3}
.nav-b.pri{background:var(--acc);border-color:var(--acc);color:#000;font-weight:700}

/* ─── STAT BAR ─── */
#stat-bar{display:flex;gap:6px;padding:0 18px 8px;flex-shrink:0;overflow-x:auto;scrollbar-width:none}
#stat-bar::-webkit-scrollbar{display:none}
.stat-chip{flex-shrink:0;background:var(--s2);border:.5px solid var(--bdr);
  border-radius:8px;padding:5px 10px;font-size:11px;color:var(--t2);white-space:nowrap}
.stat-chip strong{color:var(--t1)}

@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{animation:fi .18s ease}
</style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div id="hdr-row">
      <div><div id="hdr-title">NCSO 备考</div><div id="hdr-sub" id="hdr-sub">全课程 · 164条知识目标</div></div>
      <div class="mode-grp">
        <button class="mode-btn on" id="m-all" onclick="setMode('all')">全部</button>
        <button class="mode-btn" id="m-rev" onclick="setMode('review')">复习</button>
      </div>
    </div>
    <div id="prog"><div id="prog-f" style="width:0%"></div></div>
  </div>
  <div id="srch-wrap">
    <span class="srch-icon">🔍</span>
    <input id="srch" placeholder="搜索知识点、关键词..." oninput="onSearch(this.value)">
  </div>
  <div id="ctabs"></div>
  <div id="stat-bar"></div>
  <div id="list"></div>
  <div id="empty">没有找到匹配的知识点</div>
  <div id="bot">
    <div id="bot-l">已掌握 <strong id="rc">0</strong><span style="color:var(--t3)"> / 164</span></div>
    <div class="nav-grp">
      <button class="nav-b" id="bp" onclick="nav(-1)">上一条</button>
      <button class="nav-b pri" id="bn" onclick="nav(1)">下一条</button>
    </div>
  </div>
</div>

<script>
const DATA = [{"lid":1,"title":"Describe the main purpose of PIR","page":"p.5–6","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"PIR是什么","b":"<p>PIR（Partnerships in Injury Reduction，减伤合作计划）是 Alberta 省政府（GoA）项目，核心目标只有一个：<strong>减少工作场所伤害</strong>。</p>"},{"h":"运作方式（三角关系）","b":"<ul><li>GoA/PIR 制定标准</li><li>Certifying Partner（认证合作方，如ACSA）负责培训、认证审计员、审查审计结果</li><li>公司 负责建立并维护 HSMS</li></ul>"},{"h":"关键性质","b":"<ul><li>参与是<strong>自愿的</strong>，但要获得 COR，HSMS 必须通过审计</li><li>COR 的好处：WCB 保费最多降低 20%，可获返利，许多客户要求合作方持有 COR 才能投标</li></ul>"}],"tip":"PIR = 政府项目 → 目的是减少伤害 → 通过帮助公司建立HSMS → 用审计验证效果。不参加没关系，参加就得过审计关。","gid":1},{"lid":2,"title":"Describe the COR audit cycle","page":"p.7","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"三年周期结构","b":"<table><tr><th>年份</th><th>类型</th><th>重点</th></tr><tr><td>第1年</td><td>外部认证审计（Certification Audit）</td><td>HSMS通过标准则获得COR</td></tr><tr><td>第2年</td><td>维护审计（Maintenance Audit）</td><td>公司识别改进领域</td></tr><tr><td>第3年</td><td>维护审计（Maintenance Audit）</td><td>持续改进</td></tr></table>"},{"h":"两个重要规则","b":"<ul><li>每个三年周期必须以<strong>新的外部审计</strong>重新开始</li><li>公司至少需要<strong>1年的数据</strong>才有资格申请三年期COR</li></ul>"},{"h":"审计验证的三种技术（D-I-O）","b":"<ul><li><strong>D</strong>ocumentation review（文件审查）</li><li><strong>I</strong>nterviews（访谈）</li><li><strong>O</strong>bservations（现场观察）</li></ul>"}],"tip":"1-2-3循环，第1年最严（外部审计），2、3年是自己改进。记住\"1年数据\"和\"每轮重新开始\"这两个细节——考题爱考。","gid":2},{"lid":3,"title":"Describe the three reasons why an employer should have an HSMS","page":"p.8","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[],"tip":"\"法财道\" — 三个理由。财务方面记住：间接成本 直接成本，这是考题常考的反直觉点。道德原因最简单：因为对。","gid":3},{"lid":4,"title":"Describe the three factors that contribute to due diligence","page":"p.9","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"先理解概念","b":"<ul><li><strong>Regulatory law（监管法）</strong>：区别于刑事法，重点是公众安全，OHS法规属于监管法</li><li><strong>Strict liability（严格责任）</strong>：举证责任在被告方（与刑事法相反，不是\"无罪推定\"）</li><li><strong>Due diligence（尽职调查）</strong>：严格责任案件中最常用的辩护方式</li></ul>"},{"h":"Due Diligence 的三个因素","b":"<table><tr><th>因素</th><th>核心问题</th><th>解释</th></tr><tr><td>**Foreseeability（可预见性）**</td><td>合理的人是否会预见到这件事可能发生？</td><td>如果危险是可预见的但没有采取措施，则可能无法以此辩护</td></tr><tr><td>**Preventability（可预防性）**</td><td>公司是否采取了合理措施来防止它发生？</td><td>包括：有没有HSMS、做没做危害评估、有没有培训监督等</td></tr><tr><td>**Control（控制权）**</td><td>谁对导致事故的事件有控制权？</td><td>控制范围内的危害必须要处理，控制范围外的则另当别论</td></tr></table>"}],"tip":"\"预防控\" — 可预见→可预防→谁有控制权。考题常用场景题：给你一个事故，问是否满足due diligence。答题思路：① 公司能不能预见到？② 有没有做措施？③ 那个危险归谁管？","gid":4},{"lid":5,"title":"Describe a H&S policy and the five key requirements","page":"p.12","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"什么是H&S Policy","b":"<p>H&S政策是一份<strong>书面声明</strong>，确认公司对维护健康安全工作场所的承诺。最高级别管理人员应签署，所有层级员工应知晓其内容。</p>"},{"h":"五个关键要求（必须全部满足）","b":"<table><tr><th>要求</th><th>内容</th></tr><tr><td>**1. Commitment（承诺）**</td><td>明确说明对员工健康安全的承诺，包括身体、**心理**和社会福祉</td></tr><tr><td>**2. Purpose（目的）**</td><td>解释该政策与HSMS整体目标的关系</td></tr><tr><td>**3. Responsibilities（责任）**</td><td>描述所有角色（管理层、主管、工人、承包方、访客等）的一般责任</td></tr><tr><td>**4. Compliance（合规）**</td><td>声明所有人必须遵守公司政策、程序和适用法规</td></tr><tr><td>**5. Sign-off（签署）**</td><td>由高级管理层签署并注明日期</td></tr></table>"},{"h":"注意细节","b":"<ul><li>Commitment 要包含\"心理（psychological）\"福祉——考题爱考这个细节</li><li>Sign-off 必须是高级管理层，不是HR，不是安全经理</li></ul>"}],"tip":"\"承目责合签\" — 五个要素首字。看到H&S政策样本时，逐一对照这五个要素检查哪个缺失。Commitment里记得加\"心理\"。","gid":5},{"lid":6,"title":"Describe employer, supervisor, worker, and prime contractor responsibilities under OHS Act","page":"p.15–16","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"各方的OHS法律定义（p.15）","b":"<table><tr><th>角色</th><th>OHS定义</th></tr><tr><td>**Prime Contractor**</td><td>当工地有2个或以上雇主时，**书面指定**为工地控制人的人</td></tr><tr><td>**Contracting Employer**</td><td>通过合同/协议/所有权指导一个或多个雇主活动的人</td></tr><tr><td>**Employer**</td><td>雇用工人的人；或被指定代表雇主的人</td></tr><tr><td>**Supervisor**</td><td>负责工地或对工人有权力的人</td></tr><tr><td>**Worker**</td><td>从事职业的人</td></tr></table>"},{"h":"各方OHS义务（p.16）","b":""},{"h":"雇主（s.3）必须确保","b":"<ul><li>工人的健康、安全和福利</li><li>工人了解其权利和责任</li><li>工人不受骚扰和暴力</li><li>工人由能胜任的人监督</li><li>HSC/HSR履行其职责</li><li>工人获得充分培训</li><li>OHS法规和健康安全信息随时可查</li></ul>"},{"h":"主管（s.4）必须","b":"<ul><li>采取一切预防措施保护工人</li><li>确保工人遵守OHS法规</li><li>告知工人所有已知或可合理预见的危害</li><li>向雇主报告不安全行为或状况</li></ul>"},{"h":"工人（s.5）必须","b":"<ul><li>保护自己和他人的健康安全</li><li>与主管和雇主合作</li><li>使用要求的PPE</li><li>不参与骚扰或暴力</li><li>报告不安全情况</li></ul>"}],"tip":"Prime Contractor 的关键词：\"书面指定（designated in writing）\" 和 \"2个或以上雇主\" ——缺一不可。主管的核心义务是：预防→告知→报告。","gid":6},{"lid":7,"title":"List at least eight ways supervisors and workers participate in HSMS","page":"p.17","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[],"tip":"这10个基本覆盖了HSMS的所有日常活动。考题一般让你\"列举至少8个\"，记住这个完整列表即可全部答出。","gid":7},{"lid":8,"title":"Describe the three worker rights outlined in the OHS Act","page":"p.17","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"重要附加点","b":"<p>工人行使这三项权利时，不能受到纪律处分（disciplinary action）。OHS Act 明确保护这一点。</p>"}],"tip":"\"知参拒\" — 知情、参与、拒绝。这三个权利贯穿整个HSMS，考题可能从不同角度考，比如：某工人因拒绝工作被解雇，是否违法？（是的，违反了Right to Refuse的保护）","gid":8},{"lid":9,"title":"Identify examples for each of the two types of OHS resources employers must provide","page":"p.18","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"两类必须\"readily available（随时可查）\"的资源","b":""},{"h":"① 公司信息（Company information）","b":"<ul><li>危害识别和评估（hazard assessments）</li><li>危害控制措施（hazard controls）</li><li>检查结果（inspection results）</li><li>安全工作规范（SWPs）</li><li>安全工作程序（SJPs）</li></ul>"},{"h":"② OHS法规文本（OHS Act, Regulations, and Code）","b":"<ul><li>纸质版、下载版或存储的电子版本，必须是<strong>当前版本</strong></li></ul>"},{"h":"\"Readily available\"的含义","b":"<ul><li>位置靠近工人</li><li>在每个班次期间都可访问</li><li>所有工人必须知道在哪里找到这些资源</li></ul>"}],"tip":"两类：公司内部信息（HA、检查、SWP/SJP）+ OHS法规文本。\"readily available\" = 工人在班次中随时能拿到，不是锁在办公室里。","gid":9},{"lid":10,"title":"Define two types of hazards","page":"p.25","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"四个危害类别（p.26）— 帮助识别和分类危害","b":"<table><tr><th>类别</th><th>例子</th></tr><tr><td>**Physical（物理）**</td><td>人体工学差、振动、噪音、辐射、高处作业、极端温度</td></tr><tr><td>**Chemical（化学）**</td><td>化学品释放、烟雾、蒸气、气体</td></tr><tr><td>**Biological（生物）**</td><td>病毒、真菌/霉菌、细菌、体液</td></tr><tr><td>**Psychological（心理）**</td><td>骚扰欺凌、压力、疲劳、轮班工作、工作生活冲突</td></tr></table>"}],"tip":"Health = 慢性/长期（你可能感觉不到但在积累）；Safety = 立即（能当场看到或感受到结果）。四类危害记为\"物化生心\"。","gid":10},{"lid":11,"title":"Explain the difference between a formal hazard assessment and a site-specific hazard assessment","page":"p.27","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"关键区别一句话","b":"<p>Formal HA = <strong>预先、全面、公司级别</strong>；SSHA = <strong>当天、现场、任务级别</strong>。</p>"}],"tip":"Formal是公司的\"功课\"，SSHA是每天上工前的\"检查\"。Formal做好了放手册里，SSHA是当天现场填的表。","gid":11},{"lid":12,"title":"Describe the nine steps in the formal hazard assessment process","page":"p.29–36","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[],"tip":"用首字记忆：确列识排选实沟监审。重点记住Step 4的风险矩阵（可能性×严重性）和Step 9的触发条件（新流程、流程变更、重大工地变化等）。","gid":12},{"lid":13,"title":"Explain the difference between a job and a task","page":"p.31","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[],"tip":"Job = 你的\"头衔\"，Task = 你实际在做的事情。考题常用场景：正式危害评估应该评估哪个层级？→ 评估 Tasks（Step 2/3），不是评估 Jobs。","gid":13},{"lid":14,"title":"Identify the four contributing factors to health and safety hazards","page":"p.32","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"PEME — 四个促成因素","b":"<table><tr><th>因素</th><th>考虑的问题</th></tr><tr><td>**People（人）**</td><td>他们训练是否充分？是否过度疲劳？什么在驱动他们的行为？</td></tr><tr><td>**Equipment（设备）**</td><td>工具/设备是否适合任务？是否正确安装？是否按时维护？是否遵循厂商规格？</td></tr><tr><td>**Materials（材料）**</td><td>使用了什么材料？是否被正确处置、储存和废弃？</td></tr><tr><td>**Environment（环境）**</td><td>工地在哪里？工作环境是否引入了危害？（天气、照明、空间等）</td></tr></table>"}],"tip":"\"PEME\" — People, Equipment, Materials, Environment。做危害识别（Step 3）时，针对每项任务逐一过这四个维度，不遗漏。考题常给场景，让你指出遗漏了哪个维度的危害。","gid":14},{"lid":15,"title":"Describe the two factors used to determine risk","page":"p.33","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"风险矩阵结果","b":"<ul><li><strong>绿色（<3）</strong>：低风险</li><li><strong>黄色（3–4）</strong>：中等风险</li><li><strong>红色（>4）</strong>：高风险</li></ul>"}],"tip":"矩阵分数用乘法：1×1=1（绿），3×3=9（红）。严重性的三个等级词汇要记英文原文——考题可能原文引用：\"makes you uncomfortable / sends you to the hospital / kills you or causes disability\"。","gid":15},{"lid":16,"title":"Describe the Hierarchy of Controls","page":"p.34","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"关键原则","b":"<ul><li>应该<strong>首先尝试消除</strong>危害</li><li>如果不能消除，必须控制</li><li>OHS Code 规定了这个控制顺序</li><li>经常需要<strong>组合使用</strong>多层控制</li></ul>"}],"tip":"\"消替工行个\" — 从最有效到最不有效。PPE 是最后一道防线，不是首选。考题场景：给你一个危害，问最合适的控制层级是哪个。记住：只要能消除就消除，不能消除才往下选。","gid":16},{"lid":17,"title":"Identify three factors that influence the selection of hazard controls","page":"p.47","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"三个影响因素","b":"<table><tr><th>因素</th><th>核心问题</th></tr><tr><td>**Legislation（法规）**</td><td>是否已使用控制层级？是否有法定的操作规程（Code of Practice）要求？PPE是否符合标准？</td></tr><tr><td>**Practicality（实用性）**</td><td>控制措施是否技术上可行？财务上是否可承受？是否影响现有运营？</td></tr><tr><td>**Worker Input（工人意见）**</td><td>工人是否理解并同意控制措施？控制措施是否会被实际使用？是否会引入新危害？</td></tr></table>"}],"tip":"\"法实工\" — 法规约束、实际可行性、工人接受度。选控制措施不是想当然，要考虑这三个维度。","gid":17},{"lid":18,"title":"Identify opportunities for monitoring controls or becoming aware of control issues","page":"p.50","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"监控控制措施的机会（课本列出的）","b":"<table><tr><th>机会类型</th><th>具体例子</th></tr><tr><td>**检查（Inspections）**</td><td>正式检查、非正式检查</td></tr><tr><td>**暴露测试（Exposure Testing）**</td><td>噪音监测、水质检测、空气采样</td></tr><tr><td>**SSHA（现场特定危害评估）**</td><td>每天开工前发现控制措施失效</td></tr><tr><td>**险兆/事故（Near Misses/Incidents）**</td><td>通过调查发现控制措施不足</td></tr><tr><td>**工人反馈（Worker Feedback）**</td><td>工人报告控制措施不好用或已失效</td></tr><tr><td>**安全会议/工具箱会谈**</td><td>工人提出控制问题</td></tr></table>"},{"h":"强化控制使用的机会","b":"<ul><li>项目前会议（pre-project meetings）</li><li>检查和危害评估期间</li><li>安全会议、尾门会议/工具箱会谈</li><li>员工纪律会议（执行层面）</li></ul>"}],"tip":"监控 = 检查、测试、SSHA、调查、工人反馈。核心逻辑：控制措施不会永久有效，要持续检查是否还在起作用。","gid":18},{"lid":19,"title":"Identify the OHS-required components of a harassment and violence prevention plan","page":"p.52","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"OHS Code Part 27 要求","b":"<p>必须分别制定并实施：</p>\n<ul><li><strong>Violence Prevention Plan（暴力预防计划）</strong></li><li><strong>Harassment Prevention Plan（骚扰预防计划）</strong></li></ul>\n<p>两者都必须<strong>与HSC/HSR协商制定</strong>；如没有HSC/HSR，与受影响的工人协商。</p>"},{"h":"每个计划必须包含（两者相同结构）","b":"<ul><li><strong>Written Policy（书面政策）</strong> — 明确声明零容忍</li><li><strong>Written Procedures（书面程序）</strong> — 如何报告、调查、跟进</li><li><strong>Training（培训）</strong> — 工人和主管都要接受</li><li><strong>Information and Instruction（信息与指导）</strong> — 提供给所有工人</li></ul>"},{"h":"培训内容须包括","b":"<ul><li>识别骚扰和暴力行为</li><li>政策和程序说明</li><li>如何报告事件</li></ul>"}],"tip":"两个计划（暴力+骚扰），结构相同：政策→程序→培训→信息。\"consultation\"是关键词，必须与HSC/HSR或受影响工人商量制定，不能单方面拍板。","gid":19},{"lid":20,"title":"State the main purpose of an HSC","page":"p.58","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"HSC（Health and Safety Committee）的主要目的","b":"<p>识别和解决安全顾虑，并在工作场所推广健康安全。</p>"},{"h":"核心价值","b":"<p>HSC 增加管理层与工人之间的<strong>双向沟通</strong>。它是HSMS的重要组成部分。</p>"},{"h":"法定要求触发线","b":"<ul><li>经常雇用 <strong>20名或以上</strong>工人 → 必须设立 HSC</li><li>经常雇用 <strong>5–19名</strong>工人 → 必须指定 HSR（Health and Safety Representative）</li><li>HSR 在Alberta 拥有与 HSC 相同的角色和责任</li></ul>"},{"h":"HSC的法定职责（Act s.13(6)）","b":"<ul><li>接收和考虑关于工人健康安全的顾虑</li><li>参与危害评估</li><li>向雇主提出健康安全建议</li><li>定期审查雇主的工地检查文件</li></ul>"}],"tip":"20人 → HSC；5–19人 → HSR。主要目的 = 识别和解决安全顾虑 + 促进双向沟通。","gid":20},{"lid":21,"title":"List the topics HSC committee members or an HSR must be trained on","page":"p.59","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"OHS Code s.201 要求的培训主题","b":"<p>所有HSC成员或HSR必须接受以下方面的培训：</p>\n<ul><li>职责、权力和义务（roles, duties, and rights）</li><li>危害识别和评估（hazard identification and assessment）</li><li>工地检查（work site inspections）</li><li>事故调查（incident investigations）</li><li>纠正措施（corrective actions）</li><li>相关OHS立法（relevant OHS legislation）</li></ul>"}],"tip":"这六个培训主题基本就是HSMS的核心活动清单。记住：法律明文要求（Code s.201），不是可选项。","gid":21},{"lid":22,"title":"State the three parts of the OHS definitions of competent and direct supervision","page":"p.68","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"Competent（胜任）的三个组成部分（三者同等重要）","b":"<ul><li><strong>Adequately qualified（充分具备资质）</strong> 例子：证书、文凭、学位、操作票、贸易资质等</li></ul>\n<ul><li><strong>Suitably trained（接受适当培训）</strong> 例子：定向培训、在职培训（OJT）、现场特定安全培训等</li></ul>\n<ul><li><strong>Sufficient experience to work with minimal or no supervision（有足够经验在无或最少监督下工作）</strong> 例子：技能评估、操作测试、观察、绩效审查等</li></ul>"},{"h":"Direct Supervision（直接监督）的含义","b":"<p>主管<strong>在场</strong>且工人<strong>可立即联系到</strong>主管。</p>"}],"tip":"胜任三要素：资质+培训+经验，缺一不可。一个人可能有资质（证书）但没经验，或有经验但没接受特定培训——都不算完全\"competent\"。Direct supervision 不是远程监督，是真正在场的监督。","gid":22},{"lid":23,"title":"Describe the two common types of orientations","page":"p.73","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"关键点","b":"<ul><li>所有工地相关方都应在开始正式工作前完成定向</li><li>包括新员工、调岗员工和承包方</li><li>主管应验证新员工或开始新任务员工的定向完成情况</li></ul>"}],"tip":"两种定向：入职（公司层面）+ 每次新工地（现场层面）。区别：General是关于公司的通用信息，Site-Specific是关于这个工地今天的具体情况。","gid":23},{"lid":24,"title":"Describe the four common training principles used for OJT","page":"p.75","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"OJT（On-the-Job Training，在职培训）四原则","b":"<table><tr><th>原则</th><th>内容</th><th>关键点</th></tr><tr><td>**Tell（讲解）**</td><td>解释将要执行的任务，识别该任务相关的危害</td><td>先说清楚要做什么和为什么</td></tr><tr><td>**Show（示范）**</td><td>展示如何正确执行任务</td><td>培训员亲自演示</td></tr><tr><td>**Do（实践）**</td><td>让学员在监督下亲自尝试</td><td>必须包含实际操作演示</td></tr><tr><td>**Review（评估）**</td><td>评估学员是否达到能力要求，记录结果</td><td>必须文件化，构成尽职调查记录</td></tr></table>"},{"h":"OJT的前提","b":"<ul><li>必须识别该任务特定的危害</li><li>必须包含学员的<strong>实际演示（practical demonstration）</strong></li><li>所有OJT必须记录文件（due diligence）</li></ul>"}],"tip":"\"讲示做评\" — Tell, Show, Do, Review。这个顺序逻辑很清晰，不要跳过\"Show\"直接让人\"Do\"。考题可能给场景：培训只讲了没让做——缺少了哪个原则？答：缺少 Do（和 Review）。","gid":24},{"lid":25,"title":"Describe methods used for internal assessments","page":"p.77","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"四种内部评估方法","b":"<table><tr><th>方法</th><th>用途</th><th>特点</th></tr><tr><td>**Written Tests（笔试）**</td><td>验证知识迁移</td><td>评估员必须胜任管理笔试的能力</td></tr><tr><td>**Oral Tests（口试）**</td><td>验证语言表达能力差或不识字工人的知识</td><td>适合多语言环境</td></tr><tr><td>**Observations（观察）**</td><td>验证实际工作行为</td><td>在真实工作环境中评估</td></tr><tr><td>**Practical/Skill Assessments（实践/技能评估）**</td><td>验证执行任务的实际能力</td><td>需要设定明确的绩效目标（Performance Objective）</td></tr></table>"},{"h":"关键原则","b":"<ul><li>方法选择应满足尽职调查要求并符合行业最佳实践</li><li><strong>任何评估都必须记录文件</strong>，这是记录管理的一部分</li><li>进行评估的人必须自己也是胜任的（competent）</li></ul>"}],"tip":"四种方法覆盖不同场景：笔试测知识、口试测理解（解决语言障碍）、观察测行为、实践测技能。重点：都要文件化。","gid":25},{"lid":26,"title":"Describe the work site parties identified in the OHS Act","page":"p.82–83","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"完整的工地相关方列表","b":"<table><tr><th>角色</th><th>OHS定义关键点</th></tr><tr><td>**Owner（所有者）**</td><td>依据 Land Titles Act 登记为土地所有者的人；或与所有者签协议承担OHS义务的人</td></tr><tr><td>**Prime Contractor**</td><td>当工地有2个或以上雇主时，**书面指定**为工地控制人</td></tr><tr><td>**Contracting Employer**</td><td>通过合同/协议/所有权**指导**一个或多个雇主活动的人</td></tr><tr><td>**Employer**</td><td>雇用工人的人</td></tr><tr><td>**Supervisor**</td><td>负责工地或对工人有权力的人</td></tr><tr><td>**Worker**</td><td>从事职业的人</td></tr><tr><td>**Supplier（供应商）**</td><td>销售、租赁、安装或提供设备/有害物质的人</td></tr><tr><td>**Service Provider（服务提供商）**</td><td>提供培训、咨询、测试、计划开发等服务的人</td></tr><tr><td>**Temporary Staffing Agency（临时人力中介）**</td><td>保留工人并部署到其他雇主处的人</td></tr></table>"}],"tip":"考试不要求记全所有人，但Owner、Prime Contractor、Contracting/Contracted Employer的区别是高频考点。记住：Prime Contractor = 必须书面指定 + 多雇主工地时才需要。","gid":26},{"lid":27,"title":"Describe contracting employer responsibilities","page":"p.83–84","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"Contracting Employer（发包方雇主）的法律职责（s.8）","b":"<ul><li>确保承包方雇主遵守OHS法规</li><li>告知所有工地各方可能影响他们的<strong>现有或潜在危害</strong></li><li>与履行OHS职责的他人合作</li></ul>"},{"h":"此外","b":"<p>Contracting Employer 还拥有所有雇主的普通责任（s.3），以及其他角色（如Prime Contractor、Owner）的责任。一个雇主可能同时扮演多个角色。</p>"}],"tip":"Contracting Employer 的核心额外责任：告知危害 + 确保承包方合规。如果一个大公司同时是Prime Contractor和Contracting Employer，那么它必须同时满足两套要求。","gid":27},{"lid":28,"title":"Describe the contracted employer management process","page":"p.85","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"三步管理流程（循环进行）","b":"<p><strong>Step 1: Pre-Qualification and Selection（资格预审与选择）</strong></p>\n<ul><li>建立流程</li><li>确定要求</li><li>评估候选者（过去绩效、当前能力、认证/文件）</li></ul>\n<p><strong>Step 2: Project Management（项目管理）</strong></p>\n<ul><li>为承包方提供工地定向</li><li>告知工地危害和控制措施</li><li>沟通重要运营变更</li><li>分享调查结果</li></ul>\n<p><strong>Step 3: Monitoring, Evaluation, and Feedback（监控、评估和反馈）</strong></p>\n<ul><li>监控承包方的安全表现</li><li>评估表现</li><li>提供反馈</li></ul>"},{"h":"重要提示","b":"<p>每次与新的承包方合作，都应重复这三步流程。</p>"}],"tip":"\"选管监\" — 先筛选，再管理，最后监控反馈。三步都是动词，帮助记忆动作而不只是概念。","gid":28},{"lid":29,"title":"Identify the two key elements of a PSP that must be readily available","page":"p.86","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"PSP（Project Safety Plan，项目安全计划）中必须随时可查的两个关键要素","b":"<ul><li><strong>Emergency response information（紧急应对信息）</strong> — 工地所有人员在紧急情况下需要知道什么</li></ul>\n<ul><li><strong>Hazard information（危害信息）</strong> — 工地存在的危害及其控制措施</li></ul>"},{"h":"为什么强调\"readily available\"","b":"<p>工地所有相关方（包括承包方和访客）都必须能获取这两类信息，否则在紧急情况时就无法有效应对。</p>"}],"tip":"PSP有很多内容，但考试只关注必须\"随时可查\"的这两个：紧急应对 + 危害信息。其他内容（政策、角色分工、培训等）也重要，但这两个是法规层面的最低要求。","gid":29},{"lid":30,"title":"List at least five key inspection-related issues that the HSMS should focus on","page":"p.93","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"课本列出的7个检查关注点（至少记5个）","b":"<ul><li>是否已识别所有危害和潜在危害？</li><li>主管和工人是否遵守法规？</li><li>主管和工人是否遵循规则和程序？</li><li>是否已识别危害的潜在直接原因？</li><li>是否对危害控制措施进行监控？</li><li>是否制定了适当的纠正措施？</li><li>公司是否了解正在进行的作业和任务？</li></ul>"}],"tip":"检查的目的不只是找问题，而是评估HSMS的运行状态。检查 = HSMS的反馈机制。","gid":30},{"lid":31,"title":"List the four basic steps of most formal inspection models","page":"p.95","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[],"tip":"\"计执报跟\" — 四步和四个英文单词一一对应。Report 阶段必须包含：问题 + 纠正措施 + 负责人 + 目标日期——缺任何一项都是不完整的。","gid":31},{"lid":32,"title":"Describe the four requirements of an inspection policy and procedure","page":"p.96","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"检查政策必须回答（3个）","b":"<ul><li>Why（为什么做检查？）</li><li>Who（谁来做？）</li><li>When（什么时候做？）</li></ul>"},{"h":"检查程序必须回答（2个）","b":"<ul><li>What（检查什么？）</li><li>How（如何记录？）</li></ul>"},{"h":"四个最低要求领域","b":"<table><tr><th>领域</th><th>内容</th></tr><tr><td>**Areas and Equipment（区域和设备）**</td><td>明确所有需要检查的区域和设备</td></tr><tr><td>**Personnel（人员）**</td><td>指定负责人，代表公司各层级</td></tr><tr><td>**Frequency（频率）**</td><td>根据工作类型制定适当频率</td></tr><tr><td>**Corrective Actions（纠正措施）**</td><td>记录纠正措施的系统，含责任人和目标日期</td></tr></table>"}],"tip":"政策 = Why/Who/When；程序 = What/How。四个最低要求用\"区人频纠\"记忆。","gid":32},{"lid":33,"title":"State reasons why management and workers should participate in formal inspections","page":"p.100","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"管理层参与的原因","b":"<ul><li>显示对HSMS的承诺（以身作则）</li><li>发现系统性问题（全局视角）</li><li>确保纠正措施完成（权力推动执行）</li><li>满足法律要求：管理层必须审查并签署所有正式检查报告</li></ul>"},{"h":"工人参与的原因","b":"<ul><li>对工地运营最熟悉，能提供关键意见</li><li>最直接受危害影响的人</li><li>增强主人翁意识和共同责任感</li><li>这是OHS法规赋予工人的<strong>权利（Right to Participate）</strong></li></ul>"}],"tip":"管理层参与 = 权威 + 责任；工人参与 = 知识 + 权利。两者缺一不可，只有管理层参与是\"走形式\"，只有工人参与是\"缺乏追责\"。","gid":33},{"lid":34,"title":"Describe the steps that must occur when there is a work refusal","page":"p.102","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"工作拒绝流程（Work Refusal Process）","b":"<ul><li><strong>工人认为工作危险或潜在危险</strong> → 立即向雇主/主管报告</li><li><strong>主管/雇主尝试解决问题</strong></li><li>如果问题无法快速解决：<strong>雇主检查危险状况</strong>并采取行动保证工人安全</li><li>如果问题仍未解决：<strong>报告OHS（Alberta OHS官员）</strong></li><li>OHS官员介入调查和裁决</li></ul>"},{"h":"关键原则","b":"<ul><li>工人在行使拒绝权时<strong>不应受到纪律处分</strong></li><li>拒绝工作后需<strong>立即</strong>报告，不是沉默等待</li><li>如果一个工人拒绝后，雇主不能将危险工作直接分配给另一工人</li></ul>"}],"tip":"拒绝→报告→主管尝试解决→不行→雇主检查→还不行→报OHS。关键词：\"立即报告\" 和 \"不能受惩罚\"。","gid":34},{"lid":35,"title":"Recognize common sources of information to identify emergencies requiring an ERP","page":"p.106","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"创建ERP时识别紧急情况类型的信息来源","b":"<ul><li>危害评估结果（formal HA 和 SSHA）</li><li>过去的事故历史（公司内部和行业记录）</li><li>OHS法规要求（OHS Code Part 7）</li><li>行业标准和最佳实践</li><li>工地特定信息（地理位置、工作类型等）</li><li>保险要求</li><li>客户要求</li></ul>"}],"tip":"ERP不是凭空写的，要基于真实信息。最重要的两个来源是危害评估（知道有什么危险）和法规要求（知道必须准备什么）。","gid":35},{"lid":36,"title":"Identify the OHS-required components of an ERP","page":"p.108","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"OHS Code Part 7 要求ERP必须包含","b":"<ul><li>识别潜在紧急情况类型</li><li>处理已识别紧急情况的程序</li><li>识别、定位和操作紧急设备的程序</li><li>紧急应对培训要求</li><li>紧急设施的位置和使用说明</li><li>消防保护要求</li><li>警报和紧急通讯要求</li><li>识别所需急救服务</li><li>救援和疏散程序</li><li>识别指定救援和疏散工人</li></ul>"},{"h":"其他要求","b":"<ul><li>雇主必须指定救援和疏散工人</li><li>必须告知所有工地工人ERP的内容</li><li>ERP必须<strong>与其他工地相关方共享</strong></li></ul>"}],"tip":"ERP 10个要素可以归纳为：识别紧急情况→响应程序→设备设施→培训→通讯→急救→人员指定。最容易遗漏的是\"与其他工地相关方共享\"这一点。","gid":36},{"lid":37,"title":"Identify the OHS-required components of a first aid report","page":"p.110","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"First Aid Record 必须包含（OHS Code Part 11）","b":"<ul><li>工人姓名</li><li>急救员姓名</li><li>急救员资质</li><li>伤害/疾病描述</li><li>提供的急救描述</li><li>伤害/疾病发生的日期和时间</li><li>伤害/疾病报告的日期和时间</li></ul>"},{"h":"重要附加要求","b":"<ul><li>记录必须<strong>保密</strong></li><li>保留至少<strong>3年</strong>（从伤害/疾病报告之日起）</li><li>记录副本须提供给工人（工人可拒绝）</li></ul>"}],"tip":"七个要素：谁受伤→谁处理→处理者资质→发生了什么→怎么处理的→何时发生→何时报告。\"3年\" 是关键数字。","gid":37},{"lid":38,"title":"State the minimum requirement for conducting ERP drills","page":"p.114","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"演练的重要性","b":"<ul><li>演练是ERP的\"实时测试\"</li><li>帮助发现ERP的优势和弱点</li><li>特别关注需要更新培训、程序或通讯的地方</li><li>演练结果必须成为公司健康安全记录的一部分</li></ul>"},{"h":"参与要求","b":"<ul><li>所有指定的救援和疏散工人必须参与</li><li>所有管理人员应参与所有演练</li></ul>"}],"tip":"最低要求 = 每年一次。记住这是最低要求，高风险工地可能需要更频繁。演练不是走形式，要记录并分析结果。","gid":38},{"lid":39,"title":"Identify reasons why near misses should be investigated","page":"p.120","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"为什么要调查险兆事件（near misses）","b":"<ul><li><strong>预防升级</strong>：险兆在同一工地通常多次出现，最终会导致实际伤亡</li><li><strong>事故金字塔原理</strong>：1起死亡→30起工时损失→300起可报告伤害→3000起险兆事件。解决险兆就是在底部切断这个金字塔</li><li><strong>建立安全文化</strong>：显示公司对预防而非追责的承诺</li><li><strong>尽职调查记录</strong>：调查记录本身就是due diligence的证明</li></ul>"},{"h":"关键条件","b":"<p>工人必须相信报告险兆不会有负面后果（不是追责文化），否则险兆会被隐瞒，公司失去预防机会。</p>"}],"tip":"险兆 = 免费的预警信号。\"事故金字塔\" 是核心论据：3000个险兆对应1个死亡，消灭险兆就是预防死亡。调查险兆的前提是无追责文化。","gid":39},{"lid":40,"title":"Identify the injuries or incidents that employers must investigate and report","page":"p.121","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"OHS Act Section 33 — 必须向OHS报告（Reportable Incidents）","b":"<ul><li>导致工人死亡的伤害/疾病/事件</li><li>工人入院治疗（或有理由相信会入院）</li><li>意外爆炸、火灾或洪水导致严重伤害，或有潜力导致严重伤害</li><li>起重机、人字架或提升装置的倒塌或倾覆</li><li>建筑物或结构的任何必要承重部件的倒塌或失效</li><li>有可能导致严重伤亡（住院或死亡级别）的事件，且有理由相信需要纠正措施</li></ul>"},{"h":"WCB 报告要求（p.122）","b":"<ul><li>雇主必须在被通知后<strong>72小时内</strong>向WCB报告</li><li>适用情况：工时损失、改善工作超过事故当天、死亡、永久残疾、需超出急救的医疗治疗</li></ul>"}],"tip":"OHS Section 33 = 死亡/入院/爆炸火灾/倒塌/结构失效/高风险险兆。WCB关键数字：72小时。两个报告渠道：OHS（监管机构）+ WCB（工伤赔偿）。","gid":40},{"lid":41,"title":"Recognize the components of a S.M.A.R.T. corrective action","page":"p.126","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"纠正措施的三个关键特征（p.126）","b":"<ul><li>必须针对调查识别的原因</li><li>必须有指定的负责人</li><li>必须是SMART格式</li></ul>"}],"tip":"SMART首字母是固定的，但要记清楚每个字母对应的实际含义。考题常给一条不符合SMART的纠正措施，让你指出问题：比如\"需要时增加人手\"→ 不Specific，不Measurable，不Time-bound。","gid":41},{"lid":42,"title":"State why a record management system is an important part of the HSMS","page":"p.131","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"记录管理系统的重要性","b":"<ul><li><strong>尽职调查证明（Due Diligence）</strong>： 如果发生事故或被OHS检查，记录是证明公司做了正确事情的关键证据</li></ul>\n<ul><li><strong>追踪绩效趋势（Track Trends）</strong>： 通过分析记录发现安全问题的模式，在问题升级前干预</li></ul>\n<ul><li><strong>支持审计（Support Audits）</strong>： COR审计主要依赖文件，没有记录=没有证明</li></ul>\n<ul><li><strong>满足法规要求（Legal Compliance）</strong>： OHS法规对多类记录有<strong>最低保留期限</strong>要求（见p.132的表格）</li></ul>"},{"h":"常见记录保留要求（p.132）","b":"<ul><li>急救记录：<strong>3年</strong></li><li>事故调查报告：<strong>2年</strong></li><li>受限空间记录：1年（无事故），2年（有事故）</li><li>员工培训证书：在职期间全程保留</li><li>危害评估：在相关工作进行期间全程保留</li></ul>"}],"tip":"记录 = 尽职调查的证据。数字要记准：急救记录3年、调查报告2年。无记录=无法证明你做过=无法在事故中使用due diligence辩护。","gid":42},{"lid":43,"title":"State the benefits of auditing","page":"p.134","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"审计的四种类型","b":"<table><tr><th>类型</th><th>用途</th></tr><tr><td>**Certification（认证）**</td><td>用于COR/SECOR认证过程</td></tr><tr><td>**Maintenance（维护）**</td><td>在认证审计之间的两个维护年进行</td></tr><tr><td>**Post-event（事后）**</td><td>重大损失事故后进行</td></tr><tr><td>**Qualification（资质）**</td><td>审计员培训项目中用于认证目的</td></tr></table>"},{"h":"审计的好处","b":"<ul><li>识别HSMS的优势和不足</li><li>提供持续改进的基础</li><li>证明尽职调查</li><li>满足PIR/COR认证要求（维持WCB返利资格）</li><li>减少伤害风险，降低成本</li><li>创建系统评估的客观记录</li></ul>"}],"tip":"审计的核心价值：客观评估HSMS表现。不是找人麻烦，是找系统漏洞。四种类型记住 Certification/Maintenance/Post-event/Qualification。","gid":43},{"lid":44,"title":"Describe leading and lagging indicators","page":"p.135","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"三个关键公式（p.136–137）","b":""},{"h":"LTFR（Lost Time Frequency Rate）","b":"<p>> LTFR = 工时损失案例数 × 200,000 ÷ 总员工暴露小时数</p>"},{"h":"ISR（Injury Severity Rate）","b":"<p>> ISR = 损失工作日数 × 200,000 ÷ 总员工暴露小时数</p>"},{"h":"TRIF（Total Recordable Incident Frequency）","b":"<p>> TRIF = (工时损失案例 + 医疗援助案例 + 改善工作案例) × 200,000 ÷ 总员工暴露小时数</p>"}],"tip":"Leading = 预防活动（看未来，主动）；Lagging = 事故结果（看过去，被动）。两者都需要，单看一种会有盲点。三个公式都除以\"总员工暴露小时数\"，分子分别是：损失案例、损失天数、总可记录事故（3类合计）。","gid":44},{"lid":45,"title":"Describe the purpose of an action plan","page":"p.138","cid":"phsm","cname":"PHSM","color":"#1D5C3A","sections":[{"h":"行动计划（Action Plan）的目的","b":"<p>在审计发现HSMS不足之处后，提供一个<strong>改进HSMS的计划</strong>，推动下一年的持续改进。</p>"},{"h":"行动计划的结构要求","b":"<ul><li>每项纠正措施针对审计发现的具体不足</li><li>每项纠正措施必须是<strong>SMART格式</strong></li><li>每项纠正措施必须有<strong>指定的负责人</strong>和<strong>目标日期</strong></li><li>有了行动计划，才能推动问责制（accountability）</li></ul>"},{"h":"与审计的关系","b":"<p>审计 → 找出不足 → 行动计划 → 改进HSMS → 下次审计时评估改进效果 → 循环往复（持续改进）</p>"}],"tip":"行动计划 = 审计的后续步骤，不是独立存在的文件。没有行动计划，审计报告就只是存档的文件，HSMS不会改进。关键词：SMART + 负责人 + 目标日期 + 持续改进。","gid":45},{"lid":1,"title":"Rank the three levels of legislation in Canada in the correct order","page":"p.6","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"三个层级（从高到低）","b":"<ul><li><strong>1. Federal（联邦）</strong>：Acts + Regulations and Codes。例：Criminal Code、Labour Code、Hazardous Products Act、TDG Act</li><li><strong>2. Provincial/Territorial（省/地区）</strong>：Acts + Regulations, Codes, Rules。例：OHS Act、OHS Code、Fire Code</li><li><strong>3. Municipal（市政）</strong>：Bylaws（地方法令）。例：Noise Control、Waste Management</li></ul>"},{"h":"关键规则","b":"<ul><li>较低级别政府<strong>可以执行</strong>较高级别的立法</li><li>三个层级可同时影响同一工地（如运输、储存和使用丙烷同时涉及TDG联邦法规、Alberta Fire Code、市政危险品路线）</li></ul>"}],"tip":"「联省市」从大到小。联邦最高（Criminal Code、TDG）→省（OHS Act/Code）→市政（Bylaws）。低层可执行高层法规。","gid":46},{"lid":2,"title":"Identify the four common characteristics of regulatory law","page":"p.7","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"监管法是什么","b":"<p>监管法是<strong>独立于刑事法</strong>的法律分支，主要关注公众安全。OHS法规属于监管法。</p>"},{"h":"四个共同特征","b":"<ul><li>关注<strong>公众福利（public welfare）</strong></li><li>使用法规、准则和/或规则的<strong>某种组合</strong></li><li>适用<strong>严格责任（strict liability）</strong>——举证责任在被告方（与刑事法相反）</li><li>允许<strong>尽职调查辩护（due diligence defense）</strong></li></ul>"},{"h":"关键术语","b":"<ul><li><strong>Strict liability：</strong>被告必须证明自己无罪（不是检察官证明有罪）</li><li><strong>Due diligence：</strong>合理的人为避免事情发生所做的一切措施</li></ul>"}],"tip":"「公组严尽」：公众福利、组合规则、严格责任（举证倒置）、尽职调查辩护。核心：被告自证清白。","gid":47},{"lid":3,"title":"List the three factors to be considered in due diligence","page":"p.7","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"三个因素","b":"<table><tr><th>因素</th><th>核心问题</th></tr><tr><td><strong>Foreseeability（可预见性）</strong></td><td>合理的人是否会预见到这件事可能发生？行业有无类似案例？</td></tr><tr><td><strong>Preventability（可预防性）</strong></td><td>公司是否有并使用了HSMS、危害评估、培训、监督？</td></tr><tr><td><strong>Control（控制权）</strong></td><td>谁对导致事故的事件拥有控制权？</td></tr></table>"}],"tip":"「预防控」：Foreseeability→Preventability→Control。答due diligence场景题模板：能预见吗？采取措施了吗？谁有控制权？","gid":48},{"lid":4,"title":"Identify common characteristics of the basic types of legislation","page":"p.8","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"基本立法类型","b":"<table><tr><th>类型</th><th>特征</th><th>例子</th></tr><tr><td><strong>Acts（法案）</strong></td><td>由立法机构通过；最高层级；其他立法不能与之冲突</td><td>OHS Act, Criminal Code</td></tr><tr><td><strong>Regulations（法规）</strong></td><td>由内阁/行政机构制定；在Act授权下运作；比Acts更具体</td><td>OHS Regulation</td></tr><tr><td><strong>Codes（准则）</strong></td><td>技术要求和标准；通过法规获得法律效力</td><td>OHS Code, Alberta Building Code</td></tr><tr><td><strong>Bylaws（地方法令）</strong></td><td>市政机构制定的地方规则</td><td>Noise Control Bylaw</td></tr></table>"}],"tip":"层级：Acts（最高/立法机构）→Regulations（行政/具体）→Codes（技术标准）→Bylaws（地方）。Acts是框架，Code是技术细节。","gid":49},{"lid":5,"title":"Identify the two main pieces of Federal OHS legislation","page":"p.9","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"两个主要联邦OHS法规","b":"<ul><li><strong>Canada Labour Code（加拿大劳工法典）</strong>：适用于联邦管辖行业——银行、电信、航空、跨省运输等</li><li><strong>Canada Occupational Health and Safety Regulations</strong>：在Canada Labour Code下制定的具体OHS要求</li></ul>"},{"h":"注意","b":"<p>Alberta工地大部分受<strong>省级OHS Act</strong>管辖。联邦法规适用于联邦管辖行业（铁路、银行、航空等）。</p>"}],"tip":"两联邦法：Canada Labour Code + Canada OHS Regulations。Alberta省级工地用省级OHS Act，联邦管辖行业（航空/银行/铁路）才用联邦法。","gid":50},{"lid":6,"title":"Identify the four most common referencing components used in Alberta's OHS legislation","page":"p.13","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"四个引用组件","b":"<table><tr><th>组件</th><th>说明</th><th>引用格式</th></tr><tr><td><strong>Act（法案条款）</strong></td><td>OHS Act的具体条款</td><td>Act s.4</td></tr><tr><td><strong>Regulation（法规条款）</strong></td><td>OHS Regulation的条款</td><td>Reg s.12</td></tr><tr><td><strong>Code Part（准则部分）</strong></td><td>OHS Code的41个Parts</td><td>Code Part 9</td></tr><tr><td><strong>Schedule（附表）</strong></td><td>OHS Code的12个附表</td><td>Schedule 2</td></tr></table>"},{"h":"引用层级","b":"<p>Section（条款）→ Subsection（子条款）→ Clause（条项）→ Subclause（子条项）</p>"}],"tip":"「法规准附」四组件：Act条款、Regulation条款、Code Part、Schedule。引用格式：Act s.X，Code Part X，Code s.X(Y)。","gid":51},{"lid":7,"title":"Locate sections in the OHS legislation given a reference","page":"p.14","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"OHS Code结构","b":"<ul><li>41个Parts，超过849个条款</li><li>Part 1含超过244个定义</li><li>12个Schedules，35个表格</li><li>超过4000个Code索引引用</li></ul>"},{"h":"考试高频Parts","b":"<table><tr><th>Part</th><th>内容</th></tr><tr><td>Part 2</td><td>Hazard Assessment, Elimination and Control</td></tr><tr><td>Part 7</td><td>Emergency Preparation and Response</td></tr><tr><td>Part 9</td><td>Fall Protection</td></tr><tr><td>Part 11</td><td>First Aid</td></tr><tr><td>Part 13</td><td>Joint Work Site HSC and HSR</td></tr><tr><td>Part 18</td><td>Personal Protective Equipment</td></tr><tr><td>Part 27</td><td>Violence and Harassment</td></tr><tr><td>Part 29</td><td>WHMIS</td></tr></table>"}],"tip":"OHS Code 41个Parts。高频考：Part 2(危害)、7(应急)、9(坠落)、11(急救)、13(HSC)、27(骚扰/暴力)、29(WHMIS)。","gid":52},{"lid":8,"title":"Answer questions using Alberta's OHS Act","page":"p.15","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"OHS Act关键章节速查","b":"<table><tr><th>Section</th><th>内容</th></tr><tr><td>s.1</td><td>定义（supervisor、worker、employer、competent等）</td></tr><tr><td>s.3</td><td>雇主义务（7项）</td></tr><tr><td>s.4</td><td>主管义务</td></tr><tr><td>s.5</td><td>工人义务</td></tr><tr><td>s.8</td><td>承包雇主义务</td></tr><tr><td>s.13</td><td>HSC要求（≥20人）</td></tr><tr><td>s.14</td><td>HSR要求（5–19人）</td></tr><tr><td>s.17</td><td>拒绝危险工作的权利</td></tr><tr><td>s.33/40</td><td>可报告事件（Reportable Incidents）</td></tr></table>"}],"tip":"核心Section：s.3雇主、s.4主管、s.5工人、s.13 HSC(≥20)、s.14 HSR(5-19)、s.17拒绝权、s.33可报告事件。","gid":53},{"lid":9,"title":"Describe the three worker rights outlined in the OHS Act","page":"p.16","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"三大工人权利","b":"<table><tr><th>权利</th><th>内容</th><th>关键保护</th></tr><tr><td><strong>Right to Know（知情权）</strong></td><td>了解工作场所危害及控制方式</td><td>雇主必须提供信息和培训</td></tr><tr><td><strong>Right to Participate（参与权）</strong></td><td>参与健康安全活动（HSC、检查等）</td><td>不能因参与受惩罚</td></tr><tr><td><strong>Right to Refuse（拒绝权）</strong></td><td>拒绝被认为危险的工作</td><td>必须立即报告；不能被处分</td></tr></table>"},{"h":"保护条款","b":"<p>行使任何一项权利后，工人<strong>不得受到纪律处分（disciplinary action）</strong>。雇主不能将被拒绝的危险工作转给另一名工人。</p>"}],"tip":"「知参拒」三权利。行使任何权利后受处分=违法。经典陷阱：工人拒绝危险工作被解雇→违反Right to Refuse保护。","gid":54},{"lid":10,"title":"Define disciplinary action","page":"p.16","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"定义","b":"<p><strong>Disciplinary action</strong>是指任何对工人在工作场所有<strong>不利影响</strong>的行动，包括：</p><ul><li>解雇（termination）</li><li>停职（suspension）</li><li>降职（demotion）</li><li>惩罚性调岗（penalizing transfer）</li><li>任何其他对工人有害的行为</li></ul>"},{"h":"与工人权利的关系","b":"<p>工人因行使三大权利（知情/参与/拒绝）而受到disciplinary action是<strong>违法的</strong>。</p>"}],"tip":"Disciplinary action=对工人任何不利行动（解雇/停职/降职/惩罚性调岗）。不仅仅是解雇。行使三大权利后受处分=违法。","gid":55},{"lid":11,"title":"Identify titles of Parts in the OHS Code","page":"p.19","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"OHS Code重要Parts","b":"<table><tr><th>Part</th><th>标题</th></tr><tr><td>1</td><td>Definitions and General Application</td></tr><tr><td>2</td><td>Hazard Assessment, Elimination and Control</td></tr><tr><td>4</td><td>Chemical and Biological Hazards</td></tr><tr><td>5</td><td>Confined Spaces</td></tr><tr><td>7</td><td>Emergency Preparation and Response</td></tr><tr><td>9</td><td>Fall Protection</td></tr><tr><td>11</td><td>First Aid</td></tr><tr><td>13</td><td>Joint Work Site Health and Safety Committees</td></tr><tr><td>18</td><td>Personal Protective Equipment</td></tr><tr><td>27</td><td>Violence and Harassment</td></tr><tr><td>29</td><td>WHMIS</td></tr></table>"}],"tip":"必记7个高频Part：2危害评估、7应急、9坠落保护、11急救、13 HSC/HSR、27骚扰暴力、29 WHMIS。","gid":56},{"lid":12,"title":"Answer questions using the OHS Code","page":"p.19","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"关键用法规则","b":"<ul><li><strong>「shall」</strong>= 强制必须（mandatory）</li><li><strong>「should」</strong>= 建议（recommended）</li><li><strong>「reasonably practicable」</strong>= 在合理可行的情况下（常见修饰语）</li></ul>"},{"h":"答题步骤","b":"<ul><li>①根据主题确定Code Part（Part 2危害、Part 9坠落等）</li><li>②找具体Section号</li><li>③注意shall vs should的区别</li><li>④注意「reasonably practicable」修饰范围</li></ul>"}],"tip":"Code答题：「shall」=强制，「should」=建议，「reasonably practicable」=合理可行范围内。先定Part，再找Section。","gid":57},{"lid":13,"title":"Identify the correct type of order given a scenario","page":"p.23","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"两种命令类型","b":"<table><tr><th>类型</th><th>触发条件</th><th>效果</th></tr><tr><td><strong>Stop Work Order（停工令）</strong></td><td>存在<strong>紧迫危险</strong>，继续会立即造成伤害</td><td>立即停止特定或全部工作</td></tr><tr><td><strong>Compliance Order（合规令）</strong></td><td>存在<strong>违规</strong>但无紧迫危险</td><td>在指定期限内纠正违规</td></tr></table>"},{"h":"场景判断法","b":"<p>看见「<strong>immediate danger</strong>（紧迫危险）」→停工令；看见「<strong>need to fix</strong>（需要改正）」→合规令。两者都由OHS Officer发出。</p>"}],"tip":"停工令=立即危险（immediate danger）；合规令=有违规但给期限改正。都由OHS Officer发出。","gid":58},{"lid":14,"title":"Describe the two provincial enforcement tools used by OHS","page":"p.23","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"两种省级执法工具","b":"<table><tr><th>工具</th><th>说明</th></tr><tr><td><strong>Compliance Orders（合规令）</strong></td><td>要求在指定期限内纠正违规；包括Stop Work Order；由OHS Officer发出</td></tr><tr><td><strong>Administrative Penalties（行政罚款）</strong></td><td>对违反OHS法规处以经济处罚；<strong>无需经法庭程序</strong>，直接开出</td></tr></table>"},{"h":"更严重后果","b":"<p>违反Criminal Code s.217.1（directing work责任）→刑事检控→联邦大额罚款+联邦监禁。比行政罚款严重得多。</p>"}],"tip":"「令款」两工具：Compliance Orders + Administrative Penalties。罚款无需法庭直接开出。刑事违规走另一渠道（联邦监禁）。","gid":59},{"lid":15,"title":"State the duty of those directing work as outlined in the Criminal Code of Canada","page":"p.25","cid":"leg","cname":"LEG","color":"#8B3000","sections":[{"h":"刑事法典第217.1条内容","b":"<p>任何<strong>指导他人工作（directing the work）</strong>的人有法律责任：</p><ul><li>采取合理步骤<strong>防止对工人造成身体伤害（bodily harm）</strong></li><li>防止工人死亡</li></ul>"},{"h":"违反后果","b":"<ul><li>可面临<strong>刑事指控（criminal charges）</strong></li><li>处罚：<strong>大额罚款</strong>和/或<strong>联邦监禁</strong></li><li>这是联邦刑事法，远比OHS行政处罚严厉</li></ul>"},{"h":"适用对象","b":"<p>适用于<strong>所有</strong>指导他人工作的人：管理层、主管、Prime Contractor，甚至工头。</p>"}],"tip":"Criminal Code s.217.1：directing work的人必须防止bodily harm。违反=刑事指控=联邦监禁。适用所有层级管理者。","gid":60},{"lid":1,"title":"Recognize three essential actions of an effective safety leader","page":"p.6","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"三个核心行动","b":"<ul><li><strong>Mentoring（指导）</strong>：指导工人以最安全的方式执行任务</li><li><strong>Motivating（激励）</strong>：以身作则，激励工人重视安全</li><li><strong>Monitoring（监督）</strong>：监督工人遵守所要求的标准</li></ul>"},{"h":"为什么主管是关键","b":"<p>雇主必须对主管进行培训，使其成为现场的安全领导者。主管是连接管理层政策与工人实际操作的桥梁。</p>"}],"tip":"三M：Mentoring（指导）、Motivating（激励）、Monitoring（监督）。主管既是老师又是执行者。","gid":61},{"lid":2,"title":"Recognize three goals of corporate culture","page":"p.8","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"企业文化的三个目标","b":"<ul><li>工人<strong>自主持有</strong>安全标准（hold safety standards themselves）</li><li>工人<strong>相互问责</strong>（hold each other accountable）</li><li>工人<strong>主动参与</strong>改进安全系统（actively participate in improving safety systems）</li></ul>"},{"h":"企业文化六个组成部分","b":"<table><tr><th>组成</th><th>说明</th></tr><tr><td>Vision</td><td>使命宣言</td></tr><tr><td>Values</td><td>核心价值观</td></tr><tr><td>Policies</td><td>对公司价值观的书面承诺</td></tr><tr><td>People</td><td>所有管理层、主管和工人</td></tr><tr><td>Narrative</td><td>公司独特历史故事</td></tr><tr><td>Place</td><td>物理布局和环境</td></tr></table>"}],"tip":"文化三目标：自主持标准、互相问责、主动参与改进。强大的文化让安全成为自发行为，不是规定执行。","gid":62},{"lid":3,"title":"Describe three main sources of supervisor health and safety responsibilities","page":"p.9","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"三个主要来源","b":"<table><tr><th>来源</th><th>包含内容</th></tr><tr><td><strong>Company H&S Program（公司H&S项目）</strong></td><td>公司政策和程序；适用立法；行业最佳实践</td></tr><tr><td><strong>Safety Team（安全团队）</strong></td><td>管理层；主管；工人</td></tr><tr><td><strong>Safety Tasks（安全任务）</strong></td><td>Pre-job（工前）；Periodic（定期）；Ongoing（持续）</td></tr></table>"},{"h":"内外部影响因素","b":"<ul><li><strong>外部：</strong>联邦和省级立法、市政法令、行业标准、客户要求</li><li><strong>内部：</strong>企业文化、公司愿景、公司政策</li></ul>"}],"tip":"三来源：公司H&S项目（政策+立法+最佳实践）、安全团队（管+主+工）、安全任务（工前+定期+持续）。","gid":63},{"lid":4,"title":"Identify common purposes of the three main components of Alberta's OHS legislation","page":"p.11","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"三个立法组件及目的","b":"<table><tr><th>组件</th><th>目的</th></tr><tr><td><strong>OHS Act</strong></td><td>设定雇主、主管、工人和其他工地相关方的权利和义务的框架</td></tr><tr><td><strong>OHS Regulation</strong></td><td>提供Act的具体实施要求</td></tr><tr><td><strong>OHS Code</strong></td><td>提供详细的技术标准和要求（41个Parts）</td></tr></table>"}],"tip":"Act（权利义务框架）+ Regulation（具体要求）+ Code（技术标准41Parts）。三者共同构成Alberta OHS法律体系。","gid":64},{"lid":5,"title":"Describe the obligations of a supervisor under the OHS Act","page":"p.12","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"主管的法定义务（OHS Act s.4）","b":"<ul><li>采取<strong>一切预防措施</strong>保护工人健康和安全</li><li>确保监督下的工人<strong>遵守OHS法规</strong></li><li>告知工人所有<strong>已知或可合理预见的危害</strong></li><li>向雇主<strong>报告不安全行为或状况</strong></li><li>确保工人具备<strong>能力（competent）</strong>或处于直接监督下</li></ul>"}],"tip":"主管义务：预防（保护工人）、遵守（确保合规）、告知（危害信息）、报告（不安全情况上报雇主）。","gid":65},{"lid":6,"title":"Identify the three groups that make up a company's safety team","page":"p.19","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"三个群体","b":"<ul><li><strong>Management（管理层）</strong>：建立H&S项目、提供资源、执行政策</li><li><strong>Supervisors（主管）</strong>：以身作则、指导工人、执行现场合规</li><li><strong>Workers（工人）</strong>：遵守规程、报告危险、参与安全活动</li></ul>"},{"h":"管理层具体责任","b":"<ul><li>确保H&S项目建立</li><li>确保工人接受培训</li><li>确保PPE按要求使用</li><li>向相关机构报告必要事件（WCB、OHS）</li></ul>"}],"tip":"安全团队三组：Management（建立和资源）、Supervisors（执行和示范）、Workers（遵守和参与）。缺一不可。","gid":66},{"lid":7,"title":"Recognize one responsibility for each group on a company's safety team","page":"p.19","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"各组代表责任","b":"<table><tr><th>群体</th><th>代表责任</th></tr><tr><td><strong>Management</strong></td><td>确保H&S项目建立并维护；提供资源；向当局报告事件</td></tr><tr><td><strong>Supervisors</strong></td><td>以身作则；指导工人安全作业；报告危险给雇主</td></tr><tr><td><strong>Workers</strong></td><td>遵守公司规则和OHS要求；报告不安全状况；正确使用PPE</td></tr></table>"}],"tip":"管理层=建立系统+提供资源；主管=执行+示范；工人=遵守+报告。三组各有侧重，共同构成安全团队。","gid":67},{"lid":8,"title":"Describe the three types of supervisor safety tasks","page":"p.20","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"三种安全任务类型","b":"<table><tr><th>类型</th><th>例子</th><th>说明</th></tr><tr><td><strong>Pre-job Planning（工前计划）</strong></td><td>工作范围、危害识别、人员配置、设备、培训、PPE</td><td>提前安排，确保安全</td></tr><tr><td><strong>Scheduled/Periodic Tasks（定期任务）</strong></td><td>定向、工具箱会议、危害评估、检查、调查、培训、审计</td><td>频率由公司H&S政策决定</td></tr><tr><td><strong>Continuous/Ongoing Tasks（持续任务）</strong></td><td>非正式检查、随时沟通、随时纠正</td><td>日常持续进行</td></tr></table>"}],"tip":"三类任务：Pre-job（工前计划）、Periodic（定期：检查/培训/会议）、Ongoing（持续：日常非正式）。","gid":68},{"lid":9,"title":"Identify at least three best practices for a daily logbook entry","page":"p.21","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"日志的作用","b":"<p>日志是主管的<strong>个人和职业记录</strong>，记录工地日常事件。在法律纠纷和事故调查中是关键证据。</p>"},{"h":"日志物理要求","b":"<ul><li>装订本（<strong>不能有活页、线圈或可移除页面</strong>）</li><li>页码连续编号</li></ul>"},{"h":"记录最佳实践（至少记3条）","b":"<ul><li>注明<strong>地点/项目、重要时间和日期</strong></li><li>记录当日发生的<strong>事件</strong></li><li>记录事件的<strong>事实</strong>（不是猜测或意见）</li><li>记录<strong>涉及人员</strong>及其角色</li><li>记录为解决问题<strong>所做的决定</strong></li><li>事后不得<strong>修改</strong>（用单线划去错误，在旁边更正并签名）</li></ul>"}],"tip":"日志三要素：装订本+连续页码+不可修改。记录内容：地点/时间/日期、事实（非猜测）、涉事人员、解决决定。","gid":69},{"lid":10,"title":"State the two supervisor obligations related to hazard assessments","page":"p.23","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"两项主管义务（OHS Act s.4）","b":"<ul><li>必须<strong>告知工人所有可能影响其健康安全的危害</strong>（advise workers of all hazards）</li><li>必须向雇主<strong>报告所有不安全或有害行为及状况</strong>（report unsafe/harmful acts and conditions）</li></ul>"},{"h":"两种危害评估","b":"<ul><li><strong>Formal HA（正式危害评估）</strong>：预工作/项目级别，识别所有职位相关危害</li><li><strong>SSHA（现场特定危害评估）</strong>：每日/任务级别，在工地进行</li></ul>"}],"tip":"主管两义务：告知危害（advise）+ 报告不安全（report）。两者都要向上（报雇主）向下（告知工人）沟通。","gid":70},{"lid":11,"title":"State the two factors most risk assessment models evaluate","page":"p.25","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"风险 = 可能性 × 严重性","b":"<table><tr><th>因素</th><th>等级</th><th>描述</th></tr><tr><td rowspan='3'><strong>Severity（严重性）</strong></td><td>1</td><td>Makes you uncomfortable（令你不舒服）</td></tr><tr><td>2</td><td>Sends you to the hospital（送你去医院）</td></tr><tr><td>3</td><td>Kills you or causes disability（导致死亡或残疾）</td></tr><tr><td rowspan='3'><strong>Likelihood（可能性）</strong></td><td>1</td><td>Unlikely（不太可能）</td></tr><tr><td>2</td><td>Might happen（可能发生）</td></tr><tr><td>3</td><td>Highly likely（极有可能）</td></tr></table>"},{"h":"风险等级","b":"<ul><li><strong>低（L）：</strong>分数 &lt;3（绿色）</li><li><strong>中（M）：</strong>分数 3–4（黄色）</li><li><strong>高（H）：</strong>分数 &gt;4（红色）</li></ul>"}],"tip":"风险=可能性×严重性。严重性记英文原文：uncomfortable/hospital/kills。1×1=1(低)，3×3=9(高)。","gid":71},{"lid":12,"title":"List the five steps in the site-specific hazard assessment process in the correct order","page":"p.27","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"SSHA五步骤（按顺序）","b":"<ul><li><strong>Step 1：</strong>识别今日/本班次计划的任务（tasks scheduled for today）</li><li><strong>Step 2：</strong>识别每项任务的危害（identify hazards）——使用PEME四因素</li><li><strong>Step 3：</strong>评估每个危害的风险（assess risk）——可能性×严重性</li><li><strong>Step 4：</strong>选择控制措施（select controls）——按控制层级</li><li><strong>Step 5：</strong>让所有工人签字确认（all workers sign off）</li></ul>"},{"h":"SSHA又称","b":"<p>Field Level Hazard Assessment (FLHA)。在工作开始前在现场完成。条件变化时需重新评估。</p>"}],"tip":"SSHA五步：识任务→识危害（PEME）→评风险（可能性×严重性）→选控制（控制层级）→工人签字。","gid":72},{"lid":13,"title":"Identify the four contributing factors of hazards at a work site","page":"p.27","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"PEME四因素","b":"<table><tr><th>因素</th><th>考虑问题</th></tr><tr><td><strong>People（人）</strong></td><td>培训充分吗？是否疲劳？行为动机是什么？</td></tr><tr><td><strong>Equipment（设备）</strong></td><td>适合任务吗？正确安装？按时维护？符合厂商规格？</td></tr><tr><td><strong>Materials（材料）</strong></td><td>什么材料？是否正确处置/储存/废弃？WHMIS合规？</td></tr><tr><td><strong>Environment（环境）</strong></td><td>工地位置？天气？照明？物理空间变化？</td></tr></table>"}],"tip":"「PEME」：People、Equipment、Materials、Environment。做危害识别时逐一过这四个维度，不遗漏。","gid":73},{"lid":14,"title":"Distinguish between hazards and outcomes","page":"p.30","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"核心区别","b":"<ul><li><strong>Hazard（危害）</strong>：需要被消除或控制的根本问题（根源）</li><li><strong>Outcome（结果）</strong>：如果危害未被消除或控制，可能发生的后果</li></ul>"},{"h":"例子说明","b":"<table><tr><th>任务</th><th>危害</th><th>结果（如不控制）</th></tr><tr><td>用刀开箱</td><td>锋利边缘（sharp edge）</td><td>割伤手指（cut finger）</td></tr><tr><td>梯子上粉刷高处天花</td><td>不良体位（poor body position）</td><td>背部劳损（back strain）</td></tr><tr><td>设备上喷涂保护层</td><td>烟雾暴露（exposure to fumes）</td><td>头痛（headaches）</td></tr></table>"},{"h":"为什么区分重要","b":"<p>控制<strong>危害（hazard）</strong>比只处理<strong>结果（outcome）</strong>更有效。例：用封闭刀片替代普通刀（控制危害），比佩戴防割手套（只防结果）更好。</p>"}],"tip":"Hazard=根源需消除；Outcome=可能后果。控制hazard（根源）比防范outcome（结果）更有效。考题常给场景，分辨哪个是hazard哪个是outcome。","gid":74},{"lid":15,"title":"Identify examples of controls used for each level of the hierarchy of controls","page":"p.32","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"控制层级（含LSE版具体例子）","b":"<table><tr><th>层级</th><th>类型</th><th>LSE课本例子</th></tr><tr><td>1</td><td><strong>Engineering Controls</strong>（含Substitution）</td><td>机械搬运/提升、自动化、围护/防护罩、通风（稀释）、风扇过滤器、护栏、设备改造、化学品替代、遥控</td></tr><tr><td>2</td><td><strong>Administrative Controls</strong></td><td>安全工作规范（SWP）、安全工作程序（SJP）、公司规则、培训、会议、预防性维护</td></tr><tr><td>3</td><td><strong>PPE</strong></td><td>手套、安全带、护目镜、安全帽、安全靴、呼吸器</td></tr><tr><td>组合</td><td><strong>Combination</strong></td><td>设备防护罩 + 安全工作规范 + 手套（多层控制）</td></tr></table>"},{"h":"关键原则","b":"<p>应首先选择Engineering Controls。无法消除时才依次往下。通常需要<strong>组合使用</strong>多层控制才能充分降低风险。</p>"}],"tip":"三层：Engineering（含替代）→Administrative（SWP/SJP/培训）→PPE。PPE是最后手段。实际中常组合使用。","gid":75},{"lid":16,"title":"List three components of an inspection program","page":"p.42","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"检查项目的三个组成","b":"<ul><li><strong>Inspection Policy（检查政策）</strong>：说明由谁、为什么、什么时候进行检查</li><li><strong>Inspection Procedures（检查程序）</strong>：说明检查什么、如何检查</li><li><strong>Applicable Forms（适用表格）</strong>：如何记录观察结果</li></ul>"}],"tip":"检查项目三组成：政策（谁/为何/何时）+ 程序（查什么/怎么查）+ 表格（如何记录）。","gid":76},{"lid":17,"title":"Identify three purposes of safety inspections","page":"p.42","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"检查的目的（至少记3个，课本列出更多）","b":"<ul><li>识别<strong>现有和潜在危害</strong></li><li>评估<strong>立法合规</strong>情况</li><li>评估公司<strong>H&S项目合规</strong>情况</li><li>确定危害的<strong>原因</strong>（不达标行为和状况）</li><li>监控<strong>危害控制</strong>措施（工程、行政、PPE）</li></ul>"}],"tip":"检查三目的：识别危害、评估合规（立法+公司H&S）、确定危害原因。不只是找问题，是系统性评估。","gid":77},{"lid":18,"title":"Describe the four steps in the formal inspection process","page":"p.46","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"四步正式检查流程","b":"<table><tr><th>步骤</th><th>关键行动</th></tr><tr><td><strong>Step 1 – Plan（计划）</strong></td><td>审查检查政策/程序/表格；确定检查团队；审查适用立法和行业标准；确保团队有适当培训</td></tr><tr><td><strong>Step 2 – Conduct（执行）</strong></td><td>穿戴适当PPE；详细描述每个不达标行为或状况；有条理、问问题、做笔记；拍照（如公司允许）</td></tr><tr><td><strong>Step 3 – Complete the Report（报告）</strong></td><td>记录检查内容；写SMART纠正措施；含日期/时间/区域/团队成员；包含正面观察</td></tr><tr><td><strong>Step 4 – Monitor Corrective Actions（跟进）</strong></td><td>跟踪负责人的实施进度；验证控制措施有效；确认纠正措施完成</td></tr></table>"}],"tip":"「计执报跟」四步：Plan、Conduct、Complete Report、Monitor。Report必须含SMART纠正措施+负责人+目标日期。","gid":78},{"lid":19,"title":"Identify items to look for while conducting an inspection","page":"p.47","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"检查时应关注的内容","b":"<ul><li>不达标<strong>行为（acts）</strong>：工人操作方式是否安全</li><li>不达标<strong>状况（conditions）</strong>：设备、材料、环境状况</li><li>从<strong>多个角度</strong>观察（不同视角可能发现不同问题）</li><li>考虑<strong>静态（stop position）</strong>和<strong>动态（in motion）</strong>两种设备状态</li><li>发现<strong>危险工作</strong>立即处理，不等报告</li></ul>"},{"h":"重要提示","b":"<p>记录<strong>不达标的行为</strong>，而<strong>不是工人姓名</strong>（避免指责个人，关注系统问题）。</p>"}],"tip":"检查看：不达标行为+状况，静态+动态两种设备状态。记录行为本身，不记工人姓名（关注系统，非个人）。","gid":79},{"lid":20,"title":"Identify who should be on an inspection team","page":"p.48","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"检查团队组成","b":"<p>应包含与安全团队相同的<strong>三个群体</strong>：</p><ul><li><strong>Managers（管理层）</strong></li><li><strong>Supervisors（主管）</strong></li><li><strong>Workers（工人）</strong></li></ul>"},{"h":"工人参与的价值","b":"<ul><li>对工地运营最熟悉</li><li>最直接受危害影响</li><li>这是OHS法规赋予的<strong>Right to Participate（参与权）</strong></li></ul>"},{"h":"管理层参与的价值","b":"<ul><li>显示对HSMS的承诺</li><li>有权力推动纠正措施完成</li><li>法律要求：必须审查并签署正式检查报告</li></ul>"}],"tip":"检查团队=安全团队三组：Manager+Supervisor+Worker。管理层=承诺+权力；工人=知识+参与权。两者缺一不可。","gid":80},{"lid":21,"title":"Identify the main reason why a company should investigate incidents","page":"p.58","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"主要原因：预防（Prevention）","b":"<p>调查的<strong>主要原因是预防</strong>——找出导致事故的根本原因，防止类似事件再次发生。</p>"},{"h":"其他原因","b":"<ul><li>体现企业价值观（Corporate Values）</li><li>财务考虑（降低成本）：Insurance costs vs. Uninsured costs</li><li>法律要求（OHS Act s.33/s.40要求可报告事件必须调查）</li><li>Due diligence（尽职调查记录）</li></ul>"},{"h":"险兆事件同样重要","b":"<p>险兆（near miss）和实际事故都应该调查。险兆=免费的预警，不调查就失去预防机会。</p>"}],"tip":"调查主要原因=Prevention（预防）。其他：企业价值观、财务、法律要求、due diligence。险兆也必须调查。","gid":81},{"lid":22,"title":"Describe the four steps in the Simplified Investigation Process","page":"p.62","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"SIP四步骤","b":"<table><tr><th>步骤</th><th>关键行动</th></tr><tr><td><strong>Step 1 – Secure the Scene（保护现场）</strong></td><td>评估安全性；提供急救；防止进一步伤害；保护证据；通知相关人员</td></tr><tr><td><strong>Step 2 – Collect the Evidence（收集证据）</strong></td><td>四种证据：Position（位置）、People（人员）、Parts（物证）、Paper（文件）；优先收集时效最敏感的（人员/位置）</td></tr><tr><td><strong>Step 3 – Analyze the Causes（分析原因）</strong></td><td>识别Direct Causes→Basic Causes→Root Causes；使用Loss Causation Model</td></tr><tr><td><strong>Step 4 – Write the Report（撰写报告）</strong></td><td>记录发现；制定SMART纠正措施；含负责人和完成日期</td></tr></table>"}],"tip":"SIP四步：Secure→Collect→Analyze→Write Report。Step 2四P证据：Position、People、Parts、Paper（按时效敏感度）。","gid":82},{"lid":23,"title":"Describe the three types of causes from the Loss Causation Model","page":"p.64","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"三种原因类型","b":"<table><tr><th>原因类型</th><th>层级</th><th>例子</th></tr><tr><td><strong>Direct Causes（直接原因）</strong></td><td>Worker Level（工人层面）</td><td>不安全行为（如未戴PPE、违反程序）、不安全状况（如设备缺陷、照明不足）</td></tr><tr><td><strong>Basic/Indirect Causes（基本/间接原因）</strong></td><td>Supervisor Level（主管层面）</td><td>个人因素（知识技能不足、动机不当）+ 工作/系统因素（监督不足、设备不良）</td></tr><tr><td><strong>Root Causes（根本原因）</strong></td><td>Management Level（管理层面）</td><td>未建立/维护标准（培训、检查、调查、程序等方面的管理体系缺失）</td></tr></table>"},{"h":"为什么三层都要找","b":"<p>只处理直接原因（如重新培训那个工人）无法防止再发生。必须追溯到根本原因（管理体系缺陷）才能根本解决。</p>"}],"tip":"三层原因：Direct（工人/行为/状况）→Basic（主管/个人+系统因素）→Root（管理层/体系缺失）。只修直接原因无法根本解决。","gid":83},{"lid":24,"title":"State three types of training that should be included in an effective training program","page":"p.73","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"有效培训项目的三类培训","b":"<ul><li><strong>Orientations（定向培训）</strong>：公司定向（入职）+ 现场特定定向（每次新工地）</li><li><strong>On-the-Job Training / OJT（在职培训）</strong>：Tell→Show→Do→Review四原则</li><li><strong>Ongoing Training（持续培训）</strong>：新任务、新设备、法规变化、政策变化时触发</li></ul>"},{"h":"培训政策要求","b":"<ul><li>表明公司承诺</li><li>制定培训目标</li><li>分配责任给相关方</li><li>引用适用立法</li></ul>"}],"tip":"培训三类：Orientation（定向）+ OJT（在职：Tell/Show/Do/Review）+ Ongoing（持续：变化时触发）。","gid":84},{"lid":25,"title":"List three factors to consider when determining competency","page":"p.74","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"Competent（胜任）三因素（OHS Act s.1）","b":"<ul><li><strong>Adequately qualified（充分具备资质）</strong>：证书、文凭、操作票、贸易资质</li><li><strong>Suitably trained（接受适当培训）</strong>：定向、OJT、现场特定安全培训</li><li><strong>Sufficient experience（有足够经验）</strong>：在无或最少监督下工作；通过技能评估、观察、绩效审查验证</li></ul>"},{"h":"Direct Supervision补充","b":"<p>不具备competent条件的工人，必须处于<strong>直接监督</strong>下——监督员<strong>在场且可立即联系</strong>。不是远程监督。</p>"}],"tip":"胜任三要素：资质（证书）+ 培训（OJT等）+ 经验（能独立工作）。三者同等重要，缺一不算完全胜任。","gid":85},{"lid":26,"title":"Describe the four key principles of instruction","page":"p.75","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"OJT四原则","b":"<table><tr><th>原则</th><th>内容</th></tr><tr><td><strong>Tell（讲解）</strong></td><td>解释工作及其在整体项目中的意义；审查正式HA、SJP/SWP；讲解步骤和操作顺序</td></tr><tr><td><strong>Show（示范）</strong></td><td>实际演示如何安全执行任务；让工人清楚看到每个步骤</td></tr><tr><td><strong>Do（实践）</strong></td><td>工人在<strong>监督下</strong>亲自操作；必须包含<strong>实际演示（practical demonstration）</strong></td></tr><tr><td><strong>Review（评估）</strong></td><td>评估工人是否达到能力要求；<strong>必须记录文件</strong></td></tr></table>"},{"h":"OJT的前提","b":"<ul><li>必须先识别该任务特定的危害</li><li>Review阶段的文件是due diligence的证明</li></ul>"}],"tip":"「讲示做评」：Tell、Show、Do、Review。不能跳过Show直接Do。Review必须文件化——这是due diligence记录。","gid":86},{"lid":27,"title":"Describe the advantages of each of the three types of assessments used in a training program","page":"p.77","cid":"lse","cname":"LSE","color":"#2C4A7C","sections":[{"h":"三种评估方式及优势","b":"<table><tr><th>评估类型</th><th>优势</th></tr><tr><td><strong>Written Tests（笔试）</strong></td><td>识别需要更多说明的领域；专注工人成功；提供定量反馈；可观察文件完成情况（如SSHA）</td></tr><tr><td><strong>Verbal Tests（口试）</strong></td><td>用于验证<strong>阅读或书写有困难</strong>的工人的知识（解决语言障碍）</td></tr><tr><td><strong>Formal and Informal Observations（观察）</strong></td><td>验证工人能否将知识<strong>实际应用</strong>到工作中；在真实工作环境中评估</td></tr></table>"},{"h":"关键原则","b":"<p>所有评估必须<strong>记录文件</strong>。评估员本身必须是胜任的（competent）。</p>"}],"tip":"三评估：笔试（知识+定量）、口试（语言障碍）、观察（实际应用）。三者各有场景，都要文件化。","gid":87},{"lid":1,"title":"State the main reason why companies should conduct investigations","page":"p.3","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"主要原因：预防（Prevention）","b":"<p>调查的<strong>主要原因是预防</strong>——找出造成事件的根本原因，防止类似事件再次发生。</p>"},{"h":"其他原因","b":"<ul><li><strong>Corporate Values（企业价值观）</strong>：体现公司对工人的关怀</li><li><strong>Financial（财务）</strong>：减少直接（保险）和间接成本（生产损失、法律费用）</li><li><strong>Legal（法律）</strong>：OHS Act s.33要求调查可报告事件</li><li><strong>Due diligence（尽职调查）</strong>：调查记录本身就是尽职调查的证明</li></ul>"}],"tip":"主要原因=Prevention（预防）。记住其他四个：企业价值观、财务、法律要求、due diligence证明。","gid":88},{"lid":2,"title":"State the reportable incidents outlined in Section 33 of the OHS Act","page":"p.4","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"OHS Act s.33可报告事件（Reportable Incidents）","b":"<ul><li>导致工人<strong>死亡</strong>的伤害/疾病/事件</li><li>工人<strong>入院治疗</strong>（或有理由相信会入院）</li><li>意外<strong>爆炸、火灾或洪水</strong>导致或可能导致严重伤害</li><li><strong>起重机、人字架或提升装置</strong>的倒塌或倾覆</li><li>建筑物或结构<strong>承重部件</strong>的倒塌或失效</li><li>有可能导致<strong>严重伤亡</strong>（住院或死亡）的事件且需要纠正措施</li></ul>"},{"h":"报告要求","b":"<p>必须向<strong>OHS（Alberta Director of Inspection）</strong>报告。WCB也需单独报告（72小时内）。</p>"}],"tip":"六类可报告事件：死亡、入院、爆炸火灾洪水、起重机倒塌、承重结构失效、高风险险兆。向OHS报告，WCB另报（72小时）。","gid":89},{"lid":3,"title":"State the actions employers must take if there is a reportable incident","page":"p.4","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"雇主的法定行动","b":"<ul><li><strong>立即通知</strong>OHS Director（或尽快）</li><li><strong>保护现场</strong>：不得移动、破坏或处置任何与事件相关的物品——除非为了：保护工人生命/健康、防止财产进一步损害、或OHS Director授权</li><li><strong>进行调查</strong>并提交报告</li></ul>"},{"h":"关键要点","b":"<p>「保护现场」的要求非常严格——<strong>不得移动任何物品</strong>，直到OHS官员授权。唯一例外是保护生命或财产安全。</p>"}],"tip":"发生可报告事件：立即通知OHS→保护现场（不移动证据，例外：救命/防损）→调查→提交报告。","gid":90},{"lid":4,"title":"Identify the significance of incident pyramids","page":"p.5","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"事故金字塔的意义","b":"<p>金字塔显示各类事件的比例关系：</p><ul><li>底层：大量<strong>不安全行为/状况（unsafe behaviors/conditions）</strong></li><li>往上：<strong>险兆（near misses）</strong></li><li>再上：<strong>轻伤（minor incidents）</strong></li><li>顶层：少量<strong>重大事故（major incidents）</strong></li></ul>"},{"h":"实际意义","b":"<ul><li>每1起重大事故背后有<strong>数千起险兆</strong></li><li>调查险兆 = 在底层切断金字塔 = 预防重大事故</li><li>说明为什么<strong>险兆也必须报告和调查</strong></li><li>前提：工人必须相信报告险兆<strong>不会受到追责</strong>（无惩罚文化）</li></ul>"}],"tip":"金字塔：底部险兆多→顶部重大事故少。意义：解决底部=预防顶部。建立无追责文化让工人愿意报告险兆。","gid":91},{"lid":5,"title":"State two questions that should be answered by an investigation policy and procedures","page":"p.6","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"调查政策必须回答的两个问题","b":"<ul><li><strong>What types of incidents will be investigated?（调查哪些类型的事件？）</strong>：明确公司需要调查的事件级别（仅可报告事件？所有险兆？所有急救事件？）</li><li><strong>Who is responsible for the investigation?（谁负责调查？）</strong>：明确不同级别事件由不同层级负责（工头、主管、管理层、跨部门团队）</li></ul>"},{"h":"调查政策的其他要素","b":"<ul><li>报告的格式和时间要求</li><li>调查员的培训要求</li><li>纠正措施的跟进程序</li></ul>"}],"tip":"调查政策必答两问：①哪些事件要调查？②谁负责调查？政策必须明确这两点，否则事故时无人知道该怎么做。","gid":92},{"lid":6,"title":"List the four steps of the SIP in the correct order","page":"p.7","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"SIP四步骤","b":"<ul><li><strong>Step 1 – Secure the Scene（保护现场）</strong></li><li><strong>Step 2 – Collect the Evidence（收集证据）</strong></li><li><strong>Step 3 – Analyze the Causes（分析原因）</strong></li><li><strong>Step 4 – Write the Report（撰写报告）</strong></li></ul>"},{"h":"SIP的重要性","b":"<p>SIP是系统性调查框架，确保：不跳过步骤、收集完整证据、找到真正的根本原因。</p>"}],"tip":"SIP四步顺序：Secure→Collect→Analyze→Write。必须按顺序，不能跳步。","gid":93},{"lid":7,"title":"Identify at least five actions an investigator should take once they have arrived on scene","page":"p.8","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"到达现场的行动（至少5个）","b":"<ul><li><strong>评估现场安全</strong>——先保护自己</li><li>提供或安排<strong>急救/医疗援助</strong></li><li><strong>防止进一步伤害</strong>（隔离区域）</li><li><strong>通知相关主管和管理层</strong></li><li><strong>不移动证据</strong>——拍照、素描记录现场原始状态</li><li>隔离区域，<strong>防止无关人员进入</strong></li><li>根据需要<strong>通知OHS</strong>（如属可报告事件）</li><li>识别Loss（损失）——伤亡类型</li><li>对事件进行<strong>分类（Classify）</strong></li></ul>"},{"h":"关键优先级","b":"<p>安全第一（保护自己）→急救（保护他人）→保护证据→通知相关方。</p>"}],"tip":"到达现场：①评估安全 ②急救 ③防进一步伤害 ④不移动证据 ⑤隔离区域 ⑥通知主管/OHS。安全第一，证据第二。","gid":94},{"lid":8,"title":"Describe two differences between losses and incidents","page":"p.9","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"Loss vs Incident","b":"<table><tr><th>概念</th><th>定义</th><th>例子</th></tr><tr><td><strong>Loss（损失）</strong></td><td>事故导致的<strong>非故意伤害、损坏或物质损失</strong></td><td>工人受伤、设备损坏、生产停顿</td></tr><tr><td><strong>Incident（事件）</strong></td><td>导致损失的<strong>事件本身</strong>（可能导致损失，也可能没有实际损失——险兆）</td><td>设备倒塌（导致受伤）、险兆（没有实际损失）</td></tr></table>"},{"h":"五种损失类型","b":"<ul><li><strong>People（人）</strong>：伤害或疾病</li><li><strong>Property（财产）</strong>：设备/资产损坏</li><li><strong>Process（过程）</strong>：停工/生产中断</li><li><strong>Environment（环境）</strong>：损坏或泄漏</li><li><strong>Reputation（声誉）</strong>：负面公关/业务影响</li></ul>"}],"tip":"Incident=事件本身；Loss=事件造成的后果。险兆=有Incident但没有Loss。调查的是Incident（找原因），目的是防止Loss。","gid":95},{"lid":9,"title":"Match the components of the Step 1 Secure the Scene with the Simplified Investigation Process","page":"p.9","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"Step 1 的三个子任务","b":"<ul><li><strong>Identify the Loss（识别损失）</strong>：发生了什么损失？人/财产/过程/环境/声誉？</li><li><strong>Classify the Incident（对事件分类）</strong>：事件类型是什么？（急救/医疗援助/工时损失/险兆/可报告事件）</li><li><strong>Secure the Scene（保护现场）</strong>：防止进一步伤害；不移动证据；隔离区域</li></ul>"},{"h":"事件分类类型","b":"<ul><li>First Aid（急救事件）</li><li>Medical Aid（医疗援助）</li><li>Property Damage（财产损坏）</li><li>Near Miss（险兆）</li><li>Vehicle Incident（车辆事故）</li><li>Environmental（环境）</li></ul>"}],"tip":"Step 1三子任务：识别Loss（5种）→对事件分类（6种）→保护现场（隔离/不移动）。分类决定调查级别。","gid":96},{"lid":10,"title":"List the four types of evidence from most time-sensitive to least time-sensitive","page":"p.10","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"四种证据类型（按时效敏感度）","b":"<table><tr><th>顺序</th><th>类型</th><th>原因</th></tr><tr><td>1（最敏感）</td><td><strong>People Evidence（人员证据）</strong></td><td>目击者记忆迅速淡化；受伤者可能无法作证；感情因素影响陈述</td></tr><tr><td>2</td><td><strong>Position Evidence（位置证据）</strong></td><td>人员和设备的位置可能被移动（清理现场、继续施工）</td></tr><tr><td>3</td><td><strong>Parts/Physical Evidence（物证）</strong></td><td>损坏的设备、材料、工具等相对稳定</td></tr><tr><td>4（最不敏感）</td><td><strong>Paper/Documentation Evidence（文件证据）</strong></td><td>记录、日志、培训记录相对稳定，不会随时间改变</td></tr></table>"}],"tip":"四P证据时效：People（最快变化）→Position→Parts→Paper（最稳定）。到场先访谈目击者，后找文件。","gid":97},{"lid":11,"title":"Identify examples of each type of evidence","page":"p.10","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"四类证据的具体例子","b":"<table><tr><th>类型</th><th>例子</th></tr><tr><td><strong>People（人员）</strong></td><td>目击者陈述、受伤工人陈述、主管陈述、专家意见</td></tr><tr><td><strong>Position（位置）</strong></td><td>人员站位、设备位置、物料位置（用照片/素描记录）</td></tr><tr><td><strong>Parts/Physical（物证）</strong></td><td>损坏的工具/设备、安全装置状态、PPE状态、化学品容器</td></tr><tr><td><strong>Paper/Documentation（文件）</strong></td><td>检查记录、维护记录、培训记录、工作许可证、SSHA、日志</td></tr></table>"}],"tip":"人员=陈述；位置=照片/素描；物证=损坏设备/PPE；文件=记录/日志/培训。每类证据互相印证最可靠。","gid":98},{"lid":12,"title":"State at least five initial questions that an investigator needs to answer","page":"p.11","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"调查员必须回答的初始问题（至少记5个）","b":"<ul><li><strong>What happened?（发生了什么？）</strong>——描述事件经过</li><li><strong>When did it happen?（什么时候发生的？）</strong>——精确时间</li><li><strong>Where did it happen?（在哪里发生的？）</strong>——精确地点</li><li><strong>Who was involved?（谁涉及其中？）</strong>——工人、主管、其他人</li><li><strong>What were they doing?（他们在做什么？）</strong>——任务描述</li><li><strong>What went wrong?（哪里出了问题？）</strong>——识别偏差</li><li><strong>What should have happened?（应该发生什么？）</strong>——正常程序</li></ul>"}],"tip":"调查五W：What（发生了什么）、When（何时）、Where（何地）、Who（谁）、What doing（在做什么）。再加：哪里出错、应该怎样。","gid":99},{"lid":13,"title":"State at least five best practices for conducting interviews","page":"p.11","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"访谈最佳实践（至少5个）","b":"<ul><li><strong>尽快进行</strong>——趁记忆新鲜（时效证据）</li><li><strong>单独访谈</strong>每位证人——防止相互影响</li><li>在<strong>私密、舒适</strong>的地方进行</li><li>使用<strong>开放式问题</strong>——让证人用自己的话描述（「发生了什么？」而非「你是不是这样做的？」）</li><li><strong>记录笔记</strong>或录音（经同意）</li><li>让证人<strong>审阅并签字</strong>确认陈述</li><li>保持<strong>中立、不评判</strong>的态度——这是事实收集，不是追责</li></ul>"}],"tip":"访谈五要：尽快+单独+私密+开放式问题+记录。目的是收集事实，不是追究责任。让证人签字确认陈述。","gid":100},{"lid":14,"title":"Identify different types of incident causes","page":"p.16","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"三种原因类型（Loss Causation Model）","b":"<table><tr><th>类型</th><th>层级</th><th>特征</th></tr><tr><td><strong>Direct Causes（直接原因）</strong></td><td>Worker Level</td><td>不安全行为（Substandard Practice）或不安全状况（Substandard Condition）</td></tr><tr><td><strong>Basic/Indirect Causes（基本原因）</strong></td><td>Supervisor Level</td><td>个人因素（知识/技能/动机）或工作/系统因素（监督不足/设备不良）</td></tr><tr><td><strong>Root Causes（根本原因）</strong></td><td>Management Level</td><td>未建立/维护管理标准（培训、检查、程序等方面的系统性缺失）</td></tr></table>"},{"h":"为什么找全三层","b":"<p>直接原因容易看到（行为/状况），但只修复直接原因无法防止再发生。必须追溯到根本原因（管理系统缺陷）。</p>"}],"tip":"三层因果：Direct（工人行为/状况）→Basic（主管/个人+系统）→Root（管理层/系统缺失）。调查三层都要找到才算完整。","gid":101},{"lid":15,"title":"Match the components of the Step 3 Analyze the Causes with the Simplified Investigation Process","page":"p.17","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"Step 3的分析框架","b":"<ul><li>从已收集证据出发，识别<strong>Direct Causes（直接原因）</strong>：这次事故中的不安全行为和不安全状况是什么？</li><li>问「为什么？」找<strong>Basic Causes（基本原因）</strong>：为什么会出现这些直接原因？（工人缺乏培训？设备维护不足？）</li><li>再问「为什么？」找<strong>Root Causes（根本原因）</strong>：为什么基本原因没有被预防到？（管理层未建立足够的培训体系？）</li></ul>"},{"h":"「五个为什么」技术","b":"<p>不断追问「为什么」，通常经过5次就能到达根本原因。</p>"}],"tip":"Step 3用「五个为什么」：Direct（能看到）→Basic（问为什么）→Root（再问为什么）。追问到管理体系层面。","gid":102},{"lid":16,"title":"Identify the recommended sections of an investigation report","page":"p.21","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"调查报告的建议结构","b":"<ul><li><strong>Incident Description（事件描述）</strong>：时间、地点、涉及人员、经过</li><li><strong>Incident Classification（事件分类）</strong>：事件类型和损失类型</li><li><strong>Evidence Collected（收集的证据）</strong>：四类证据的汇总</li><li><strong>Causes（原因）</strong>：Direct、Basic和Root Causes</li><li><strong>Corrective Actions（纠正措施）</strong>：SMART格式，含负责人和完成日期</li><li><strong>Signatures（签名）</strong>：调查员、主管、管理层</li></ul>"}],"tip":"报告六部分：事件描述→分类→证据→三层原因→SMART纠正措施→签名。缺任何一项都不完整。","gid":103},{"lid":17,"title":"Identify the proper way to write corrective actions (SMART)","page":"p.21","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"SMART纠正措施","b":"<table><tr><th>字母</th><th>含义</th><th>关键说明</th></tr><tr><td><strong>S</strong></td><td>Specific（具体）</td><td>明确说明要做什么，不留歧义</td></tr><tr><td><strong>M</strong></td><td>Measurable（可衡量）</td><td>能清楚知道何时完成、由谁完成</td></tr><tr><td><strong>A</strong></td><td>Achievable（可实现）</td><td>在合理时间内可完成</td></tr><tr><td><strong>R</strong></td><td>Relevant（相关）</td><td>直接针对调查识别的原因</td></tr><tr><td><strong>T</strong></td><td>Time-bound（有时限）</td><td>有具体、现实的完成截止日期</td></tr></table>"},{"h":"典型反例","b":"<p>「需要时增加人手」→不Specific（增加多少？）、不Measurable（怎么知道完成了？）、不Time-bound（什么时候？）→不是SMART纠正措施。</p>"}],"tip":"SMART五字：具体/可量/可实现/相关/有时限。反例：「需要时增加人手」→S/M/T都不满足。","gid":104},{"lid":18,"title":"State when a company investigation is over","page":"p.21","cid":"wib","cname":"WIB","color":"#5C2D00","sections":[{"h":"调查结束的条件","b":"<p>调查在以下两个条件都满足后才算结束：</p><ul><li>调查报告已<strong>提交给管理层并获批准</strong></li><li>所有纠正措施已<strong>实施并验证有效</strong></li></ul>"},{"h":"为什么纠正措施实施是必要条件","b":"<p>调查的目的是预防——如果只写了报告但没有落实纠正措施，调查等于没做。管理层批准确保问责制，实施验证确保有效性。</p>"}],"tip":"调查结束=报告获管理层批准 + 纠正措施已实施验证。两者缺一，调查未完成。","gid":105},{"lid":1,"title":"Describe what Certifying Partner Instruments have in common","page":"p.9","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"Certifying Partner Instruments共同点","b":"<ul><li>都评估公司的<strong>HSMS（健康安全管理系统）</strong></li><li>都基于<strong>Alberta省PIR项目</strong>的要求</li><li>都评估相同的<strong>10个核心要素</strong>（管理承诺、危害评估、培训等）</li><li>都使用<strong>文件审查、访谈和观察</strong>三种验证技术</li><li>分数都使用<strong>标准化计算方法</strong>（百分比制）</li></ul>"},{"h":"不同认证项目","b":"<ul><li><strong>COR（Certificate of Recognition）</strong>：适用于中大型公司</li><li><strong>SECOR（Small Employer Certificate of Recognition）</strong>：适用于小型公司（10名或以下员工）</li></ul>"}],"tip":"各CP工具共同：评估HSMS的10个要素，用D-I-O三技术，标准化百分比评分。COR(中大型)vs SECOR(≤10人)。","gid":106},{"lid":2,"title":"Describe the COR audit cycle","page":"p.10","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"三年周期","b":"<table><tr><th>年份</th><th>审计类型</th><th>要求</th></tr><tr><td>第1年</td><td><strong>Certification Audit（认证审计）</strong></td><td>由ACSA认证的外部审计员进行；需达到≥80%总分且每要素≥50%</td></tr><tr><td>第2年</td><td><strong>Maintenance Audit（维护审计）</strong></td><td>可由内部或外部审计员进行；需达到≥60%</td></tr><tr><td>第3年</td><td><strong>Maintenance Audit（维护审计）</strong></td><td>同第2年要求</td></tr></table>"},{"h":"关键规则","b":"<ul><li>每个三年周期必须以新的<strong>外部认证审计</strong>重新开始</li><li>首次申请COR需要至少<strong>1年的运营数据</strong></li></ul>"}],"tip":"三年循环：Y1外部认证（≥80%/≥50%各要素）→Y2维护（≥60%）→Y3维护（≥60%）。每轮重新开始。","gid":107},{"lid":3,"title":"Define the eligibility criteria for COR","page":"p.11","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"COR资格要求","b":"<ul><li>公司必须在<strong>WCB Alberta注册</strong></li><li>公司必须有至少<strong>1年的运营数据</strong>（才能进行首次认证审计）</li><li>公司的HSMS必须涵盖其在Alberta的<strong>所有工地和运营</strong></li><li>审计必须由<strong>ACSA认证的审计员</strong>进行（外部认证审计）</li></ul>"},{"h":"WCB好处","b":"<p>持有COR的公司可获得WCB保费<strong>最高20%的返利（rebate）</strong>，这是参与PIR项目的主要经济激励。</p>"}],"tip":"COR资格：WCB Alberta注册 + 1年数据 + 全运营HSMS + ACSA认证审计员。好处：WCB保费最高20%返利。","gid":108},{"lid":4,"title":"Define the term audit","page":"p.12","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"审计的定义","b":"<p>审计是对<strong>HSMS或其组成要素的系统性、客观性检查</strong>，以确定系统是否按照预定安排运作并达到预期目标。</p>"},{"h":"审计 vs 检查","b":"<table><tr><th>对比</th><th>审计（Audit）</th><th>检查（Inspection）</th></tr><tr><td>范围</td><td>整个HSMS或其要素</td><td>特定工地/区域/设备</td></tr><tr><td>目的</td><td>评估HSMS的系统性有效性</td><td>识别具体危害和不达标情况</td></tr><tr><td>结果</td><td>审计报告 + 行动计划</td><td>检查报告 + 纠正措施</td></tr></table>"}],"tip":"审计=系统性客观检查HSMS整体有效性。区别于检查（检查是找具体危害）。审计看系统，检查看现场。","gid":109},{"lid":5,"title":"State the purpose of auditing","page":"p.13","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"审计的目的","b":"<ul><li>识别HSMS的<strong>优势和不足</strong></li><li>提供<strong>持续改进</strong>的基础</li><li>证明<strong>尽职调查（due diligence）</strong></li><li>满足<strong>PIR/COR认证</strong>要求</li><li>减少<strong>伤害风险</strong>，降低成本</li><li>创建系统评估的<strong>客观记录</strong></li></ul>"}],"tip":"审计目的六点：找优势+不足、持续改进基础、due diligence证明、满足COR要求、减少伤害、客观记录。","gid":110},{"lid":6,"title":"Identify four common types of COR audits","page":"p.14","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"四种审计类型","b":"<table><tr><th>类型</th><th>说明</th><th>触发条件</th></tr><tr><td><strong>Certification（认证）</strong></td><td>首次或每三年的外部审计</td><td>申请或续期COR</td></tr><tr><td><strong>Maintenance（维护）</strong></td><td>三年周期中的第2、3年审计</td><td>维持COR资质</td></tr><tr><td><strong>Post-event（事后）</strong></td><td>重大损失事故后</td><td>重大事故发生后</td></tr><tr><td><strong>Qualification（资质）</strong></td><td>审计员认证培训中使用</td><td>审计员培训项目</td></tr></table>"}],"tip":"四种审计：Certification（认证/首次）、Maintenance（维护/年度）、Post-event（重大事故后）、Qualification（审计员培训）。","gid":111},{"lid":7,"title":"List audit methods","page":"p.15","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"三种验证技术（D-I-O）","b":"<table><tr><th>技术</th><th>说明</th><th>用途</th></tr><tr><td><strong>D – Documentation（文件审查）</strong></td><td>审查政策、程序、记录、表格</td><td>验证HSMS文件系统是否完整</td></tr><tr><td><strong>I – Interviews（访谈）</strong></td><td>与工人、主管、管理层交谈</td><td>验证知识和程序执行情况</td></tr><tr><td><strong>O – Observations（观察）</strong></td><td>现场观察实际工作条件和行为</td><td>验证实际做法是否与文件一致</td></tr></table>"},{"h":"关键原则","b":"<p>审计员必须<strong>综合使用三种技术</strong>——单独依赖任何一种都不够。文件齐全不代表实际执行，观察到的情况需要文件印证。</p>"}],"tip":"「DIO」三技术：Documentation文件、Interview访谈、Observation观察。三种必须综合使用，不能只用一种。","gid":112},{"lid":8,"title":"Define the term auditor","page":"p.17","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"审计员的定义","b":"<p>审计员是<strong>经ACSA认证</strong>的、有能力进行COR审计的人。必须是<strong>客观、独立</strong>的第三方（对被审计公司没有利益关系）。</p>"},{"h":"审计员资格要求","b":"<ul><li>完成ACSA ATP（Auditor Training Program）培训</li><li>通过NCSO或NHSA考试</li><li>满足ACSA审计员认证要求</li><li>遵守ACSA审计员道德准则</li></ul>"}],"tip":"Auditor=经ACSA认证的独立第三方。关键：独立性（无利益冲突）+ 客观性（按标准评分）。","gid":113},{"lid":9,"title":"Match auditors and employers (auditees) with their roles and responsibilities","page":"p.17","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"审计员vs被审计方职责","b":"<table><tr><th>角色</th><th>主要职责</th></tr><tr><td><strong>Auditor（审计员）</strong></td><td>客观评估HSMS；收集充分证据；按标准评分；写准确的验证说明；保持独立性</td></tr><tr><td><strong>Auditee（被审计方）</strong></td><td>提供准确完整的文件；安排访谈对象；确保现场访问；配合审计过程；制定行动计划</td></tr></table>"}],"tip":"审计员=客观+独立+标准评分；被审计方=提供文件+配
