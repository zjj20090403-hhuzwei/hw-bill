合访谈+配合现场访问+制定行动计划。","gid":114},{"lid":10,"title":"Describe the impact of failing to follow through on auditor accountabilities","page":"p.18","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"未能履行审计员职责的后果","b":"<ul><li>审计结果不准确，<strong>HSMS弱点未被识别</strong></li><li>公司基于不准确评估<strong>错误决策</strong></li><li>损害ACSA和COR项目的<strong>信誉和完整性</strong></li><li>审计员可能面临<strong>认证撤销</strong></li><li>可能导致工人<strong>安全风险增加</strong></li></ul>"},{"h":"道德准则","b":"<p>ACSA有明确的审计员道德准则：禁止利益冲突、禁止泄露机密信息、必须如实报告发现。违反可导致认证撤销。</p>"}],"tip":"审计员未尽责后果：HSMS弱点未发现→工人安全风险增加；ACSA信誉受损；审计员认证被撤销。","gid":115},{"lid":11,"title":"Identify the elements of the ACSA Audit Instrument","page":"p.24","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"10个审计要素","b":"<table><tr><th>#</th><th>要素</th></tr><tr><td>1</td><td>Management Commitment（管理承诺）</td></tr><tr><td>2</td><td>Hazard Assessment（危害评估）</td></tr><tr><td>3</td><td>Hazard Control（危害控制）</td></tr><tr><td>4</td><td>Ongoing Inspections（持续检查）</td></tr><tr><td>5</td><td>Qualifications and Training（资质与培训）</td></tr><tr><td>6</td><td>Emergency Preparedness（应急准备）</td></tr><tr><td>7</td><td>Incident Investigation（事故调查）</td></tr><tr><td>8</td><td>Program Administration（项目管理）</td></tr><tr><td>9</td><td>Contracted Employer Management（承包雇主管理）</td></tr><tr><td>10</td><td>Health and Safety Committees/Representatives（HSC/HSR）</td></tr></table>"}],"tip":"10个要素：1管理承诺、2危害评估、3危害控制、4检查、5培训、6应急、7调查、8项目管理、9承包管理、10 HSC/HSR。","gid":116},{"lid":12,"title":"List the three (3) validation techniques","page":"p.29","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"三种验证技术","b":"<ul><li><strong>Documentation（文件）</strong>：审查政策/程序/记录，验证HSMS文件体系</li><li><strong>Interviews（访谈）</strong>：与四级员工交谈，验证知识和执行</li><li><strong>Observations（观察）</strong>：现场观察，验证实际做法</li></ul>"},{"h":"如何组合使用","b":"<p>三种技术相互印证：文件显示「应该怎样」，访谈显示「工人是否知道」，观察显示「实际上怎样」。三角印证才能得出准确评分。</p>"}],"tip":"「DIO」三技术互相印证：文件=应该怎样；访谈=工人是否知道；观察=实际怎样。三角印证=准确评分。","gid":117},{"lid":13,"title":"List the four (4) levels of employees that the auditor must interview for an audit","page":"p.31","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"必须访谈的四级员工","b":"<ul><li><strong>Senior Management（高层管理）</strong>：CEO、总裁、VP级别——验证管理承诺</li><li><strong>Middle Management（中层管理）</strong>：项目经理、部门经理——验证系统执行</li><li><strong>Supervisors（主管）</strong>：现场主管、领班——验证日常实施</li><li><strong>Workers（工人）</strong>：前线工人——验证实际知识和做法</li></ul>"},{"h":"为什么四级都要访谈","b":"<p>不同级别对HSMS的认知和执行可能差异很大。只访谈管理层可能看到的是「纸面HSMS」，只访谈工人可能不了解系统设计。四级提供完整图景。</p>"}],"tip":"四级访谈：Senior Mgmt（承诺）→Middle Mgmt（执行）→Supervisors（日常）→Workers（实际知识）。四级缺一则图景不完整。","gid":118},{"lid":14,"title":"Identify sampling techniques for each validation technique","page":"p.34–42","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"文件采样","b":"<ul><li>采样量取决于<strong>文件数量</strong>和时间范围</li><li>通常采样<strong>25–50%</strong>的文件（视数量和风险而定）</li><li>选择<strong>随机样本</strong>，避免只看最好的文件</li><li>必须覆盖<strong>审计期内不同时间段</strong></li></ul>"},{"h":"访谈采样","b":"<ul><li>每级员工至少访谈<strong>2人</strong>（如该级别只有1人则访谈1人）</li><li>选择<strong>随机/代表性</strong>的受访者</li><li>访谈时间：工人15分钟，主管20分钟，管理层30分钟（参考）</li></ul>"},{"h":"观察采样","b":"<ul><li>观察<strong>代表性工地</strong>——不只看最好的工地</li><li>如有多个工地，必须访问<strong>足够数量</strong>的工地</li><li>观察的时机应包括<strong>常规工作条件</strong></li></ul>"}],"tip":"采样三类：文件（25-50%随机）、访谈（每级至少2人随机）、工地观察（代表性工地）。随机性确保公正性。","gid":119},{"lid":15,"title":"Differentiate between all or nothing (A/N) and range scoring","page":"p.43","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"两种评分方式","b":"<table><tr><th>方式</th><th>定义</th><th>何时使用</th></tr><tr><td><strong>All or Nothing (A/N)</strong></td><td>只有全分或零分，没有部分分数。正指标达到指定百分比得全分，否则零分</td><td>政策存在/不存在类问题（要么有要么没有）</td></tr><tr><td><strong>Range Scoring</strong></td><td>根据正指标的百分比<strong>按比例</strong>得分，有部分分数</td><td>执行程度问题（有多少比例做到了）</td></tr></table>"},{"h":"Cascade Scoring（级联评分）","b":"<p>一个问题的得分<strong>取决于另一个问题</strong>的得分。例：如果政策不存在（Q1=0分），则依赖该政策的执行问题（Q2）也自动得0分。</p>"}],"tip":"A/N=全有全无（有=满分/无=0）；Range=按比例得分；Cascade=一题影响另一题（政策不存在→执行也0分）。","gid":120},{"lid":16,"title":"State the scoring requirements for audit certification and maintenance","page":"p.49","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"认证与维护审计的分数要求","b":"<table><tr><th>审计类型</th><th>要求</th></tr><tr><td><strong>Certification Audit（认证审计）</strong></td><td>总体得分<strong>≥80%</strong> 且 每个要素得分<strong>≥50%</strong>（两个条件都必须满足）</td></tr><tr><td><strong>Maintenance Audit（维护审计）</strong></td><td>总体得分<strong>≥60%</strong></td></tr></table>"},{"h":"关键注意","b":"<p>认证审计的双重标准：即使总分达到80%，但若某一要素低于50%，仍然<strong>不能获得COR</strong>。每个要素都必须至少达到50%。</p>"}],"tip":"认证=≥80%总分 且 每要素≥50%（双重标准！）；维护=≥60%总分。认证的双重标准是高频考点。","gid":121},{"lid":17,"title":"Differentiate between field and validation notes","page":"p.50","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"两种笔记的区别","b":"<table><tr><th>类型</th><th>说明</th><th>用途</th></tr><tr><td><strong>Field Notes（现场笔记）</strong></td><td>审计过程中的<strong>原始记录</strong>——随机记录的观察、访谈摘录、文件细节</td><td>支持审计评分的原始证据记录</td></tr><tr><td><strong>Validation Notes（验证说明）</strong></td><td>写入最终报告的<strong>正式验证陈述</strong>——解释为什么给出特定分数</td><td>向公司和ACSA解释评分依据</td></tr></table>"},{"h":"关键区别","b":"<p>Field notes = 「我看到了什么」（原始数据）；Validation notes = 「基于证据，我给这个分数的理由」（分析结论）。</p>"}],"tip":"Field notes=现场原始记录（看到什么）；Validation notes=正式验证说明（为何给此分数）。报告里只有Validation notes。","gid":122},{"lid":18,"title":"Identify validation note criteria","page":"p.51","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"验证说明必须满足的标准","b":"<ul><li>基于<strong>客观证据</strong>（文件、访谈、观察）</li><li>引用<strong>具体的正指标或负指标</strong>（不是笼统描述）</li><li>清楚解释<strong>为什么给出该分数</strong></li><li>使用<strong>中性、专业的语言</strong>（不评判个人）</li><li>覆盖<strong>所有使用的验证技术</strong>（DIO各方面证据）</li></ul>"}],"tip":"验证说明5要：客观证据+具体指标+解释分数理由+中性语言+覆盖DIO三技术。必须经得起ACSA的质量审查。","gid":123},{"lid":19,"title":"Describe why boilerplating and templating are unacceptable practices","page":"p.51","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"两种不可接受的做法","b":"<table><tr><th>做法</th><th>定义</th><th>为什么不可接受</th></tr><tr><td><strong>Boilerplating（套话）</strong></td><td>对不同公司使用完全相同的验证说明文字</td><td>未能反映该公司的实际情况；无法支持具体分数</td></tr><tr><td><strong>Templating（模板化）</strong></td><td>从以前的审计复制粘贴验证说明</td><td>可能不准确（情况可能变化）；不是基于当前审计证据</td></tr></table>"},{"h":"关键原则","b":"<p>每份验证说明必须是<strong>基于当前审计收集的具体证据</strong>的原创写作。套话和模板化违反审计完整性。</p>"}],"tip":"Boilerplating（不同公司用同一说明）和Templating（复制旧报告）都不可接受。每次审计的验证说明必须基于当前具体证据原创。","gid":124},{"lid":20,"title":"Describe what the pre-audit meeting agenda should include","page":"p.58","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"审计前会议议程内容","b":"<ul><li>介绍<strong>审计目的和范围</strong></li><li>确认<strong>审计时间表</strong>（文件审查、访谈、观察的安排）</li><li>说明<strong>需要的文件清单</strong></li><li>介绍<strong>评分方法</strong>（DIO三技术、A/N vs Range）</li><li>确认<strong>访谈对象</strong>（四级员工）</li><li>说明<strong>报告格式和时间</strong></li><li>解答公司的<strong>疑问</strong></li></ul>"}],"tip":"审计前会议：目的+范围、时间表、文件清单、评分方法、访谈对象、报告格式、答疑。建立共同期望，减少摩擦。","gid":125},{"lid":21,"title":"Differentiate between Site Familiarization and Observation tours","page":"p.61","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"两种工地访问的区别","b":"<table><tr><th>类型</th><th>目的</th><th>时机</th></tr><tr><td><strong>Site Familiarization Tour（工地熟悉巡视）</strong></td><td>了解工地布局、运营类型、工作条件；不收集审计数据</td><td>审计开始时；在正式观察之前</td></tr><tr><td><strong>Observation Tour（观察巡视）</strong></td><td>收集正式审计数据；观察实际工作行为和条件；为评分提供证据</td><td>审计数据收集阶段</td></tr></table>"}],"tip":"Site Familiarization=熟悉工地（不收数据）；Observation Tour=正式收集审计证据（用于评分）。顺序：先熟悉，再观察。","gid":126},{"lid":22,"title":"Identify the benefit of following a documentation trail","page":"p.64","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"文件追踪的好处","b":"<ul><li>揭示文件系统之间的<strong>连接和一致性</strong>——政策→程序→记录是否相互印证</li><li>识别<strong>文件链条中的断裂</strong>（如有培训政策但没有培训记录）</li><li>验证HSMS是否<strong>真正运作</strong>（不只是纸面上存在）</li><li>提供更充分的<strong>评分证据</strong></li></ul>"},{"h":"文件追踪示例","b":"<p>危害评估政策→危害评估程序→已完成的危害评估记录→工人签字→培训记录。追踪这条链路，验证整个系统是否运行。</p>"}],"tip":"文件追踪=验证政策→程序→记录的完整链条。断链（有政策无记录）=HSMS只存在纸面。追踪揭示系统真实运作状态。","gid":127},{"lid":23,"title":"Identify listening skills","page":"p.71","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"有效倾听技巧（访谈时）","b":"<ul><li><strong>主动倾听（Active Listening）</strong>：专注于说话者，给予反馈（点头、眼神接触）</li><li><strong>不打断</strong>：让受访者完整表达</li><li><strong>开放式问题</strong>：「能描述一下…吗？」而非是/否问题</li><li><strong>追问（Probing）</strong>：「您能详细说明吗？」</li><li><strong>澄清（Clarifying）</strong>：「我理解您的意思是…，对吗？」</li><li><strong>记录</strong>：做笔记但不让记笔记分散注意力</li></ul>"}],"tip":"访谈倾听：主动+不打断+开放式问题+追问+澄清+记录。访谈质量决定Interview证据质量。","gid":128},{"lid":24,"title":"Describe how observations verify documentation and interview results","page":"p.73","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"观察如何验证其他两种技术","b":"<ul><li>文件显示「<strong>应该</strong>怎样」（政策/程序）</li><li>访谈显示「<strong>工人认为</strong>怎样」（知识/认知）</li><li>观察显示「<strong>实际上</strong>怎样」（真实做法）</li></ul><p>三者一致=强有力的正指标；三者不一致（特别是文件/访谈好但观察差）=HSMS执行存在问题。</p>"},{"h":"观察的关键价值","b":"<p>观察能发现文件和访谈无法揭示的<strong>「执行差距（implementation gap）」</strong>——公司在纸面上有完美的HSMS，但实际工地上工人不知道或不遵守。</p>"}],"tip":"DIO三角印证：文件=应该；访谈=认为；观察=实际。三者一致=好；文件/访谈好但观察差=执行差距（最重要的发现）。","gid":129},{"lid":25,"title":"Describe the key points for discussion at the post-audit meeting","page":"p.76","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"审计后会议关键议题","b":"<ul><li>审计的<strong>整体发现</strong>（优势和不足）</li><li><strong>初步分数</strong>（非最终分数，待ACSA审查）</li><li>主要的<strong>不符合项（Non-conformances）</strong>和改进机会</li><li>讨论<strong>行动计划（Action Plan）</strong>的要求和时间表</li><li>说明<strong>下一步流程</strong>（报告提交、ACSA审查、行动计划提交）</li></ul>"},{"h":"重要提醒","b":"<p>后会议给出的是<strong>初步分数</strong>，不是最终分数——需要ACSA质量审查后才能确定。</p>"}],"tip":"审计后会议：整体发现、初步分数（非最终）、主要不符合项、行动计划要求、下一步流程。初步≠最终。","gid":130},{"lid":26,"title":"List the three (3) criteria for a suggestion for improvement (SFI)","page":"p.79","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"改进建议（SFI）的三个标准","b":"<ul><li>必须<strong>具体（specific）</strong>——指出具体可以改进什么</li><li>必须<strong>可实现（achievable）</strong>——在公司实际条件下可以做到</li><li>必须<strong>相关（relevant）</strong>——与HSMS的改进有直接关联</li></ul>"},{"h":"SFI vs Non-conformance","b":"<p>SFI是针对<strong>尚未达到最佳实践</strong>的建议性改进；Non-conformance是<strong>明确违反标准</strong>的不符合项，必须纠正。</p>"}],"tip":"SFI三标准：具体+可实现+相关。SFI=建议性改进（超出最低要求）；Non-conformance=违规必须纠正。","gid":131},{"lid":27,"title":"List the steps in the ACSA quality assurance process","page":"p.82","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"ACSA质量保证流程步骤","b":"<ul><li><strong>Step 1：</strong>审计员完成审计并提交草稿报告给ACSA</li><li><strong>Step 2：</strong>ACSA质量审查员审查报告（验证说明质量、评分准确性）</li><li><strong>Step 3：</strong>如有问题，反馈给审计员修改</li><li><strong>Step 4：</strong>ACSA批准最终报告</li><li><strong>Step 5：</strong>公司收到最终报告</li><li><strong>Step 6：</strong>公司制定并提交行动计划</li></ul>"}],"tip":"QA流程：审计员提交草稿→ACSA审查→有问题则修改→ACSA批准→公司收报告→公司制定行动计划。","gid":132},{"lid":28,"title":"List the training requirements for auditor certification","page":"p.94","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"审计员认证培训要求","b":"<ul><li>完成<strong>ATP（Auditor Training Program）</strong>课程</li><li>通过<strong>NCSO或NHSA考试</strong></li><li>满足<strong>ACSA审计员注册要求</strong></li><li>完成<strong>规定的实践审计小时数</strong></li></ul>"}],"tip":"审计员认证：完成ATP + 通过NCSO/NHSA考试 + 满足ACSA注册要求 + 实践小时数。","gid":133},{"lid":29,"title":"List the training requirements for COR certification","page":"p.94","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"COR认证培训要求（公司方面）","b":"<ul><li>公司的<strong>内部审计员</strong>（用于维护审计）：需完成ATP</li><li>公司<strong>员工和管理层</strong>：需完成相关ACSA课程（PHSM、LSE等）</li><li>公司必须有足够的<strong>培训记录</strong>作为HSMS运作证明</li></ul>"}],"tip":"COR公司要求：内部审计员完成ATP；员工完成相关ACSA课程；保持完整培训记录。","gid":134},{"lid":30,"title":"Identify the requirements for auditor certification and maintenance","page":"p.95","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"认证要求","b":"<ul><li>完成ATP培训</li><li>通过NCSO/NHSA考试</li><li>满足ACSA注册标准</li></ul>"},{"h":"维持认证要求","b":"<ul><li>每年完成规定的<strong>继续教育学时</strong></li><li>完成规定数量的<strong>审计</strong></li><li>遵守ACSA<strong>道德准则</strong></li></ul>"}],"tip":"获得认证：ATP+考试+注册。维持认证：继续教育+规定审计数量+遵守道德准则。","gid":135},{"lid":31,"title":"State what auditors must do if their certification lapses","page":"p.96","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"认证失效后的行动","b":"<ul><li>必须<strong>停止进行COR审计</strong></li><li>联系ACSA了解<strong>重新认证要求</strong></li><li>可能需要重新完成部分或全部<strong>培训和考试要求</strong></li></ul>"},{"h":"为什么认证可能失效","b":"<p>未完成年度继续教育要求；未进行规定数量的审计；违反道德准则。</p>"}],"tip":"认证失效=立即停止审计+联系ACSA+可能需重新培训/考试。不能在认证失效后继续进行COR审计。","gid":136},{"lid":32,"title":"Describe limited scope audits (LSAs)","page":"p.97","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"有限范围审计（LSA）","b":"<ul><li>只审查HSMS的<strong>特定要素</strong>，不是整个系统</li><li>常见于公司的<strong>内部审计</strong>，用于识别特定领域的改进机会</li><li>不能用于<strong>COR认证</strong>（COR要求全面审计）</li><li>适合在两次正式审计之间进行的<strong>中期评估</strong></li></ul>"}],"tip":"LSA=只审特定要素（非全面）。用途：内部中期评估/针对性改进。不能替代COR认证审计。","gid":137},{"lid":33,"title":"Describe action plans","page":"p.97","cid":"atp","cname":"ATP","color":"#1A3A1A","sections":[{"h":"行动计划的定义和目的","b":"<p>行动计划是针对审计发现的不足，制定的<strong>HSMS改进路线图</strong>，推动持续改进。</p>"},{"h":"行动计划的结构要求","b":"<ul><li>每项措施针对审计发现的<strong>具体不符合项</strong></li><li>每项措施必须是<strong>SMART格式</strong></li><li>每项措施必须有<strong>指定负责人</strong></li><li>每项措施必须有<strong>目标完成日期</strong></li></ul>"},{"h":"循环关系","b":"<p>审计→发现不足→行动计划→改进HSMS→下次审计验证改进→持续改进循环。</p>"}],"tip":"行动计划=审计后的改进路线图。每条措施：SMART格式+负责人+目标日期。行动计划是持续改进循环的关键环节。","gid":138},{"lid":1,"title":"State which legislation focuses on worker and employer responsibilities related to WHMIS","page":"p.7","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"两个立法框架","b":"<table><tr><th>立法</th><th>管辖</th></tr><tr><td><strong>Hazardous Products Act（联邦）</strong></td><td>生产和进口危险产品的供应商责任——标签和SDS要求</td></tr><tr><td><strong>Alberta OHS Code Part 29（省级）</strong></td><td>工作场所中的雇主和工人责任——培训、SDS获取、标签维护</td></tr></table>"},{"h":"重要区分","b":"<p><strong>供应商</strong>在联邦法律下负责产品标签和SDS的准确性；<strong>雇主</strong>在省级法律下负责工人培训和工作场所标签维护。</p>"}],"tip":"双轨立法：联邦Hazardous Products Act（供应商/生产）+ 省级OHS Code Part 29（雇主/工人）。供应商负责产品标签，雇主负责培训和工作场所使用。","gid":139},{"lid":2,"title":"Identify at least three types of products not covered by WHMIS","page":"p.7","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"WHMIS不涵盖的产品类型（至少记3个）","b":"<ul><li><strong>Explosives（爆炸物）</strong>——受《爆炸物法》管辖</li><li><strong>Cosmetics（化妆品）</strong>——受《食品药品法》管辖</li><li><strong>Consumer products（消费品）</strong>——在工作场所仅用于个人用途（如员工自带的洗手液）</li><li><strong>Drugs and pharmaceuticals（药品）</strong>——受《食品药品法》管辖</li><li><strong>Pesticides（农药）</strong>——受《农药控制法》管辖</li><li><strong>Wood or wood products（木材及木制品）</strong>——如原木、木板（但木尘受WHMIS管辖）</li><li><strong>Tobacco（烟草）</strong></li><li><strong>Nuclear substances（核物质）</strong>——受《核安全控制法》管辖</li></ul>"}],"tip":"WHMIS排除8类：爆炸物、化妆品、消费品（个人用途）、药品、农药、原木/木制品、烟草、核物质。记住「爆化消药农木烟核」。","gid":140},{"lid":3,"title":"List the three components of WHMIS 2015","page":"p.9","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"WHMIS 2015三大组成部分","b":"<ul><li><strong>Worker Education（工人教育）</strong>：关于WHMIS通用知识——危害类别、标签要素、SDS目的和使用</li><li><strong>Site-Specific Training（现场特定培训）</strong>：针对工作现场实际使用的特定产品——该产品的危害、控制措施和应急程序</li><li><strong>Ongoing Training（持续培训）</strong>：引入新产品、工艺变更、培训效果评估后的更新培训</li></ul>"},{"h":"培训必须针对工作实际","b":"<p>工人教育提供基础知识，但<strong>单独的工人教育不够</strong>——必须再加上现场特定培训，工人才能安全使用具体产品。</p>"}],"tip":"WHMIS三组成：Worker Education（通用WHMIS知识）+ Site-Specific（针对具体产品）+ Ongoing（更新培训）。三者缺一不可。","gid":141},{"lid":4,"title":"Identify at least five topics that should be covered in site specific training","page":"p.9","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"现场特定培训必须涵盖的主题（至少5个）","b":"<ul><li>工作场所使用的<strong>具体有害产品</strong>名称和用途</li><li>产品的<strong>危害信息</strong>（物理、健康危害）</li><li>安全使用、操作、储存和<strong>处置方法</strong></li><li>所需的<strong>PPE</strong>（类型和正确使用）</li><li><strong>暴露限值</strong>和如何防止超标</li><li>接触该产品的<strong>急救措施</strong></li><li>如何阅读该产品的<strong>SDS</strong></li><li><strong>应急程序</strong>（泄漏、火灾、暴露）</li></ul>"}],"tip":"现场特定培训8主题：产品名称/用途、危害、安全处置、PPE、暴露限值、急救、SDS阅读、应急程序。","gid":142},{"lid":5,"title":"State the four questions workers must be able to answer when site specific training is complete","page":"p.11","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"现场特定培训完成后工人必须能回答的四个问题","b":"<ul><li><strong>1. What hazardous products are in my workplace?（我的工作场所有哪些危险产品？）</strong></li><li><strong>2. What are the hazards of these products?（这些产品有哪些危害？）</strong></li><li><strong>3. How do I protect myself?（我如何保护自己？）</strong></li><li><strong>4. What do I do in an emergency?（紧急情况下我该怎么做？）</strong></li></ul>"},{"h":"培训有效性评估","b":"<p>这四个问题是评估现场特定培训是否有效的标准。如果工人不能回答这四个问题，培训不合格。</p>"}],"tip":"现场培训完成后，工人必须能回答四问：有什么产品→有什么危害→如何保护自己→紧急情况怎么做。这四问是培训有效性标准。","gid":143},{"lid":6,"title":"List five worker responsibilities related to hazard protection","page":"p.11","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"工人在WHMIS下的责任（至少5个）","b":"<ul><li>参加所有<strong>WHMIS培训</strong>（工人教育+现场特定）</li><li>在使用危险产品前<strong>阅读并理解标签和SDS</strong></li><li>按照标签和SDS的指示<strong>安全使用、储存和处置</strong>产品</li><li>使用要求的<strong>PPE</strong></li><li><strong>报告</strong>损坏、不可读或缺失的标签</li><li><strong>报告</strong>丢失或过期的SDS</li><li>遵守所有WHMIS相关的<strong>工作场所程序</strong></li></ul>"}],"tip":"工人WHMIS七责任：参加培训、读标签/SDS、安全使用/储存/处置、用PPE、报告损坏标签、报告丢失SDS、遵守程序。","gid":144},{"lid":7,"title":"State the three levels of hazard classification in the correct order","page":"p.14","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"GHS危害分类三层级（从高到低）","b":"<ul><li><strong>1. Hazard Class（危害类别）</strong>：最高层级，描述危害的基本类型（如：Flammable Liquids易燃液体）</li><li><strong>2. Hazard Category（危害分类）</strong>：在危害类别内的细分（如：易燃液体Category 1 = 最危险，Category 4 = 危险性最低）</li><li><strong>3. Hazard Statement（危害说明）</strong>：具体描述危害性质的标准化语句（H-statement，如：H225 – Highly flammable liquid and vapour）</li></ul>"},{"h":"分类数字的规律","b":"<p>在大多数危害类别中，<strong>数字越小 = 危险性越高</strong>（Category 1最危险，Category 4最不危险）。</p>"}],"tip":"三层级：Class（类别/基本类型）→Category（分类/严重程度）→Hazard Statement（具体说明）。数字越小越危险（Category 1最危险）。","gid":145},{"lid":8,"title":"Match hazard classes with the correct hazard group","page":"p.14","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"两大危害组","b":"<table><tr><th>危害组</th><th>包含的危害类别</th></tr><tr><td><strong>Physical Hazards（物理危害）</strong></td><td>Explosives（爆炸物）、Flammable Gases（易燃气体）、Flammable Liquids（易燃液体）、Oxidizing Liquids/Solids（氧化剂）、Self-reactive Substances（自反应物质）、Compressed Gas（加压气体）等</td></tr><tr><td><strong>Health Hazards（健康危害）</strong></td><td>Acute Toxicity（急性毒性）、Skin Corrosion/Irritation（皮肤腐蚀/刺激）、Carcinogenicity（致癌性）、Reproductive Toxicity（生殖毒性）、STOT（特定靶器官毒性）等</td></tr></table>"},{"h":"第三组","b":"<p><strong>Environmental Hazards（环境危害）</strong>：主要是Hazardous to the Aquatic Environment（水生环境危害）。</p>"}],"tip":"三大危害组：Physical（物理/爆炸/易燃/氧化/加压气体）、Health（健康/毒性/腐蚀/致癌）、Environmental（环境/水生）。","gid":146},{"lid":9,"title":"Describe the ranking system used for hazard categories","page":"p.16","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"危害分类排名系统","b":"<ul><li>大多数危害类别使用<strong>数字1–5</strong>（有些用字母A、B等）</li><li><strong>数字越小 = 危险性越高</strong>（Category 1 = 最高危险）</li><li><strong>数字越大 = 危险性越低</strong></li><li>图形上通常Category 1用红色/深色，数字越大颜色越浅</li></ul>"},{"h":"例外情况","b":"<p>少数类别使用字母（如Category A比B危险）。考试时遇到字母分类，A=最危险。</p>"}],"tip":"排名：数字越小=越危险（1最危险）。绝大多数危害类别适用。字母分类：A>B>C危险性递减。","gid":147},{"lid":10,"title":"Match pictograms with the correct hazard description","page":"p.18","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"9个GHS象形图（WHMIS 2015使用）","b":"<table><tr><th>象形图</th><th>符号</th><th>危害类型</th></tr><tr><td><strong>Flame（火焰）</strong></td><td>🔥</td><td>易燃固体/液体/气体；自燃/自热物质</td></tr><tr><td><strong>Flame Over Circle（圆圈上火焰）</strong></td><td>🔥⭕</td><td>氧化剂（Oxidizers）</td></tr><tr><td><strong>Exploding Bomb（爆炸炸弹）</strong></td><td>💥</td><td>爆炸物；自反应物质；有机过氧化物</td></tr><tr><td><strong>Gas Cylinder（气瓶）</strong></td><td>🫙</td><td>加压气体（Gases Under Pressure）</td></tr><tr><td><strong>Corrosion（腐蚀）</strong></td><td>⚗️</td><td>金属腐蚀剂；皮肤腐蚀/严重眼损伤</td></tr><tr><td><strong>Skull &amp; Crossbones（骷髅）</strong></td><td>☠️</td><td>高急性毒性（Category 1-3）</td></tr><tr><td><strong>Exclamation Mark（感叹号）</strong></td><td>❗</td><td>低急性毒性（Cat 4）；皮肤/眼刺激；呼吸道刺激</td></tr><tr><td><strong>Health Hazard（健康危害）</strong></td><td>⚕️</td><td>致癌物；生殖毒性；STOT；呼吸敏化剂</td></tr><tr><td><strong>Environment（环境）</strong></td><td>🌿</td><td>水生环境危害（WHMIS特有）</td></tr></table>"},{"h":"WHMIS特有的生物危害图","b":"<p><strong>Biohazardous Infectious Materials（☣️）</strong>：感染性物质——这是WHMIS独有的，不属于GHS标准系统。</p>"}],"tip":"9个GHS图+1个WHMIS专有生物危害图=共10个。关键区分：骷髅=高毒性(Cat1-3)；感叹号=低毒性(Cat4)。生物危害图=WHMIS专有。","gid":148},{"lid":11,"title":"Identify and rank the two signal words","page":"p.19","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"两个信号词","b":"<table><tr><th>信号词</th><th>严重程度</th><th>使用情形</th></tr><tr><td><strong>DANGER（危险）</strong></td><td>更严重（更高危险性）</td><td>用于危险性较高的类别（如Category 1和2）</td></tr><tr><td><strong>WARNING（警告）</strong></td><td>较轻（相对较低危险性）</td><td>用于危险性较低的类别（如Category 3和4）</td></tr></table>"},{"h":"重要规则","b":"<ul><li>每个产品标签只使用<strong>一个</strong>信号词</li><li>如果产品有多个危害，使用对应最高危害级别的信号词</li><li>没有信号词（某些Category 5或无分类的危害）</li></ul>"}],"tip":"两信号词：DANGER（更危险）> WARNING（较危险）。一个标签只用一个。多种危害存在时，用最高危害对应的那个。","gid":149},{"lid":12,"title":"State the purpose of hazard statements","page":"p.19","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"危害说明的目的","b":"<p>危害说明（Hazard Statements / H-statements）的目的是：用<strong>标准化的语句</strong>描述产品的危害性质和程度。</p>"},{"h":"特点","b":"<ul><li>每条H-statement有唯一的<strong>字母数字代码</strong>（如H225、H301）</li><li>H2xx = 物理危害；H3xx = 健康危害；H4xx = 环境危害</li><li>标准化意味着全球通用，任何人看到H225都知道是「高度易燃液体和蒸气」</li></ul>"}],"tip":"危害说明=标准化描述危害性质+程度的语句。代码：H2xx=物理，H3xx=健康，H4xx=环境。标准化保证全球一致性。","gid":150},{"lid":13,"title":"Distinguish between physical hazard statements and health hazard statements","page":"p.19","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"区别","b":"<table><tr><th>类型</th><th>代码范围</th><th>内容</th><th>例子</th></tr><tr><td><strong>Physical Hazard Statements</strong></td><td>H2xx</td><td>描述物理/化学危害</td><td>H225: Highly flammable liquid and vapour; H270: May cause fire or explosion</td></tr><tr><td><strong>Health Hazard Statements</strong></td><td>H3xx</td><td>描述对人体健康的危害</td><td>H301: Toxic if swallowed; H350: May cause cancer; H373: STOT</td></tr></table>"},{"h":"环境危害说明","b":"<p>H4xx：描述对环境的危害（如H400: Very toxic to aquatic life）</p>"}],"tip":"H2xx=物理危害（易燃/爆炸）；H3xx=健康危害（毒性/致癌）；H4xx=环境危害（水生）。代码前缀直接分类。","gid":151},{"lid":14,"title":"State the purpose of precautionary statements","page":"p.24","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"预防说明的目的","b":"<p>预防说明（Precautionary Statements / P-statements）的目的是：提供<strong>最小化或预防危害负面影响</strong>的具体措施和建议。</p>"},{"h":"补充说明","b":"<p>预防说明告诉你「<strong>该做什么</strong>」（How to respond）；危害说明告诉你「<strong>会发生什么</strong>」（What can happen）。两者配合才构成完整的安全信息。</p>"}],"tip":"危害说明=会发生什么（H-statements）；预防说明=该怎么做（P-statements）。两者配对，一描述危害，一提供行动指导。","gid":152},{"lid":15,"title":"State the four types of precautionary statements","page":"p.24","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"四类预防说明（P-statements）","b":"<table><tr><th>类型</th><th>代码</th><th>内容</th></tr><tr><td><strong>Prevention（预防）</strong></td><td>P2xx</td><td>如何预防危害（如：P210 – Keep away from heat; P260 – Do not breathe vapours）</td></tr><tr><td><strong>Response（响应）</strong></td><td>P3xx</td><td>暴露或事故后如何响应（如：P301+P310 – If swallowed: immediately call poison centre）</td></tr><tr><td><strong>Storage（储存）</strong></td><td>P4xx</td><td>如何安全储存（如：P403+P235 – Store in well-ventilated place. Keep cool）</td></tr><tr><td><strong>Disposal（处置）</strong></td><td>P5xx</td><td>如何安全处置产品和容器（如：P501 – Dispose of contents/container in accordance with regulations）</td></tr></table>"}],"tip":"四类P-statements：Prevention（P2xx预防）、Response（P3xx响应）、Storage（P4xx储存）、Disposal（P5xx处置）。记「预响储处」。","gid":153},{"lid":16,"title":"Identify if a precautionary statement is for prevention, storage, response, or disposal","page":"p.25","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"如何辨别","b":"<ul><li><strong>P2xx</strong> = Prevention（预防）——描述「不要做什么」或「使用前的安全措施」</li><li><strong>P3xx</strong> = Response（响应）——描述「发生暴露或事故后立即做什么」，常含If/call poison centre</li><li><strong>P4xx</strong> = Storage（储存）——描述「如何安全存放」</li><li><strong>P5xx</strong> = Disposal（处置）——描述「用完或过期后如何处理」</li></ul>"},{"h":"识别技巧","b":"<p>通过P-statement的代码数字前缀快速识别。P2=预防，P3=响应，P4=储存，P5=处置。</p>"}],"tip":"识别P-statement类型：看代码数字前缀。P2=预防、P3=响应（常含If...）、P4=储存、P5=处置。","gid":154},{"lid":17,"title":"Describe the differences between the two types of labels","page":"p.28","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"两种标签的区别","b":"<table><tr><th>类型</th><th>Supplier Label（供应商标签）</th><th>Workplace Label（工作场所标签）</th></tr><tr><td>制作者</td><td>产品供应商/制造商</td><td>雇主</td></tr><tr><td>适用场景</td><td>容器从供应商运来时</td><td>从大容器分装到小容器时</td></tr><tr><td>必须要素</td><td>6个要素（见KO 20）</td><td>3个要素（见KO 19）</td></tr><tr><td>语言要求</td><td>英语和/或法语</td><td>工人能理解的语言</td></tr></table>"}],"tip":"两种标签：Supplier（供应商做，6要素，随产品来）vs Workplace（雇主做，3要素，分装时用）。关键区别：谁做+几个要素。","gid":155},{"lid":18,"title":"Describe the most common use of work site labels","page":"p.28","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"工作场所标签最常用的情形","b":"<ul><li>从大容器<strong>分装（decanting）</strong>到小容器时（如从大桶分装到工人用的小喷壶）</li><li>供应商标签<strong>损坏、不可读或脱落</strong>时，需要制作替换标签</li><li>公司自己<strong>混合或制备</strong>危险产品时</li></ul>"},{"h":"分装特殊情况","b":"<p>如果分装的产品当班内全部用完，可以免除工作场所标签要求（免除条件非常具体，不适用于大量使用）。</p>"}],"tip":"工作场所标签最常用：分装（大容器→小容器）时必须贴。供应商标签损坏时也要替换。当班用完可免除（例外情形）。","gid":156},{"lid":19,"title":"Identify the three required elements on a work site label","page":"p.29","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"工作场所标签必须包含的三个要素","b":"<ul><li><strong>Product identifier（产品标识符）</strong>：产品名称，必须与SDS上的名称一致</li><li><strong>Hazard information（危害信息）</strong>：危害说明（H-statements）或危害符号（pictograms）</li><li><strong>Reference to SDS（SDS参考）</strong>：提示工人SDS的存在和可获取性</li></ul>"},{"h":"工作场所标签不需要的","b":"<p>不需要供应商标签上的所有信息（如信号词、供应商联系信息、预防说明等）——这是最小化要求。</p>"}],"tip":"工作场所标签三要素：产品名称（与SDS一致）+ 危害信息（H-statements或象形图）+ SDS参考。只需三个，不需要供应商标签的全部内容。","gid":157},{"lid":20,"title":"Identify the six required elements on a supplier label","page":"p.30","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"供应商标签六个必须要素","b":"<ul><li><strong>1. Product identifier（产品标识符）</strong>：产品名称</li><li><strong>2. Pictogram(s)（象形图）</strong>：GHS危害图标</li><li><strong>3. Signal word（信号词）</strong>：DANGER或WARNING</li><li><strong>4. Hazard statement(s)（危害说明）</strong>：H-statements</li><li><strong>5. Precautionary statement(s)（预防说明）</strong>：P-statements</li><li><strong>6. Supplier information（供应商信息）</strong>：供应商名称、地址、紧急联系</li></ul>"}],"tip":"供应商标签6要素：产品名称+象形图+信号词+危害说明(H)+预防说明(P)+供应商信息。比工作场所标签多3个（象形图、信号词、供应商信息和P-statements）。","gid":158},{"lid":21,"title":"List at least four training requirements specified in OHS Code Part 29","page":"p.38","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"OHS Code Part 29培训要求（至少记4个）","b":"<ul><li>雇主必须确保工人<strong>在接触危险产品前</strong>完成WHMIS培训</li><li>培训必须涵盖<strong>工作场所使用的所有危险产品</strong></li><li>培训必须包括<strong>标签的阅读和理解</strong></li><li>培训必须包括<strong>SDS的获取和使用</strong></li><li>培训必须包括<strong>工作场所标签的制作</strong>（如适用）</li><li>培训必须在<strong>引入新危险产品时更新</strong></li><li>雇主必须<strong>评估培训有效性</strong></li></ul>"}],"tip":"Part 29培训四要：接触前完成、涵盖所有产品、学会读标签+SDS+制作工作场所标签、引入新产品时更新。","gid":159},{"lid":22,"title":"Define the term readily available as related to SDSs","page":"p.38","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"SDS的「readily available（随时可查）」","b":"<p>SDS必须在<strong>工人正常工作班次期间</strong>可以获取，且<strong>不需要任何障碍</strong>（如不需要主管批准、不需要密码）。</p>"},{"h":"实际要求","b":"<ul><li>必须放在<strong>工人可以直接获取</strong>的地方</li><li>可以是纸质版、计算机访问或其他电子方式</li><li>如果是电子版，工人必须知道如何访问</li><li>不能锁在上司的办公室里</li></ul>"}],"tip":"「Readily available」=工人班次中随时能拿到，无障碍获取。不能锁在办公室或需要批准。电子版也可以，但工人必须会用。","gid":160},{"lid":23,"title":"Describe the five basic elements of a WHMIS program","page":"p.44","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"WHMIS项目五个基本要素","b":"<ul><li><strong>1. Hazard identification（危害识别）</strong>：识别工作场所所有受控产品</li><li><strong>2. Obtaining and maintaining SDSs（获取和维护SDS）</strong>：确保每种受控产品都有最新SDS</li><li><strong>3. Labelling（标签）</strong>：确保所有容器都有正确标签</li><li><strong>4. Worker education and training（工人教育和培训）</strong>：三大组成（通用+现场特定+持续）</li><li><strong>5. Program evaluation（项目评估）</strong>：定期评估WHMIS项目的有效性</li></ul>"}],"tip":"WHMIS项目五要素：危害识别→获取/维护SDS→标签→工人培训→项目评估。五步骤构成完整的工作场所WHMIS合规体系。","gid":161},{"lid":24,"title":"Describe the five elements to consider when organizing a training session","page":"p.45","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"组织培训课程的五个考量","b":"<ul><li><strong>1. Training needs（培训需求）</strong>：工人需要学什么？现有知识水平如何？</li><li><strong>2. Learning objectives（学习目标）</strong>：培训结束后工人应该能做什么？</li><li><strong>3. Training methods（培训方式）</strong>：课堂讲授、实操演示、视频、在线学习？</li><li><strong>4. Resources（资源）</strong>：需要什么材料、时间、场地、设备？</li><li><strong>5. Assessment（评估）</strong>：如何验证工人学到了什么？</li></ul>"}],"tip":"培训组织五考量：需求→目标→方式→资源→评估。这是结构化培训设计的基本框架。","gid":162},{"lid":25,"title":"Describe the three sections of a simplified lesson plan","page":"p.46","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"简化教案三个部分","b":"<table><tr><th>部分</th><th>内容</th></tr><tr><td><strong>Introduction（导入）</strong></td><td>引起学员兴趣；说明培训目的和目标；说明培训与工作的关联</td></tr><tr><td><strong>Body（主体）</strong></td><td>核心培训内容；按逻辑顺序组织；结合例子、演示和练习</td></tr><tr><td><strong>Conclusion（结语）</strong></td><td>总结关键要点；评估学员是否达到学习目标；说明后续行动</td></tr></table>"}],"tip":"教案三部分：Introduction（为什么学）+ Body（学什么）+ Conclusion（学到了吗+下一步）。结构简单但覆盖完整培训周期。","gid":163},{"lid":26,"title":"State four participant considerations when planning a training session","page":"p.48","cid":"whmis","cname":"WHMIS","color":"#4A0E4E","sections":[{"h":"规划培训时关于学员的四个考虑","b":"<ul><li><strong>Language（语言）</strong>：学员的主要语言是什么？是否需要翻译或双语材料？</li><li><strong>Literacy（识字/读写能力）</strong>：学员的读写能力水平如何？是否需要更多视觉内容和口头说明？</li><li><strong>Previous experience（以往经验）</strong>：学员对主题有多少已有知识？避免重复或跳过关键内容</li><li><strong>Learning styles（学习风格）</strong>：学员偏好听觉、视觉还是动手实践？设计多元化培训方式</li></ul>"}],"tip":"培训四学员考量：语言（需翻译？）、读写能力（需视觉辅助？）、以往经验（知识基础）、学习风格（听/看/做）。因人而异才有效。","gid":164}];

const COURSES = [
  {id:'all',  name:'全部',  color:'#555'},
  {id:'phsm', name:'PHSM', color:'#1D5C3A', full:'Principles of H&S Management'},
  {id:'leg',  name:'LEG',  color:'#8B3000', full:'OHS Legislation'},
  {id:'lse',  name:'LSE',  color:'#2C4A7C', full:'Leadership for Safety'},
  {id:'wib',  name:'WIB',  color:'#5C2D00', full:'Worksite Investigation'},
  {id:'atp',  name:'ATP',  color:'#1A3A1A', full:'Auditor Training Program'},
  {id:'whmis',name:'WHMIS',color:'#4A0E4E', full:'WHMIS Train-the-Trainer'},
];

const TOTAL = DATA.length;
let read = new Set(JSON.parse(localStorage.getItem('ncso_read2')||'[]'));
let cur_course = 'all';
let cur_mode = 'all';
let cur_q = '';
let open_gid = null;

function save(){ localStorage.setItem('ncso_read2', JSON.stringify([...read])) }

function filtered(){
  let d = DATA;
  if(cur_course !== 'all') d = d.filter(c=>c.cid===cur_course);
  if(cur_q){
    const q = cur_q.toLowerCase();
    d = d.filter(c=>
      c.title.toLowerCase().includes(q) ||
      c.cname.toLowerCase().includes(q) ||
      c.tip.toLowerCase().includes(q) ||
      c.sections.some(s=>s.h.toLowerCase().includes(q)||s.b.toLowerCase().includes(q))
    );
  }
  if(cur_mode === 'review') d = d.filter(c=>read.has(c.gid));
  return d;
}

function renderTabs(){
  const el = document.getElementById('ctabs');
  el.innerHTML = COURSES.map(c=>{
    const on = c.id===cur_course;
    return `<div class="ctab ${on?'on':''}" 
      style="${on?'background:'+c.color+';color:#fff':''}"
      onclick="setCourse('${c.id}')">${c.name}</div>`;
  }).join('');
}

function renderStats(){
  const el = document.getElementById('stat-bar');
  const stats = COURSES.slice(1).map(c=>{
    const total = DATA.filter(d=>d.cid===c.id).length;
    const done = DATA.filter(d=>d.cid===c.id && read.has(d.gid)).length;
    return `<div class="stat-chip" style="border-left:3px solid ${c.color}">
      <strong>${done}</strong>/${total} ${c.name}</div>`;
  });
  el.innerHTML = stats.join('');
}

function renderList(){
  const d = filtered();
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  if(!d.length){ list.style.display='none'; empty.style.display='block'; return; }
  list.style.display='block'; empty.style.display='none';
  
  list.innerHTML = d.map(card=>{
    const done = read.has(card.gid);
    const isOpen = card.gid === open_gid;
    return `<div class="card ${done?'done':''} ${isOpen?'open':''}" id="c${card.gid}">
      <div class="card-hdr" onclick="toggle(${card.gid})">
        <div class="card-num" style="background:${card.color}">${card.lid}</div>
        <div class="card-info">
          <div class="card-title">${card.title}</div>
          <div class="card-meta">
            <span class="card-course" style="color:${card.color}">${card.cname}</span>
            ${card.page?`<span class="card-pg">${card.page}</span>`:''}
          </div>
        </div>
        <div class="card-right">
          <div class="card-dot ${done?'done':''}"></div>
          <div class="card-chev">▼</div>
        </div>
      </div>
      ${isOpen?`<div class="card-body">
        ${card.sections.filter(s=>s.b).map(s=>`
          <div class="sec">
            <div class="sec-h">${s.h}</div>
            <div class="sec-b">${s.b}</div>
          </div>`).join('')}
        ${card.tip?`<div class="tip">
          <div class="tip-lbl">💡 记忆要点</div>
          <div class="tip-t">${card.tip}</div>
        </div>`:''}
        <button class="mark-btn ${done?'done':''}" onclick="toggleDone(${card.gid},event)">
          ${done?'✓ 已掌握 — 点击取消':'标记为已掌握'}
        </button>
      </div>`:''}
    </div>`;
  }).join('');
  
  updateProg();
  
  if(open_gid){
    setTimeout(()=>{
      const el=document.getElementById('c'+open_gid);
      if(el) el.scrollIntoView({behavior:'smooth',block:'nearest'});
    },60);
  }
}

function toggle(gid){
  open_gid = open_gid===gid ? null : gid;
  renderList();
}

function toggleDone(gid, e){
  e.stopPropagation();
  read.has(gid)?read.delete(gid):read.add(gid);
  save(); renderList(); renderStats();
}

function setCourse(id){
  cur_course=id; open_gid=null;
  renderTabs(); renderList();
}

function setMode(m){
  cur_mode=m;
  document.getElementById('m-all').classList.toggle('on', m==='all');
  document.getElementById('m-rev').classList.toggle('on', m==='review');
  open_gid=null; renderList();
}

function onSearch(q){
  cur_q=q; open_gid=null; renderList();
}

function updateProg(){
  const pct=Math.round(read.size/TOTAL*100);
  document.getElementById('prog-f').style.width=pct+'%';
  document.getElementById('rc').textContent=read.size;
}

function nav(dir){
  const d=filtered();
  if(!d.length) return;
  const ids=d.map(c=>c.gid);
  if(!open_gid){ open_gid=dir>0?ids[0]:ids[ids.length-1]; }
  else{
    const i=ids.indexOf(open_gid);
    const n=i+dir;
    if(n<0||n>=ids.length) return;
    open_gid=ids[n];
  }
  renderList();
}

renderTabs(); renderStats(); renderList();
