uthority, to direct how another person does\nwork or performs a task is under a legal duty to take reasonable steps to prevent\nbodily harm to that person, or any other person, arising from that work or task.\n\nOffence \n\ns.219 Criminal negligence\n(1) Every one is criminally negligent who\n(a) in doing anything, or\n(b) in omitting to do anything that it is his duty to do, shows wanton or reckless\ndisregard for the lives or safety of other persons.\n(2) For the purposes of this section, duty means a duty imposed by law.\n\nCharges \n\ns.220 Causing death by criminal negligence\ns.221 Causing bodily harm by criminal negligence\nSource: laws-lois.justice.gc.ca\n\nR v Kaznelson (Metron Construction)\nOn June 26, 2015, V. Kazenelson was found guilty of\nfour counts of criminal negligence causing death (s.220)\nand one count of criminal negligence causing bodily\nharm (s.221) for failing to fulfill his duties under s.217.1\nof the Criminal Code of Canada.\nThe charges arose from an incident in which five\nworkers employed by Metron Construction Incorporated\nfell more than 100 feet to the ground when the swing\nstage on which they were working suddenly collapsed.\nNone of those workers were attached to a lifeline as\nrequired by both the law and industry practice.\nMr. Kazenelson, Metron’s project manager, was with the\nworkers at the time of the collapse. He had taken no\nsteps to ensure that lifelines were available for the\nworkers and that they were used. Mr. Kazenelson was\nsentenced to 3½ years in prison.\nSource: www.canlii.org\n\nLearning Check (Objective 15)\nState the duty of those directing work as\noutlined in the Criminal Code of Canada.\n\n© iStock Photo by terryjalcorn.com\n\nCanadian legal decisions and cases\ncan be researched using CanLII\n(pronounced “Can-Lee”)\nCanLII (Canadian Legal Information\nInstitute) is a public, searchable\ndatabase of legal cases sponsored by\nthe Federation of Law Societies of\nCanada.\n\n25"},"wib":{"3":"The Importance of Conducting Investigations\nThere are many reasons why a company should be investigating incidents. Some are company choices, and some are legal\nrequirements. The main reason why companies should investigate is to try and prevent future incidents.\nPrevention Activities\n\nFinancial Considerations\n\n•\n\nIdentifying corrective actions\n\n•\n\nReducing costs and increasing profits\n\n•\n\nReviewing hazard identification and control procedures\n\n•\n\nReducing the potential for future losses\n\n•\n\nReviewing and adjusting SWPs/SJPs\n\n•\n\nIncreasing efficiency and quality\n\n•\n\nModifying training materials\n\n•\n\nProviding data to insurance providers\n\n•\n\nModifying, replacing, or substituting equipment\n\n•\n\nImproving client confidence\n\n•\n\nModifying or eliminating hazardous work processes\n\n•\n\nMaintaining COR\n\n•\n\nImproving supervision and monitoring\nLegal Requirements\n• Investigating incidents as required by some acts and\nregulations (e.g., OHS, EPE, TDG, etc.)\n\nCorporate Values\n•\n\nHaving a safe and healthy workplace\n\n•\n\nBeing an industry leader\n\n•\n\nImproving company culture\n\n•\n\n•\n\nEnsuring the health and safety management system (HSMS)\nis effective (i.e., Investigation policy and procedures are one\nof the key elements of an effective HSMS)\n\nHelping to establish a valid legal defense in the event of a\nfuture incident\n\n•\n\nDue Diligence is based on three factors:\n\nDue Diligence\n\no Foreseeability\no Preventability\no Control\n\nLearning Check (Objective 1)\nState the main reason why companies\nshould conduct investigations.\n\n3","4":"OHS Act Requirements\nEmployers must report the following under s.33 of the OHS Act.\n\nEmployers must do the following if there is a reportable incident.\n\ns.33(2)\n•\nAn injury, illness, or incident resulting in a death of a worker\n•\nAn injury, illness, or incident in which there is reason to believe\nthe worker has been or will be admitted to a hospital beyond\ntreatment in an emergency room or urgent care facility\n•\nAn unplanned or uncontrolled fire, explosion, or flood that caused\na serious injury or illness, or has the potential to cause a serious\ninjury or illness\n•\nA collapse or upset of a crane, derrick, or hoist\n•\nA collapse or failure of any component of a building or structure\nnecessary for the structural integrity of the building or structure\n\ns.33(6)\n• Carry out an investigation into the circumstances surrounding the\ninjury, illness, incident, or worker exposure\n• Prepare a report with the circumstances and any corrective actions\nto prevent a recurrence\n• Ensure that a copy of the report is readily available and provided to\nan officer on demand\n• Provide a copy of the report to a Director and the HSC or HSR if\nthere is one. If there is no HSC or HSR, make it available to\nworkers once the investigation is complete\n\ns. 33(3) – (4)\n•\nMake a report to OHS of the time, place, and nature of the\nincident as soon as possible\n\ns.33(7)\n•\nRetain reports for at least two years\n\ns.33(5)\n•\nIf an incident occurs where\n\nS33(9)\n\n•\n\no the incident had a likelihood of causing a serious injury or\nillness, and\no there is reason to believe that corrective action may need to\nbe taken to prevent recurrence\n\nDo not disturb the scene unless to attend to a person who is\ninjured or killed, prevent further injuries or incidents, or protect\nproperty\n\nthe prime contractor, or if there is no prime contractor, the\nemployer shall conduct an investigation in accordance with\nsubsection (6).\n\nIf you have any\nquestions call OHS\nat 1-866-415-8690.\nLearning Check (Objective 2)\nState the reportable incidents outlined in\nSection 33 of the OHS Act.\n\nLearning Check (Objective 3)\nState the actions employers must take\nif there is a reportable incident.\n\n4","5":"Incident Pyramids\n\nIncident pyramids show a summary of a\ncompany’s incident data. The terms used may vary\nfrom company to company, but the significance of\nall pyramids is the link between near misses and\nincidents. This is why companies should also look\nclosely at near misses.\n\nSome pyramids also include company systems,\nprocedures, and culture. Reviewing these factors\ncan help determine the root causes of an incident\nor near miss.\n\nMajor Incidents\nMinor Incidents\nNear Misses\nAt-risk Behaviours\nSystems and Processes\nCompany Culture\n\nLearning Check (Objective 4)\nIdentify the significance of incident pyramids.\n\n5","6":"Investigation Policy &amp; Procedures\nInvestigation policy and procedures are part of a company’s\nsafety program. They should have answers to the two\nquestions below.\n•\n\nWhat type of incidents will be investigated?\n\n•\n\nWho will be involved in doing investigations?\n\nInvestigation policy and procedures may also deal with some\nor all of the following.\n•\n\nIndustry best practices and standards\n\n•\n\nContract and client requirements\n\n•\n\nLevel of investigation required\n\n•\n\nIncident costing model\n\n•\n•\n\nPre-Investigation Events\nInvestigations occur after several events have already\nhappened. The list below shows the three most common\nevents.\n•\n\nAn incident has occurred\n\n•\n\nAn incident report has been generated\n\n•\n\nA decision is made to investigate\n\nIssues to consider at your company:\n•\n\nWho actually says it’s an incident?\n\nInvestigator competency requirements\n\n•\n\nAre near misses investigated?\n\nLegal requirements\n\n•\n\nDo workers report near misses? If not, why not?\n\n•\n\nWho generates the incident report?\n\n•\n\nWho decides when to do an investigation?\n\nLearning Check (Objective 5)\nState two questions that should be answered\nby an investigation policy and procedures.\n\n6","7":"Simplified Investigation Process (SIP)\n\nACSA created the SIP for small and medium-sized companies. It\nuses concepts from several different models and from industry best\npractices. Following the SIP is a simple and effective way to do\ninvestigation.\nCausation Models and SIP\n\nStep 1\n\nStep 2\n\nStep 3\n\nStep 4\n\nSecure the\nScene\n\nCollect the\nEvidence\n\nAnalyze the\nCauses\n\nWrite the\nReport\n\nA causation model helps an investigator analyze causes.\nThere are many different causation models, so a company\nmust decide on which one to use. There are pros and cons\nfor each model and some companies use more than one\nmodel depending on the type of incident. Causation\nmodels fit into Step 3 of the SIP.\nExamples of Causation Models\n• Latent Failure Model (Swiss Cheese Model)\n• SCAT® (Systemic Cause Analysis Technique)\n• Sequence of Events Analysis\n• 5 Why Process\n• TapRooT®\n• Loss Causation Model (Bird)\n\nLearning Check (Objective 6)\nList the four steps of the SIP in\nthe correct order.\n\n7","8":"Step 1 – Secure the Scene\nOnce I’ve arrived on scene,\nwhat should I do now?\n\nOnce I have control of the scene, what\nshould I think about now?\n\nDepending on the incident and/or company\npolicies, I may have to call…\n\n•\n\nProtect myself\n\n•\n\nWhat appears to have happened?\n\n•\n\nAdditional investigators\n\n•\n\nBegin logging events and my actions\n\n•\n\nHas there been a release or spill?\n\n•\n\nLoss management/safety specialists\n\n•\n\nCoordinate my actions with responders\n\n•\n\nWho should I interview?\n\n•\n\nIndustrial hygienists\n\n•\n\nAccount for all workers in the area\n\n•\n\nWhat is missing that should be here?\n\n•\n\nTechnical experts/engineers\n\n•\n\nEnsure no further injuries occur\n\n•\n\nWhat is there that should not be there?\n\n•\n\nArea supervisors and “courtesy calls”\n\n•\n\nControl access to the scene\n\n•\n\nWhat may have failed?\n\n•\n\nOperations manager/superintendent\n\n•\n\nFreeze the scene\n\n•\n\nWhich evidence is most time-sensitive?\n\n•\n\nEquipment suppliers\n\n•\n\nEnsure all injured workers receive care\n\n•\n\nWhat are the weather conditions?\n\n•\n\nCompany owner/prime contractor/client\n\n•\n\nIdentify all existing/potential hazards\n\n•\n\nWhat are the light and noise levels?\n\n•\n\nHuman resources department\n\n•\n\nEnsure all energy sources are controlled\n\n•\n\nIs there video surveillance of the area?\n\n•\n\nLegal department\n\n•\n\nEnsure no further damage occurs\n\n•\n\nWhat seems normal or abnormal?\n\n•\n\nMedia relations department\n\n•\n\nBegin assessing the scene\n\n•\n\nWhat resources are needed at the scene?\n\n•\n\nCritical incident stress debriefing team\n\n•\n\nBegin identifying witnesses\n\n•\n\nWhat resources do I need?\n\n•\n\nInjured workers’ families\n\n•\n\nBegin protecting evidence\n\n•\n\nAlberta Occupational Health and Safety\n\n•\n\nBegin taking photographs and/or videos\n\n•\n\nAlberta Energy Regulator (AER)\n\n•\n\nWorkers Compensation Board (WCB)\n\n•\n\nCoordination and Information Centre (TDG)\n\n•\n\nJurisdictional police\n\nAdapted from: Occupational Health &amp; Safety Theory, Strategy, &amp; Industry Practice 2nd Ed. (Dyck) and Practical Loss Control Leadership 3rd Ed. (Bird, et al.)\n\nLearning Check (Objective 7)\nIdentify at least five actions an investigator\nshould take once they have arrived on scene.\n\n8","9":"Classifying an incident\nBasic Incident Classifications\nLosses\n•\n•\n\nResult when harm and/or damage occurs\nOccur after the incident\n\nResult from energy transfers\nOccur before the loss\n\n•\n•\n•\n•\n•\n\nHarm to people\n• Minor injury or illness\n• Serious injury or\nillness\n• Major injury or illness\n• Fatality\n\nDamage to things\n•\n•\n•\n•\n\nTypes of Energy\n•\n•\n•\n•\n•\n•\n\nMinor\nSerious\nMajor\nCatastrophic\n\nPotential (stored energy)\nKinetic (moving objects)\nThermal\nElectrical\nChemical\nRadiological/Nuclear\n\n•\n•\n•\n•\n•\n•\n•\n\nStruck against (running or bumping into)\nStruck by (hit by a moving object)\nFall to a lower level\nFall on the same level (slip and fall, trip\nand fall, tip over, upset)\nCaught in (pinched in, nipped on,\nentangled with)\nCaught on (snagged on, hung-up on,\nentangled on)\nCaught between (compressed, crushed,\nsevered/removed, amputated body parts)\nContact with harmful energy\nContact with harmful substance\nOverstress\nOverexertion\nOverload\n\nSIP Step 1\nIdentify the\nLosses\n\nSIP Step 1\nClassify the\nIncident\n\nStep 2\n\nAdapted from: Practical Loss Control Leadership 3rd Ed. (Bird, et al.)\n\nLearning Check (Objective 8)\nDescribe two differences between losses\nand incidents.\n\nSIP Step 3\nIdentify\nDirect Causes\n\nSIP Step 3\nDetermine Basic\nCauses\n\nSIP Step 3\nAnalyze\nRoot Causes\n\nStep 4\n\n•\n•\n\nIncidents\n\nLearning Check (Objective 9)\nMatch the components of Step 1 Secure the Scene with the\nSimplified Investigation Process (SIP).\n\n9","10":"Step 2 – Collect the Evidence\nEvidence\ntype\n\nExamples\n\nCollection\nmethod\n\nPosition\n\nPeople\n\nParts\n\nPaper\n\n(most time-sensitive)\n\n(very time-sensitive)\n\n(less time-sensitive)\n\n(least time-sensitive)\n\n•\n\nPeople\n\n•\n\nWorker perceptions\n\n•\n\nActual equipment/tool parts\n\n•\n\nFinal incident report\n\n•\n\nTools/equipment/parts\n\n•\n\nWitness interviews\n\n•\n\nActual building/facility parts\n\n•\n\nCompany policies/procedures\n\n•\n\nDamaged parts\n\n•\n\nInitial incident report\n\n•\n\nIntended function of a part\n\n•\n\nCompany rules\n\n•\n\nSigns of damage\n\n•\n\nTechnical expert opinions\n\n•\n\nNormal condition of a part\n\n•\n\nSWPs/SJPs\n\n•\n\nCondition of equipment/parts\n\n•\n\nDrug and alcohol testing\n\n•\n\nCurrent condition of a part\n\n•\n\nHazard assessments\n\n•\n\nNearby hazards\n\n•\n\nSite inspection reports\n\n•\n\nTerrain/excavations\n\n•\n\nEquipment inspection reports\n\n•\n\nSoil/air/water conditions\n\n•\n\nMaintenance reports\n\n•\n\nSounds/smells\n\n•\n\nPrevious investigation reports\n\n•\n\nTemperature/humidity\n\n•\n\nWorker training records\n\n•\n\nWind direction/velocity\n\n•\n\nSupervisor training records\n\n•\n\nRelevant legislation\n\n•\n\nIndustry standards\n\n•\n\nObtain documents or copies\nof documents\n\n•\n•\n•\n•\n•\n•\n•\n\nTake photos/video\nDrone to get overhead photos\nCollect security video\nUse an app to facilitate data\ncollection\nTake initial statements\nDraw diagrams/sketches\nTake measurements\n\n•\n•\n•\n•\n•\n\nConduct formal interviews\nObtain copy of incident report\nSecure hard drives\nCollect reports from experts\nObtain urine/blood samples\n\n•\n•\n•\n•\n\nTake photos/video\nLocate parts on diagrams\nTag and secure parts\nSecure parts in situ (in place)\n\nAdapted from: Occupational Health &amp; Safety Theory, Strategy, &amp; Industry Practice 2nd Ed. (Dyck)\n\nLearning Check (Objective 10)\nList the four types of evidence from most\ntime-sensitive to least time-sensitive\n\nLearning Check (Objective 11)\nIdentify examples of each type of evidence\n\n10","11":"Interviewing guidelines\nInitial questions to be answered\n\nBest practices for conducting interviews\n\n•\n\nWhat was going on prior to the incident?\n\n•\n\nGet initial statements as soon as possible\n\n•\n\nWhat tasks were being done before the incident?\n\n•\n\nMeet with workers individually in a comfortable location\n\n•\n\nWho was involved?\n\n•\n\nPut workers at ease by being courteous and considerate\n\n•\n\nWhat hazards controls were in place?\n\n•\n\nAsk workers how they are feeling\n\n•\n\nWhat equipment and tools were being used?\n\n•\n\nExplain the purpose of the investigation\n\n•\n\nWhat was each person doing before the incident?\n\n•\n\nUse open-ended questions and keep interruptions to a minimum\n\n•\n\nHow did workers respond?\n\n•\n\nLet workers talk freely and listen to them carefully\n\n•\n\nWhere was each person located before the incident?\n\n•\n\nAsk questions at the right time to keep the interview moving forward\n\n•\n\nWhat happened once the incident started?\n\n•\n\n•\n\nWhat were the events leading up to the incident?\n\nTake written notes and record exact words used by workers (only record\nelectronically with witness consent and if allowed by company policy)\n\n•\n\nWhere did workers go after the incident?\n\n•\n\nFocus specifically on what workers directly experienced\n\n•\n\nWhat was out of the ordinary?\n\n•\n\nUse pictures and diagrams to assist in the interview\n\n•\n\nWhat did workers think was the cause and why?\n\n•\n\nProvide feedback so witnesses know you understand what they said\n\n•\n\nIdentify workers by recording name, address, occupation, experience,\nposition in company, and other contact information as appropriate\n\n•\n\nGet workers to sign their statements and provide a copy to them\n\n•\n\nEnd interview on a positive note and provide your contact information.\n\nAdapted from: Practical Loss Control Leadership 3rd Ed. (Bird, et al.) &amp; Occupational Health &amp; Safety Theory, Strategy, &amp; Industry Practice 2nd Ed. (Dyck)\n\nLearning Check (Objective 12)\nState at least five initial questions that\nan investigator needs to answer.\n\nLearning Check (Objective 13)\nState at least five best practices for\nconducting interviews.\n\n11","16":"Step 3 – Analyze the Causes\nBasic Causes (Supervisor Level)\n\nDirect Causes (Worker Level)\n\nRoot Causes\n\nSubstandard\nPractices\n\nSubstandard\nConditions\n\nPersonal\nFactors\n\nJob/System\nFactors\n\n(Management Level)\n\n• Failing to identify hazard/risk\n• Failing to use PPE properly\n• Failing to follow policy,\nprocedure, rule\n• Failing to communicate or\ncoordinate\n• Operating equipment without\nauthority\n• Horseplay\n• Failing to warn\n• Failing to secure\n• Operating equipment at\nimproper speed\n• Using defective equipment\n• Improper loading\n• Improper placement\n• Improper lifting\n• Improper position for task\n• Servicing equipment in\noperation\n• Under the influence\n• Using equipment improperly\n• Making safety devices\ninoperable\n• Failing to check/monitor\n• Failing to react/correct\n\n• Inadequate/improper PPE\n• Inadequate guards, barriers\n• Poor housekeeping or\ndisorder\n• Inadequate preparation or\nplanning\n• Poor instructions or\nprocedures\n• Inadequate information\n• Defective tools, equipment,\nmaterials\n• Inadequate warning system\n• Congestion/restricted action\n• Fire/explosion hazard\n• Noise exposure\n• Radiation exposure\n• Temperature exposure\n• Inadequate or excessive\nillumination\n• Inadequate ventilation\n• Presence of harmful\nmaterials\n• Inadequate\ncommunications\n• Poor road conditions\n• Poor weather conditions\n\nLack of Knowledge/Skill\nrelated to…\n• Inadequate orientation\n• Inadequate initial training\n• Inadequate update training\n• Lack of coaching\n• Inadequate instructions\n• Misunderstood directions\n• Inadequate practice\n• Lack of experience\n\nInadequate Supervision related\nto…\n• Inadequate instructions,\norientation, or training\n• Inadequate work planning\n• Inadequate performance\nfeedback and evaluation\n• Inadequate policy,\nprocedure, practices,\nguidelines\n• Conflicting objective, goals,\nstandards\n• Inadequate reference or\nguidance documents\n• Unclear/conflicting roles and\nresponsibilities\n• Unclear/conflicting reporting\nrelationships\n• Inadequate matching of\nindividual qualifications and\ntask requirements\n\nManagement failure to\nestablish or maintain\nstandards for…\n• Knowledge, skill training\n• Leadership, administration\n• Leadership training\n• Inspections/maintenance\n• Critical task analysis\n• Incident investigation\n• Performance observations\n• Emergency preparedness\n• Rules, work permits\n• Incident analysis\n• Personal protective\nequipment\n• Health, hygiene control\n• System evaluation\n• Engineering\n• Personal communications\n• Team communications\n• Hiring, placement\n• Materials/services\n• Off-the-job safety\n\nImproper Motivation related\nto…\n• Improper attempt to save\ntime/effort\n• Inappropriate peer\npressure\n• Improper leadership\nexample\n• Inadequate performance\nfeedback\n• Inadequate reinforcement\nof proper behaviour\n• Improper performance\nrewarded\n• Inappropriate aggression\n• Improper attempt to avoid\ndiscomfort\n• Improper attempt to gain\nattention\n• Excessive frustration\n(also see p.17)\n\nInadequate Work Standards\nrelated to…\n• Evaluation of\nexposures/needs\n• Lack of employee\ninvolvement\n• Procedures, rules,\nstandards\n• Communication of\nprocedures, rules, standards\n• Reviewing/updating\nprocedures, rules, standards\n(also see p.17)\n\nAdapted from: Practical Loss Control Leadership 3rd Ed. (Bird, et al.)\n\nLearning Check (Objective 14)\nIdentify different types of incident causes.\n\nSome models refer to basic causes as\nindirect causes. This course only uses\nthe term basic causes.\n\n16","17":"Additional Basic Causes (Supervisor Level)\nPersonal factors\nInadequate Physical/Physiological\nCapability related to…\n• Inappropriate height, weight, size,\nstrength, or reach\n• Restricted range of body movement\n• Limited ability to sustain body\nposition\n• Sensory deficiencies (hearing, vision,\ntouch, taste, smell, balance)\n• Sensitivities to temperature/sound\n• Sensitivities/allergies to substances\n• Respiratory incapacity\n• Permanent/temporary disabilities\nPhysical/Physiological Stress related\nto…\n• Injury/illness\n• Fatigue due to task load or duration\n• Fatigue due to lack of rest\n• Fatigue due to sensory overload\n• Exposure to health hazards\n• Exposure to temperature extremes\n• Oxygen deficiency\n• Atmospheric pressure variations\n• Constrained movement\n• Blood sugar insufficiency\n• Drugs\n\nJob/system factors\n\nInadequate Mental/Psychological\nCapability related to…\n• Fears and phobias\n• Emotional disturbance\n• Mental illness\n• Intelligence level\n• Inability to comprehend\n• Poor judgement\n• Poor coordination\n• Slow reaction time\n• Low mechanical aptitude\n• Low learning aptitude\n• Memory failure\nMental/Psychological Stress related\nto…\n• Emotional overload\n• Fatigue due to mental task, load,\nspeed\n• Extreme judgement/decision\ndemands\n• Routine/monotony\n• Extreme concentration demands\n• Meaningless activities\n• Confusing directions\n• Conflicting demands\n• Preoccupation with problems\n• Frustration\n• Mental illness\n\nInadequate Maintenance related to…\n• Assessment/communication of needs\n• Scheduling of work\n• Examination of parts/units\n• Lubrication/servicing\n• Adjustment/assembly\n• Cleaning/resurfacing\nInadequate Tools/Equipment related\nto…\n• Ergonomics\n• Standards/specifications\n• Adjustment/repair/maintenance\n• Removal/replacement of unsuitable\nitems\nInadequate Engineering related to…\n• Assessment of loss exposures\n• Ergonomics\n• Specification/design criteria\n• Monitoring of construction\n• Assessment of operational readiness\n• Evaluation of changes\n\nIncrease in Wear and Tear related to…\n• Inadequate planning and use\n• Improper extension of service life\n• Inadequate inspection/monitoring\n• Improper loading/rate of use\n• Inadequate maintenance\n• Use by unqualified/untrained people\n• Use for wrong purposes\nInadequate Purchasing related to…\n• Specifications on requisitions or to\nvendors\n• Research on material/equipment\n• Mode or route of shipment\n• Storage/handling of materials\n• Transportation of hazardous items\n• Communication of safety/health data\n• Salvage/waste disposal\nAbuse or Misuse related to…\n• Supervision intentionally condoning\nthe abuse or misuse\n• Supervision unintentionally\ncondoning the abuse or misuse\n\nAdapted from: Practical Loss Control Leadership 3rd Ed. (Bird, et al.)\n\nLearning Check (Objective 15)\nMatch the components of Step 3 Analyze the Causes\nwith the Simplified Investigation Process (SIP).\n\n17","21":"Step 4 – Write the Report\nRecommended sections of an investigation report\n1.\n\n2.\n\n3.\n\nIncident type (may be more than one)\n• Near miss/minor injury/serious injury/fatality\n• Production loss/spill/release\n• Property/facility damage or loss\nBasic incident identifiers\n• Date/time/location/worksite\n• Supervisor/employer/contractor/prime contractor/client/owner\n\n•\n\nIncident cost es let read = new Set(JSON.parse(localStorage.getItem('ncso_read2')||'[]'));
let weak = new Set(JSON.parse(localStorage.getItem('ncso_weak1')||'[]'));
let cur_course='all', cur_mode='all', cur_q='', open_gid=null;
let shuffle_on=false, shuffle_order=null, orig_open=null;

function pagesOf(card){
  const book=IMG_PAGES[card.cid]||ORIG[card.cid];
  if(!book) return null;
  const out=[];
  const re=/(\d+)(?:[–\-—](\d+))?/g; let m;
  while((m=re.exec(card.page))){
    const a=+m[1], b=+(m[2]||m[1]);
    for(let p=a;p<=b;p++) if(book[p]!==undefined) out.push(p);
  }
  return out.length?out:null;
}

function toggleOrig(gid,e){
  e.stopPropagation();
  orig_open = orig_open===gid?null:gid;
  renderList();
}

function save(){
  localStorage.setItem('ncso_read2', JSON.stringify([...read]));
  localStorage.setItem('ncso_weak1', JSON.stringify([...weak]));
}

function filtered(){
  let d = DATA;
  if(shuffle_on && shuffle_order) d = shuffle_order.map(i=>DATA[i]);
  if(cur_course!=='all') d = d.filter(c=>c.cid===cur_course);
  if(cur_q){
    const q = cur_q.toLowerCase().trim();
    if(q) d = d.filter(c=>SIDX.get(c.gid).includes(q));
  }
  if(cur_mode==='review') d = d.filter(c=>read.has(c.gid));
  else if(cur_mode==='todo') d = d.filter(c=>!read.has(c.gid));
  else if(cur_mode==='weak') d = d.filter(c=>weak.has(c.gid));
  return d;
}

function renderTabs(){
  document.getElementById('ctabs').innerHTML = COURSES.map(c=>{
    const on = c.id===cur_course;
    return `<div class="ctab ${on?'on':''}" style="${on?'background:'+c.color+';color:#fff':''}"
      onclick="setCourse('${c.id}')">${c.name}</div>`;
  }).join('');
}

function renderStats(){
  document.getElementById('stat-bar').innerHTML = COURSES.slice(1).map(c=>{
    const total = DATA.filter(d=>d.cid===c.id).length;
    const done = DATA.filter(d=>d.cid===c.id && read.has(d.gid)).length;
    return `<div class="stat-chip" style="border-left:3px solid ${c.color}" onclick="setCourse('${c.id}')">
      <strong>${done}</strong>/${total} ${c.name}</div>`;
  }).join('');
}

function renderHdr(){
  const c = COURSES.find(x=>x.id===cur_course);
  const n = cur_course==='all' ? TOTAL : DATA.filter(d=>d.cid===cur_course).length;
  document.getElementById('hdr-sub').textContent = `${c.full} · ${n}条知识目标`;
}

function secHtml(s){
  if(!s.b) return `<div class="sec"><div class="sec-h solo">${s.h}</div></div>`;
  return `<div class="sec"><div class="sec-h">${s.h}</div><div class="sec-b">${s.b}</div></div>`;
}

        <div class="card-right">
          <div class="card-dot ${done?'done':''}"></div>
          <div class="card-chev">▼</div>

        ${card.tip?`<div class="tip"><div class="tip-lbl">💡 记忆要点</div><div class="tip-t">${card.tip}</div></div>`:''}

          ${on?`<div class="orig">${pgs.map(p=>hasImg(card.cid,p)?`<div class="orig-pg-h">${card.cname} 参编 · p.${p}（点图放大）</div><img class="orig-img" loading="lazy" decoding="async" data-c="${card.cid}" data-p="${p}" src="${imgSrc(card.cid,p)}" onerror="imgFail(this)" onclick="openViewer('${card.cid}',${p},event)">`:`<div class="orig-pg-h">${card.cname} · p.${p}</div><div class="orig-pg">${ORIG[card.cid][p]}</div>`).join('')}</div>`:''}`;})()}
        <div class="btn-row">
          <button class="mark-btn ${done?'done':''}" onclick="toggleDone(${card.gid},event)">

            ${isW?'⭐ 薄弱':'☆ 薄弱'}</button>

  updateNav(d); updateProg();

  if(open_gid){
    setTimeout(()=>{
      const el=document.getElementById('c'+open_gid);

function updateNav(d){
  const bp=document.getElementById('bp'), bn=document.getElementById('bn');
  if(!d.length){ bp.disabled=bn.disabled=true; return; }
  if(!open_gid){ bp.disabled=false; bn.disabled=false; return; }
  const i=d.findIndex(c=>c.gid===open_gid);
  bp.disabled = i===0;
  bn.disabled = i===d.length-1;

function toggle(gid){ open_gid = open_gid===gid?null:gid; orig_open=null; renderList(); }

function toggleDone(gid,e){
  e.stopPropagation();
  read.has(gid)?read.delete(gid):read.add(gid);
  save(); renderList(); renderStats();
}

function toggleWeak(gid,e){
  e.stopPropagation();
  weak.has(gid)?weak.delete(gid):weak.add(gid);

function setCourse(id){
  cur_course=id; open_gid=null; orig_open=null;

  cur_mode=m;

    document.getElementById('m-'+x).classList.toggle('on', m===x));

function toggleShuffle(){
  shuffle_on=!shuffle_on;
  if(shuffle_on){
    shuffle_order=[...DATA.keys()];
    for(let i=shuffle_order.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [shuffle_order[i],shuffle_order[j]]=[shuffle_order[j],shuffle_order[i]];

function randomPick(){
  const d=filtered();
  if(!d.length) return;

    if(el) el.scrollIntoView({behavior:'smooth',block:'center'});

/* ─── 图片查看器：原生级捏合缩放 ─── */
const V={s:1,tx:0,ty:0,bw:0,bh:0,cw:0,ch:0,min:1,max:6};
const vEl=id=>document.getElementById(id);

function openViewer(cid,p,e){
  e.stopPropagation();
  const img=vEl('viewer-img');
  vEl('viewer').style.display='block';
  const u=imgSrc(cid,p);
  if(!img.src.endsWith(u)){ img.src=u; img.onload=vInit; }
  if(img.complete&&img.naturalWidth) vInit();
}
function closeViewer(){ vEl('viewer').style.display='none'; }

function vInit(){
  const img=vEl('viewer-img'), st=vEl('viewer-stage');
  V.cw=st.clientWidth; V.ch=st.clientHeight;
  if(!img.naturalWidth||!V.cw) return;
  // 初始：横竖屏一律适配宽度（与竖屏阅读效果一致），上下滚动浏览
  V.bw=V.cw; V.bh=V.cw*img.naturalHeight/img.naturalWidth;
  img.style.width=V.bw+'px'; img.style.height=V.bh+'px';
  // 允许捏合缩小到整页可见（contain），不再往下
  V.min=Math.min(1, V.ch/V.bh, V.cw/V.bw);
  V.s=1; V.tx=0; V.ty=Math.max(0,(V.ch-V.bh)/2);
  vClamp(); vApply(false);
}
function vApply(anim){
  const img=vEl('viewer-img');
  img.style.transition=anim?'transform .25s ease':'none';
  img.style.transform=`translate3d(${V.tx}px,${V.ty}px,0) scale(${V.s})`;
}
function vClamp(){
  const W=V.bw*V.s, H=V.bh*V.s;
  V.tx = W<=V.cw ? (V.cw-W)/2 : Math.min(0,Math.max(V.cw-W,V.tx));
  V.ty = H<=V.ch ? (V.ch-H)/2 : Math.min(0,Math.max(V.ch-H,V.ty));
}
function vZoomAt(px,py,ns,anim){
  ns=Math.min(V.max,Math.max(V.min,ns));
  const k=ns/V.s;
  V.tx=px-(px-V.tx)*k; V.ty=py-(py-V.ty)*k; V.s=ns;
  vClamp(); vApply(anim);
}
(function(){
  const st=document.getElementById('viewer-stage');
  if(!st) return;
  let pinch=null, pan=null, lastTap=0, tapX=0, tapY=0;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX, t[0].clientY-t[1].clientY);
  const mid=t=>({x:(t[0].clientX+t[1].clientX)/2, y:(t[0].clientY+t[1].clientY)/2});

  st.addEventListener('touchstart',e=>{
    e.preventDefault();
    if(e.touches.length===2){
      pan=null;
      pinch={d:dist(e.touches), s:V.s, m:mid(e.touches), tx:V.tx, ty:V.ty};
    }else if(e.touches.length===1){
      const t=e.touches[0];
      pan={x:t.clientX, y:t.clientY, tx:V.tx, ty:V.ty, moved:false};
    }
  },{passive:false});

  st.addEventListener('touchmove',e=>{
    e.preventDefault();
    if(e.touches.length===2&&pinch){
      const m=mid(e.touches);
      let ns=pinch.s*dist(e.touches)/pinch.d;
      ns=Math.min(V.max,Math.max(V.min*.7,ns));      // 捏合过程允许轻微回弹
      const k=ns/pinch.s;
      V.s=ns;
      V.tx=m.x-(pinch.m.x-pinch.tx)*k;
      V.ty=m.y-(pinch.m.y-pinch.ty)*k;
      vApply(false);
    }else if(e.touches.length===1&&pan){
      const t=e.touches[0], dx=t.clientX-pan.x, dy=t.clientY-pan.y;
      if(Math.abs(dx)+Math.abs(dy)>8) pan.moved=true;
      if(V.bw*V.s>V.cw+1 || V.bh*V.s>V.ch+1){
        V.tx=pan.tx+dx; V.ty=pan.ty+dy; vClamp(); vApply(false); }
    }
  },{passive:false});

  st.addEventListener('touchend',e=>{
    if(pinch&&e.touches.length<2){
      if(V.s<V.min){ V.s=V.min; }                    // 回弹到最小可见比例
      vClamp(); vApply(true);
      pinch=null;
      if(e.touches.length===1){ const t=e.touches[0];
        pan={x:t.clientX, y:t.clientY, tx:V.tx, ty:V.ty, moved:true}; }
    }
    if(pan&&e.touches.length===0){
      if(!pan.moved){
        const now=Date.now();
        const px=pan.x, py=pan.y;
        if(now-lastTap<300&&Math.hypot(px-tapX,py-tapY)<40){
          // 双击：放大2.5倍 / 还原
          if(V.s>1.05) vZoomAt(px,py,1,true); else vZoomAt(px,py,2.5,true);
          lastTap=0;
        }else{ lastTap=now; tapX=px; tapY=py; }
      }
      pan=null;
    }
  });

  // 桌面端：滚轮缩放 + 拖拽 + 双击（方便电脑上用）
  st.addEventListener('wheel',e=>{
    e.preventDefault();
    vZoomAt(e.clientX,e.clientY,V.s*(e.deltaY<0?1.15:0.87),false);
  },{passive:false});
  st.addEventListener('dblclick',e=>{
    if(V.s>1.05) vZoomAt(e.clientX,e.clientY,1,true); else vZoomAt(e.clientX,e.clientY,2.5,true);
  });
  let mdrag=null;
  st.addEventListener('mousedown',e=>{ mdrag={x:e.clientX,y:e.clientY,tx:V.tx,ty:V.ty}; });
  st.addEventListener('mousemove',e=>{
    if(mdrag&&(V.bw*V.s>V.cw+1||V.bh*V.s>V.ch+1)){ V.tx=mdrag.tx+e.clientX-mdrag.x; V.ty=mdrag.ty+e.clientY-mdrag.y; vClamp(); vApply(false); }
  });
  ['mouseup','mouseleave'].forEach(ev=>st.addEventListener(ev,()=>mdrag=null));
  const refit=()=>{ if(vEl('viewer').style.display==='block') vInit(); };
  // 旋转后 iOS 尺寸更新有延迟，多次重适配确保横竖屏显示一致
  window.addEventListener('resize',()=>{ refit(); setTimeout(refit,120); });
  window.addEventListener('orientationchange',()=>{ setTimeout(refit,150); setTimeout(refit,400); });
})();

function updateProg(){
  document.getElementById('prog-f').style.width=Math.round(read.size/TOTAL*100)+'%';
  document.getElementById('rc').textContent=read.size;
}

function nav(dir){
  const d=filtered();
  if(!d.length) return;
  const ids=d.map(c=>c.gid);
  if(!open_gid){ open_gid=dir>0?ids[0]:ids[ids.length-1]; }
  else{
    const i=ids.indexOf(open_gid);
    const n=i+dir;
    if(n<0||n>=ids.length) return;
    open_gid=ids[n];
  }
  renderList();
}

document.getElementById('tc').textContent=TOTAL;
renderTabs(); renderStats(); renderHdr(); renderList();
</script>
</body>
