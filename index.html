<style>
/* === RESET & BASE === */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  background:#0C0E13;color:#E8E6E1;
  font-family:'DM Sans','Noto Sans SC',sans-serif;
  min-height:100%;min-height:100dvh;
  padding-bottom:calc(60px + env(safe-area-inset-bottom) + 8px);
  -webkit-font-smoothing:antialiased;color-scheme:dark;
  overscroll-behavior-y:none;
}
input,select,textarea{font-size:16px;-webkit-appearance:none;appearance:none;color-scheme:dark}

/* === CARD === */
.cd{background:rgba(255,255,255,0.03);border-radius:12px;border:1px solid rgba(255,255,255,0.06)}

/* === HEADER === */
.hd{
  background:linear-gradient(160deg,#14161D 60%,#18141F);
  border-bottom:1px solid rgba(232,185,49,0.12);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
  display:flex;align-items:center;gap:10px;
  position:sticky;top:0;z-index:80;
}
.lg{
  width:38px;height:38px;border-radius:10px;
  background:linear-gradient(135deg,#E8B931,#D4A017);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#0D0F14;
  font-family:'DM Mono',monospace;flex-shrink:0;
}

/* === 底部导航 === */
.bn{
  position:fixed;bottom:0;left:0;right:0;
  height:calc(58px + env(safe-area-inset-bottom));
  background:rgba(10,12,17,0.92);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:flex-start;
  padding-bottom:env(safe-area-inset-bottom);
  z-index:90;
}
.bni{
  flex:1;height:58px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1px;
  border:none;background:none;cursor:pointer;
  font-size:10px;font-weight:500;letter-spacing:0.1px;
  color:rgba(255,255,255,0.38);
  font-family:'DM Sans','Noto Sans SC',sans-serif;
  transition:color .15s;padding:0;
  -webkit-user-select:none;user-select:none;
}
.bni.on{color:#E8B931}
.bni:active{opacity:0.65}
.bni-icon{font-size:22px;line-height:1.2}

/* === FAB === */
.fab{
  position:fixed;
  right:20px;
  bottom:calc(env(safe-area-inset-bottom) + 58px + 16px);
  width:54px;height:54px;border-radius:27px;
  background:linear-gradient(135deg,#E8B931,#D4A017);

  z-index:85;
  -webkit-user-select:none;user-select:none;
  transition:transform .12s ease;
}
.fab:active{transform:scale(0.88)}

/* === 遮罩 === */
.bk{position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:199;display:none}

/* === 底部弹出表单 === */
.fp{

}
.fp.open{transform:translateY(0)}
.fp-handle{

/* === 购物卡相关 === */

.gctbar{height:7px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin:6px 0 4px}

/* === 交易条目 === */

/* === Toast === */
.toast{
  position:fixed;
  top:calc(env(safe-area-inset-top) + 12px);

  box-shadow:0 4px 16px rgba(0,0,0,0.5);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* === 自定义确认弹窗 === */

  opacity:0;pointer-events:none;transition:opacity .25s;
}
.cm-overlay.show{opacity:1;pointer-events:all}
.cm-dialog{
  width:100%;background:#1C1E27;
  border-radius:22px 22px 0 0;
  padding:22px 20px calc(20px + env(safe-area-inset-bottom));
  transform:translateY(100%);

}
.cm-overlay.show .cm-dialog{transform:translateY(0)}
.cm-msg{font-size:17px;font-weight:600;text-align:center;margin-bottom:22px;color:#E8E6E1;line-height:1.5}
.cm-btns{display:flex;flex-direction:column;gap:10px}
.cm-ok{
  width:100%;padding:15px;border-radius:14px;border:none;
  font-size:17px;font-weight:600;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  background:#E85D4A;color:#fff;min-height:52px;
}
.cm-cancel{
  width:100%;padding:15px;border-radius:14px;border:none;
  font-size:17px;font-weight:500;cursor:pointer;
  font-family:'DM Sans',sans-serif;
  background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.8);min-height:52px;
}

/* === 头部同步按钮 === */
.hd-sync{
  margin-left:auto;flex-shrink:0;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:10px;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  font-size:20px;cursor:pointer;
  transition:background .15s;
}
.hd-sync:active{background:rgba(255,255,255,0.12)}

/* === 设置/同步面板 === */
#sp{
  position:fixed;bottom:0;left:0;right:0;
  background:#14161D;
  border-top:2px solid rgba(91,168,140,0.3);
  border-radius:22px 22px 0 0;
  padding:0 16px calc(20px + env(safe-area-inset-bottom));
  z-index:202;
  box-shadow:0 -8px 40px rgba(0,0,0,0.75);
  max-height:92dvh;overflow-y:auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  transform:translateY(100%);
  transition:transform .32s cubic-bezier(0.32,0.72,0,1);
}
#sp.open{transform:translateY(0)}

/* === 同步操作按钮 === */
.sync-btn{
  width:100%;padding:15px;border-radius:14px;
  font-size:16px;font-weight:600;
  font-family:'DM Sans',sans-serif;cursor:pointer;
  min-height:52px;border:1px solid;
  transition:opacity .15s;
}
.sync-btn:active{opacity:0.75}
.sync-export{background:rgba(91,168,140,0.12);border-color:rgba(91,168,140,0.3);color:#5BA88C}
.sync-import{background:rgba(232,185,49,0.1);border-color:rgba(232,185,49,0.25);color:#E8B931}
.sync-tip{
  background:rgba(255,255,255,0.03);border-radius:10px;
  padding:12px 14px;font-size:13px;
  color:rgba(255,255,255,0.5);line-height:1.7;
}
</style>
</head>

<script>
/* ─── 常量 / 初始状态 ─── */
var LIM=2500,
C={"5x":{l:"餐饮/超市",m:5,c:"#E8B931",e:"🛒"},"3x":{l:"流媒体",m:3,c:"#7B8CDE",e:"📺"},"2x":{l:"交通/旅行",m:2,c:"#5BA88C",e:"✈️"},"1x":{l:"其他Amex",m:1,c:"#C4A882",e:"💳"}},
CK=["5x","3x","2x","1x"],
MZ=["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"],
ST={"5x":["Sobeys","Safeway","FreshCo","T&T大统华","餐饮","其他"],"3x":["Netflix","Spotify","Disney+","YouTube","Apple One","其他"],"2x":["加油","公交","Uber","机票","其他"],"1x":["Telus","保险","水电","Amazon","其他"],"other":["Wealthsimple","Debit卡","Visa","Mastercard","现金","其他"]},
GT=["Prepaid Mastercard","Prepaid Visa","Esso 加油卡","Shell 加油卡","Apple Gift Card","Google Play","Netflix","Amazon","其他"],
GTR=["Prepaid Mastercard","Prepaid Visa","Esso 加油卡","Shell 加油卡"];

var td=new Date(),S={y:td.getFullYear(),mo:td.getMonth()+1,tab:0,en:[],eId:null,fC:"5x",dId:null,xId:null,fCat:null,fSt:null,fGC:[],cEx:null};

function sk(y,m){return"hw-"+y+"-"+String(m).padStart(2,"0")}
function ok(y,m){return"hw-o-"+y+"-"+String(m).padStart(2,"0")}
function gi(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function fm(n){return"$"+n.toFixed(2)}
function dG(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
function dS(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function gk(){return"hw-gc"}
function lGC(){return dG(gk())||[]}
function sGC(a){dS(gk(),a)}

/* ─── Amex 5X 账单周期 (每月21日 - 下月20日) ─── */
function getCyclesForMonth(y,m){
  /* 与日历月 y/m 重叠的两个账单周期 */
  var py=m===1?y-1:y,pm=m===1?12:m-1;
  var ny=m===12?y+1:y,nm=m===12?1:m+1;
  /* 主周期：本月20日截止；次周期：本月21日起始 */
  return[
    {sy:py,sm:pm,sd:21,ey:y,em:m,ed:20,lb:'主'},
    {sy:y,sm:m,sd:21,ey:ny,em:nm,ed:20,lb:'次'}
  ];
}
function calc5XCycle(c){
  var total=0,count=0,gcAmt=0;
  var months=[];
  if(c.sy===c.ey&&c.sm===c.em){months.push({y:c.sy,m:c.sm,dmin:c.sd,dmax:c.ed})}
  else{months.push({y:c.sy,m:c.sm,dmin:c.sd,dmax:31});months.push({y:c.ey,m:c.em,dmin:1,dmax:c.ed})}
  months.forEach(function(mr){
    var entries=dG(sk(mr.y,mr.m))||[];
    entries.forEach(function(x){
      if(x.cat==="5x"&&x.day>=mr.dmin&&x.day<=mr.dmax){
        total+=x.amt;count++;
        if(x.cards)x.cards.forEach(function(cd){gcAmt+=cd.denom*cd.qty});
      }
    });
  });
  return{total:total,count:count,gcAmt:gcAmt};
}
function fmtCycle(c){
  /* 跨年时显示年份；同年时只显示月/日 */
  if(c.sy!==c.ey)return c.sm+'/'+c.sd+'/'+String(c.sy).slice(2)+' - '+c.em+'/'+c.ed+'/'+String(c.ey).slice(2);
  return c.sm+'/'+c.sd+' - '+c.em+'/'+c.ed;
}
function isCycleActive(c){
  /* 今天是否落在该周期内 */
  var n=new Date(),ny=n.getFullYear(),nm=n.getMonth()+1,nd=n.getDate();
  var s=new Date(c.sy,c.sm-1,c.sd),e=new Date(c.ey,c.em-1,c.ed),t=new Date(ny,nm-1,nd);
  return t>=s&&t<=e;
}

/* ─── Toast ─── */
var tt;
function toast(m){var e=document.getElementById("tst");e.textContent=m;e.classList.add("show");clearTimeout(tt);tt=setTimeout(function(){e.classList.remove("show")},2200)}

/* ─── 自定义确认弹窗 ─── */
function customConfirm(msg,okLabel){
  return new Promise(function(resolve){
    document.getElementById('cmMsg').textContent=msg;
    document.getElementById('cmOk').textContent=okLabel||"确认删除";
    document.getElementById('cmOverlay').classList.add('show');
    function done(v){document.getElementById('cmOverlay').classList.remove('show');resolve(v)}
    document.getElementById('cmOk').onclick=function(){done(true)};
    document.getElementById('cmCancel').onclick=function(){done(false)};
  });
}

  h+='<div style="margin-bottom:16px"><button class="sync-btn sync-import" onclick="triggerImport()">📥 导入备份文件</button><div style="font-size:12px;color:rgba(255,255,255,0.4);margin-top:6px;padding:0 2px">⚠️ 导入会覆盖当前设备的全部数据，请先导出备份再导入</div></div>';
  h+='<div class="sync-tip"><div style="font-weight:600;color:rgba(255,255,255,0.65);margin-bottom:6px">📋 同步步骤</div><div>① iPhone 上点「导出」→ 保存到「文件」App</div><div>② 通过 AirDrop / 微信 将 JSON 文件发到 Mac</div><div>③ Mac 打开网页 → 点「导入」→ 选择文件</div><div style="margin-top:6px;color:rgba(255,255,255,0.35)">反向操作同理，两端数据保持一致</div></div>';

  document.getElementById('sp').innerHTML=h;
  document.getElementById('bk').classList.add('open');
  requestAnimationFrame(function(){document.getElementById('sp').classList.add('open')});
}

function closeSettings(){
  document.getElementById('sp').classList.remove('open');
  document.getElementById('bk').classList.remove('open');
}

/* ═══════════════════════════════════
   导出 / 导入
═══════════════════════════════════ */
function exportData(){
  var payload={version:2,exportTime:new Date().toISOString(),device:navigator.userAgent.indexOf('iPhone')>-1?'iPhone':'Mac',store:{}};
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(k&&k.startsWith('hw-'))payload.store[k]=dG(k);
  }
  var json=JSON.stringify(payload,null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;
  var now=new Date();
  a.download='HW记账-'+now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(url)},1500);
  var ts=now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0')+'/'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  dS('hw-last-export',ts);
  toast('📤 备份文件已导出');
  setTimeout(openSettings,400);
}

function triggerImport(){document.getElementById('importFile').click()}

function importData(input){
  var file=input.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var payload=JSON.parse(e.target.result);
      var store=payload.store||payload;
      if(typeof store!=='object'||Array.isArray(store))throw new Error('格式错误');
      var hwKeys=Object.keys(store).filter(function(k){return k.startsWith('hw-')});
      if(!hwKeys.length)throw new Error('无有效数据');
      var months=hwKeys.filter(function(k){return /^hw-\d{4}-\d{2}$/.test(k)}).length;
      var cards=(store['hw-gc']||[]).length;
      var exportTime=payload.exportTime?payload.exportTime.replace('T',' ').slice(0,16):'未知时间';
      var device=payload.device||'未知设备';
      customConfirm(
        '导入来自 '+device+' 的备份\n导出时间：'+exportTime+'\n包含 '+months+' 个月份、'+cards+' 张购物卡\n\n⚠️ 将覆盖当前全部数据',
        '确认导入'
      ).then(function(ok){
        if(!ok){input.value='';return}
        var toRemove=[];
        for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&k.startsWith('hw-'))toRemove.push(k)}
        toRemove.forEach(function(k){localStorage.removeItem(k)});
        hwKeys.forEach(function(k){dS(k,store[k])});
        input.value='';
        toast('✅ 导入成功！共 '+hwKeys.length+' 条数据');
        closeSettings();
        S.en=[];S.dId=null;S.xId=null;S.fCat=null;S.cEx=null;
        ldM();
      });
    }catch(err){
      toast('❌ 文件格式错误，请选择正确的备份文件');
      input.value='';
    }
  };
  reader.readAsText(file,'utf-8');
}

/* ─── 启动 ─── */
seed();ldM();
